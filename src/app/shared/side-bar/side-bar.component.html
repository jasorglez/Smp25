<aside class="sidebar-hidden">
  <!-- Selects ocultos — inicializan signals del sistema -->
  <select id="root" (change)="onRootsSelected($event)">
    <option value="" disabled></option>
    <option *ngFor="let item of rootData" [value]="item.id">{{ item.name }}</option>
  </select>

  <select id="branchs" (change)="onBranchSelected($event)">
    <option value="" disabled></option>
    <option *ngFor="let item of branchData" [value]="'' + item.id">{{ item.name }}</option>
  </select>

  <span *ngIf="authService.hasDetailedPermission('principal', 'projects')">
    <select id="contracts" (change)="onContractsSelected($event)">
      <option value="" disabled></option>
      <option *ngFor="let item of contractData" [value]="'' + item.contractId">{{ item.contract }}</option>
    </select>

    <select id="project" (change)="onProjectSelected($event)">
      <option value="" disabled></option>
      <option *ngFor="let pj of projectData" [value]="'' + pj.idProject">{{ pj.projectName }}</option>
    </select>
  </span>
</aside>
