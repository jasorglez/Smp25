<aside
  class="d-flex flex-column border-end vh-100 sidebar sidebarback"
  [ngClass]="{ 
    collapsed: isSidebarCollapsed && !isTemporarilyExpanded,
    'temp-expanded': isTemporarilyExpanded 
  }"
>
  <div class="d-flex flex-column align-items-center p-2 border-bottom" *ngIf="!isSidebarCollapsed || isTemporarilyExpanded">
    <!-- Logo -->
    <img
      [src]="companyLogoSrc"
      (error)="onCompanyLogoError($event)"
      alt="Logo empresa"
      class="img-fluid sidebar-logo"
    />
  </div>

  <div class="flex-grow-1 overflow-auto p-2">
    <span class="visually-hidden" aria-hidden="true">{{ guardUiTick() }}</span>
<!-- Select Root -->
    <select
      id="root"
      (change)="onRootsSelected($event)"
      (focus)="beginSelectInteraction()"
      (blur)="onSidebarControlBlur()"
      (mousedown)="beginSelectInteraction()"
      class="form-select mb-2"
      [value]="selectedRoot || ''"
      [matTooltip]="isSidebarCollapsed && !isTemporarilyExpanded ? (('select' | translate) + ' ' + ('company' | translate)) : ''"
      matTooltipPosition="right"
    >
        <option selected value="" disabled>{{ "company" | translate }}</option>
      <option *ngFor="let item of rootData" [value]="item.id">
        {{ item.name }}
      </option>
    </select>

<!-- Select Branchs -->
    <select
      id="branchs"
      (change)="onBranchSelected($event)"
      (focus)="beginSelectInteraction()"
      (blur)="onSidebarControlBlur()"
      (mousedown)="beginSelectInteraction()"
      class="form-select mb-2"
      [value]="selectedBranchId"
      [matTooltip]="isSidebarCollapsed && !isTemporarilyExpanded ? (('select' | translate) + ' ' + ('branchs' | translate)) : ''"
      matTooltipPosition="right"
    >
      <option selected disabled value="">{{ "branchs" | translate }}</option>
      <option *ngFor="let item of branchData" [value]="'' + item.id">
        {{ item.name }}
      </option>
    </select>
    <span *ngIf="authService.hasDetailedPermission('principal', 'projects')">
      <span>Select Contracts</span>
<select
        id="contracts"
        (change)="onContractsSelected($event)"
        (focus)="beginSelectInteraction()"
        (blur)="onSidebarControlBlur()"
        (mousedown)="beginSelectInteraction()"
        class="form-select mb-2"
        [value]="selectedContractId"
        [matTooltip]="isSidebarCollapsed && !isTemporarilyExpanded ? (('select' | translate) + ' ' + ('contract' | translate)) : ''"
        matTooltipPosition="right"
      >
        <option selected disabled value="">
          {{ "contract" | translate }}
        </option>
        <option *ngFor="let item of contractData" [value]="'' + item.contractId">
          {{ item.contract }}
        </option>
      </select>

    </span>

      <ng-container *ngFor="let menu of sidebarMenus">
        <li class="nav-item" *ngIf="authService.hasMenuMasterPermission(menu.identifier)">
          <a
            class="nav-link d-flex align-items-center"
            [routerLink]="[menu.route]"
            routerLinkActive="active-link"
            (click)="onMenuItemClick(menu.permissionName)"
            [matTooltip]="(isSidebarCollapsed && !isTemporarilyExpanded) ? menu.permissionName : ''"
            matTooltipPosition="right"
          >
            <mat-icon>{{ menu.icon }}</mat-icon>
            <span>{{ menu.permissionName }}</span>
          </a>
        </li>
      </ng-container>
      
      <li class="nav-item">
<a
          class="nav-link d-flex align-items-center"
          [routerLink]="['/login']"
          routerLinkActive="active-link"
          (click)="authService.logout()"
          [matTooltip]="isSidebarCollapsed ? 'Salir' : ''"
          matTooltipPosition="right"
        >
          <mat-icon>logout</mat-icon> <span>Salir</span>
        </a>
      </li>
    
  </div>

  <!-- Botón de colapsar en la parte inferior -->
  <div class="sidebar-footer border-top">
    <!-- Logo pequeño cuando está colapsado -->
    <div *ngIf="isSidebarCollapsed && !isTemporarilyExpanded" class="collapsed-logo-container mb-2">
      <img
        [src]="companyLogoSrc"
        (error)="onCompanyLogoError($event)"
        alt="Logo empresa"
        class="collapsed-logo"
      />
    </div>
    <button
      class="btn btn-collapse"
      (click)="toggleSidebar()"
      [matTooltip]="isSidebarCollapsed ? 'Expandir menú' : 'Contraer menú'"
      matTooltipPosition="right"
    >
      <mat-icon>{{ (isSidebarCollapsed && !isTemporarilyExpanded) ? "chevron_right" : "chevron_left" }}</mat-icon>
      <span *ngIf="!isSidebarCollapsed || isTemporarilyExpanded" class="ms-2">Contraer</span>
    </button>
  </div>
</aside>
