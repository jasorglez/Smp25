<div class="p-3">
  <h5><i class="bi bi-gear"></i> Procesos</h5>
  <p class="text-muted">Módulo de Procesos - Red Ciudadana</p>

  <hr class="my-3">

  <div class="mb-1 fw-semibold small">Tema de la aplicación</div>
  <p class="text-muted small mb-2">Elige el tema visual. "Sistema" sigue la configuración del dispositivo.</p>

  <div class="btn-group" role="group" aria-label="Seleccionar tema">
    <button
      *ngFor="let opt of options"
      type="button"
      class="btn btn-sm"
      [class.btn-primary]="themeService.theme() === opt.value"
      [class.btn-outline-secondary]="themeService.theme() !== opt.value"
      (click)="setTheme(opt.value)">
      <i class="bi" [ngClass]="opt.icon"></i>
      {{ opt.label }}
    </button>
  </div>
</div>
