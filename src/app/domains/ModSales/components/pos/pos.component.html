<section class="pos-shell">
  <header class="pos-head pos-reveal">
    <div class="pos-head-left">
      <h2 class="pos-title">Punto de venta</h2>
      <p class="pos-subtitle" *ngIf="session">
        {{ session.storeName }} — {{ session.cashRegisterDesc }}
      </p>
    </div>
    <div class="pos-head-right d-flex align-items-center gap-2">
      <span class="badge" [class.bg-success]="isOnline" [class.bg-secondary]="!isOnline">
        <i class="bi" [class.bi-wifi]="isOnline" [class.bi-wifi-off]="!isOnline"></i>
        {{ isOnline ? 'En línea' : 'Sin conexión' }}
      </span>
      <span class="badge bg-warning text-dark" *ngIf="pendingCount > 0" title="Ventas pendientes de sync">
        <i class="bi bi-cloud-upload"></i> {{ pendingCount }}
      </span>
    </div>
  </header>

  <div class="pos-grid">
    <!-- Columna izquierda: cliente + producto -->
    <section class="pos-card pos-reveal-delay">
      <div class="pos-card-head">
        <div class="pos-card-title">
          <i class="bi bi-person-check"></i>
          <span>Cliente y producto</span>
        </div>
      </div>

      <div class="pos-fields">
        <div class="pos-field">
          <label class="pos-label">Seleccionar cliente</label>
          <ng-select
            [items]="clients"
            bindLabel="company"
            bindValue="id"
            placeholder="Buscar cliente..."
            (change)="onClientChange($event)"
            [searchable]="true"
            [(ngModel)]="idCustomer">
          </ng-select>
        </div>

        <div class="pos-field">
          <label class="pos-label">Buscar producto</label>
          <ng-select
            [items]="filteredProducts"
            bindLabel="description"
            bindValue="id"
            placeholder="Nombre o código de barras..."
            (change)="onProductSelect($event)"
            (search)="onProductSearchChange($event.term)"
            [searchable]="true">
            <ng-template ng-option-tmp let-item="item">
              <span class="small">{{ item.barCode || item.barcode }} — {{ item.description || item.insumo }}</span>
            </ng-template>
          </ng-select>
        </div>
      </div>

      <div class="pos-toggles">
        <label class="pos-toggle">
          <input class="pos-checkbox" type="checkbox" [(ngModel)]="lector" [ngModelOptions]="{standalone: true}">
          <span class="pos-toggle-text">Lector</span>
        </label>
        <label class="pos-toggle">
          <input class="pos-checkbox" type="checkbox" [(ngModel)]="credit" [ngModelOptions]="{standalone: true}">
          <span class="pos-toggle-text">Crédito</span>
        </label>
      </div>

      <div class="pos-field mt-2">
        <label class="pos-label">Forma de pago</label>
        <div class="btn-group w-100" role="group">
          <button type="button" class="btn btn-sm"
            [class.btn-success]="paymentType === 'EFECTIVO'"
            [class.btn-outline-secondary]="paymentType !== 'EFECTIVO'"
            (click)="paymentType = 'EFECTIVO'">
            <i class="bi bi-cash-coin"></i> Efectivo
          </button>
          <button type="button" class="btn btn-sm"
            [class.btn-primary]="paymentType === 'TARJETA'"
            [class.btn-outline-secondary]="paymentType !== 'TARJETA'"
            (click)="paymentType = 'TARJETA'">
            <i class="bi bi-credit-card"></i> Tarjeta
          </button>
          <button type="button" class="btn btn-sm"
            [class.btn-info]="paymentType === 'CHEQUE'"
            [class.btn-outline-secondary]="paymentType !== 'CHEQUE'"
            (click)="paymentType = 'CHEQUE'">
            <i class="bi bi-file-earmark-text"></i> Cheque
          </button>
          <button type="button" class="btn btn-sm"
            [class.btn-warning]="paymentType === 'VALES'"
            [class.btn-outline-secondary]="paymentType !== 'VALES'"
            (click)="paymentType = 'VALES'">
            <i class="bi bi-ticket-perforated"></i> Vales
          </button>
        </div>
      </div>
    </section>

    <!-- Columna derecha: grid de detalle -->
    <section class="pos-card pos-card--grid pos-reveal-delay-2">
      <div class="pos-card-head pos-card-head--grid">
        <div class="pos-card-title">
          <i class="bi bi-receipt"></i>
          <span>Detalle de venta</span>
        </div>
        <div class="pos-actions">
          <button type="button" class="btn btn-outline-danger btn-sm pos-icon-btn"
            (click)="deleteRow()" title="Eliminar fila seleccionada">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>

      <div class="pos-grid-wrap">
        <ag-grid-angular
          class="ag-theme-quartz small-text-ag-grid pos-ag"
          [rowData]="rowData"
          [columnDefs]="colMaster"
          (gridReady)="onGridReady($event)"
          [gridOptions]="gridOptions"
          [rowSelection]="rowSelection"
          [pivotPanelShow]="pivotPanelShow"
          [rowGroupPanelShow]="rowGroupPanelShow"
          [paginationPageSize]="paginationPageSize"
          [paginationPageSizeSelector]="paginationPageSizeSelector"
          [pagination]="true"
          [stopEditingWhenCellsLoseFocus]="true">
        </ag-grid-angular>
      </div>

      <footer class="pos-totalbar">
        <div class="pos-total-left">
          <span class="pos-total-label">Total</span>
          <span class="pos-total-amount">{{ formatCurrency(total) }}</span>
        </div>
        <button type="button" class="btn btn-primary pos-primary" (click)="printReceipt()">
          <i class="bi bi-printer"></i> Imprimir ticket
        </button>
      </footer>
    </section>
  </div>
</section>
