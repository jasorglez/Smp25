<div class="container py-3">
    <h2>Sucursal {{nameBranch}}</h2>
    <form class="bg-light p-3 rounded shadow-sm">
        <!-- Sección Customer -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="form-group">
                    <label for="idCustomer" class="form-label fw-semibold mb-1">Seleccionar cliente</label>
                    <ng-select [(ngModel)]="idCustomer" 
                             [items]="customers" 
                             id="idCustomer" 
                             placeholder="Buscar cliente..."
                             bindLabel="company" 
                             bindValue="id" 
                             [searchable]="true" 
                             (change)="onCustomerChange($event)"
                             [ngModelOptions]="{standalone: true}">
                    </ng-select>
                </div>
            </div>
        </div>

        <hr class="my-3">

        <!-- Configuración de documento -->
        <div class="row mb-3" [class.opacity-50]="!idCustomer">
            <div class="col-md-4">
                <div class="form-group">
                    <label for="documentType" class="form-label fw-semibold mb-1">Tipo de documento</label>
                    <ng-select [(ngModel)]="options.idDocumentType"
                             [items]="documentType" 
                             id="idDocumentType" 
                             [disabled]="!idCustomer"
                             placeholder="Seleccionar tipo..."
                             bindLabel="description" 
                             bindValue="id" 
                             [searchable]="true"
                             [ngModelOptions]="{standalone: true}">
                    </ng-select>
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label for="prefix" class="form-label fw-semibold mb-1">Prefijo Ticket</label>
                    <input type="text" 
                           class="form-control" 
                           name="prefix" 
                           id="prefix"
                           [disabled]="!idCustomer" 
                           [(ngModel)]="options.prefix">
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group">
                    <label for="consecutive" class="form-label fw-semibold mb-1">Consecutivo</label>
                    <input type="number" 
                           class="form-control" 
                           name="consecutive" 
                           id="consecutive"
                           [disabled]="!idCustomer" 
                           [(ngModel)]="options.consecutive">
                </div>
            </div>
        </div>

        <!-- Opciones adicionales -->
        <div class="row mb-3" [class.opacity-50]="!idCustomer">
            <div class="col-12">
                <div class="d-flex gap-4">
                    <div class="form-check form-switch">
                        <input type="checkbox" 
                               class="form-check-input" 
                               name="printScreen" 
                               id="printScreen"
                               [disabled]="!idCustomer" 
                               [(ngModel)]="options.printScreen">
                        <label class="form-check-label ms-2" for="printScreen">Imprimir recibo</label>
                    </div>
                    <div class="form-check form-switch">
                        <input type="checkbox" 
                               class="form-check-input" 
                               name="salesExistence" 
                               id="salesExistence"
                               [disabled]="!idCustomer" 
                               [(ngModel)]="options.salesExistence">
                        <label class="form-check-label ms-2" for="salesExistence">Existencia en ventas</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Configuración de Devoluciones -->
        <hr class="my-3">
        <h6 class="fw-semibold mb-2"><i class="bi bi-arrow-return-left me-1"></i>Devoluciones</h6>
        <div class="row mb-3" [class.opacity-50]="!idCustomer">
            <div class="col-md-3">
                <label class="form-label fw-semibold mb-1">Días límite para devolución</label>
                <input type="number" class="form-control" name="returnDays" id="returnDays"
                       [disabled]="!idCustomer" [(ngModel)]="options.returnDays"
                       min="0" max="365" placeholder="30">
                <div class="form-text text-muted">0 = sin límite de días</div>
            </div>
            <div class="col-md-9 d-flex align-items-center gap-4">
                <div class="form-check form-switch mt-3">
                    <input type="checkbox" class="form-check-input" name="requiresApproval" id="requiresApproval"
                           [disabled]="!idCustomer" [(ngModel)]="options.requiresApproval">
                    <label class="form-check-label ms-2" for="requiresApproval">Requiere aprobación</label>
                </div>
                <div class="form-check form-switch mt-3">
                    <input type="checkbox" class="form-check-input" name="returnToInventory" id="returnToInventory"
                           [disabled]="!idCustomer" [(ngModel)]="options.returnToInventory">
                    <label class="form-check-label ms-2" for="returnToInventory">Regresa al inventario</label>
                </div>
            </div>
        </div>

        <!-- Botones -->
        <div class="d-flex gap-2 mt-4">
            <button class="btn btn-primary px-3"
                    [disabled]="!idCustomer"
                    (click)="saveOptions()">
                <i class="fas fa-save me-2"></i>Guardar opciones
            </button>
            <button class="btn btn-secondary px-3"
                    (click)="cancel()"
                    [disabled]="!idCustomer">
                <i class="fas fa-times me-2"></i>Cancelar
            </button>
        </div>
    </form>

</div>
