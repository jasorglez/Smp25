<div class="container-fluid py-3">

  <!-- ── Controles ─────────────────────────────────────────────────────── -->
  <div class="row mb-3 g-2 align-items-end">
    <div class="col-md-5">
      <label class="form-label form-label-sm mb-1 fw-semibold">Proyecto</label>
      <select class="form-select form-select-sm" [(ngModel)]="selectedProject" (ngModelChange)="onProjectChange()">
        <option [ngValue]="null">— Seleccionar —</option>
        <option *ngFor="let p of projects" [ngValue]="p">{{ p.name || p.projectName || p.id }}</option>
      </select>
    </div>
    <div class="col-md-7">
      <div class="d-flex gap-2 justify-content-end flex-wrap">

        <!-- Agregar -->
        <button class="btn btn-sm btn-success" (click)="addRow()" [disabled]="!selectedProject">
          <i class="bi bi-plus-lg me-1"></i> Agregar
        </button>

        <!-- Guardar -->
        <button class="btn btn-sm btn-primary position-relative"
                (click)="saveChanges()"
                [disabled]="!hasUnsavedChanges || isSaving">
          <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-1" role="status"></span>
          <i *ngIf="!isSaving" class="bi bi-floppy me-1"></i>
          {{ isSaving ? 'Guardando…' : 'Guardar' }}
          <span *ngIf="hasUnsavedChanges && !isSaving"
                class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"></span>
        </button>

        <!-- Deshacer -->
        <button class="btn btn-sm btn-warning" (click)="revertChanges()" [disabled]="!hasUnsavedChanges">
          <i class="bi bi-arrow-clockwise me-1"></i> Deshacer
        </button>

        <!-- Eliminar seleccionado -->
        <button class="btn btn-sm btn-danger" (click)="deleteSelected()">
          <i class="bi bi-trash me-1"></i> Borrar
        </button>

        <!-- Excel -->
        <button class="btn btn-sm btn-outline-success" (click)="exportXLS()" title="Exportar Excel">
          <i class="bi bi-file-earmark-excel me-1"></i> Excel
        </button>
      </div>
    </div>
  </div>

  <!-- ── Mensaje de feedback ────────────────────────────────────────────── -->
  <div *ngIf="saveMsg"
       class="alert py-2 small mb-2"
       [class.alert-success]="saveMsgType === 'success'"
       [class.alert-danger]="saveMsgType === 'error'"
       role="alert">
    {{ saveMsg }}
  </div>

  <!-- ── Loading ────────────────────────────────────────────────────────── -->
  <div *ngIf="isLoading" class="text-center py-4">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-2 text-muted small">Cargando recursos…</p>
  </div>

  <!-- ── Sin proyecto seleccionado ─────────────────────────────────────── -->
  <div *ngIf="!selectedProject && !isLoading" class="text-center py-5 text-muted">
    <i class="bi bi-people-fill fs-1 opacity-25"></i>
    <p class="mt-2">Selecciona un proyecto para ver sus recursos</p>
  </div>

  <!-- ── Grid ──────────────────────────────────────────────────────────── -->
  <div *ngIf="selectedProject && !isLoading"
       class="ag-theme-quartz" style="height: calc(100vh - 320px); min-height: 400px;">
    <ag-grid-angular
      [rowData]="rowData"
      [columnDefs]="colDefs"
      [rowClassRules]="rowClassRules"
      (gridReady)="onGridReady($event)"
      rowSelection="single"
      [animateRows]="true">
    </ag-grid-angular>
  </div>

  <!-- ── Totales ───────────────────────────────────────────────────────── -->
  <div *ngIf="selectedProject" class="row mt-2 g-2">
    <div class="col-md-4 ms-auto">
      <div class="card card-body p-2 bg-light">
        <div class="d-flex justify-content-between small mb-1">
          <span class="fw-semibold text-primary">Total Planeado:</span>
          <span class="text-primary fw-bold">{{ totalPlan | number:'1.2-2' }}</span>
        </div>
        <div class="d-flex justify-content-between small mb-1">
          <span class="fw-semibold text-warning">Total Real:</span>
          <span class="text-warning fw-bold">{{ totalReal | number:'1.2-2' }}</span>
        </div>
        <div class="d-flex justify-content-between small">
          <span class="fw-semibold"
                [class.text-danger]="totalVar > 0"
                [class.text-success]="totalVar <= 0">Variación:</span>
          <span class="fw-bold"
                [class.text-danger]="totalVar > 0"
                [class.text-success]="totalVar <= 0">
            {{ totalVar | number:'1.2-2' }}
          </span>
        </div>
      </div>
    </div>
  </div>

</div>
