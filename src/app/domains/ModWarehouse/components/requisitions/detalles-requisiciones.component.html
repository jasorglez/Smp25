<div class="detail-grid-container">
  <div class="detail-actions d-flex justify-content-between align-items-center mb-1">
    <div>
      <span class="badge bg-warning text-dark" *ngIf="isLocked">
        <i class="bi bi-lock-fill me-1"></i> {{ isAuthorizationLocked ? 'Requisición autorizada' : 'Requisición en proceso de cotización' }} - Solo lectura
      </span>
      <span class="badge bg-info text-dark" *ngIf="!masterSaved && !isReadOnly">
        <i class="bi bi-info-circle me-1"></i> Al guardar las partidas también se guardará la requisición
      </span>
      <span class="required-fields-legend" *ngIf="!isReadOnly">
        <span class="required-mark">*</span> Campos obligatorios
      </span>
    </div>
    <div class="d-flex">
      <button class="btn btn-primary btn-xs me-1 py-0 px-2" (click)="addItem()" [disabled]="isReadOnly">
        <i class="bi bi-plus"></i> Agregar
      </button>
      <button class="btn btn-warning btn-xs me-1 py-0 px-2" (click)="discardChanges()" [disabled]="isReadOnly">
        <i class="bi bi-arrow-counterclockwise"></i> Deshacer
      </button>
      <button class="btn btn-danger btn-xs me-1 py-0 px-2" (click)="deleteSelectedItem()" [disabled]="isReadOnly">
        <i class="bi bi-trash"></i> Eliminar
      </button>
      <button class="btn btn-success btn-xs position-relative py-0 px-2" (click)="saveChanges()" [disabled]="isReadOnly">
        <i class="bi bi-floppy"></i> Guardar
        <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle unsaved-indicator"
          *ngIf="hasUnsavedChanges && !isReadOnly">
          <span class="visually-hidden">Hay cambios sin guardar</span>
        </span>
      </button>
      <button type="button" class="btn btn-outline-secondary btn-xs ms-2 py-0 px-2" (click)="closeDetail()"
        title="Cerrar detalle" aria-label="Cerrar detalle">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </div>
  <div class="code-search mb-2" *ngIf="!isReadOnly">
    <label for="requisition-code-search" class="small fw-semibold me-2">Buscar por código</label>
    <div class="code-search-field">
      <input id="requisition-code-search" class="form-control form-control-sm" type="search"
        placeholder="Escribe el código del material" [(ngModel)]="codeQuery"
        (input)="searchByCode()" (keydown.enter)="selectExactCode()" autocomplete="off">
      <div class="code-matches list-group" *ngIf="codeMatches.length">
        <button type="button" class="list-group-item list-group-item-action py-1" *ngFor="let material of codeMatches"
          (click)="selectCodeMatch(material)">
          <strong>{{ material.code }}</strong> · {{ material.description }}
        </button>
      </div>
    </div>
    <span class="text-muted small ms-2">O elige el material por descripción en el grid.</span>
  </div>
  <ag-grid-angular
    #agGrid
    class="ag-theme-quartz small-text-ag-grid detail-grid"
    [rowData]="rowData"
    [columnDefs]="colDefs"
    [gridOptions]="gridOptions"
    [localeText]="AG_GRID_LOCALE_ES"
    (gridReady)="onGridReady($event)"
    (cellValueChanged)="onCellValueChanged($event)">
  </ag-grid-angular>
</div>
