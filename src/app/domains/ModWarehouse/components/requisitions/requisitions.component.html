<app-multi-line-editor></app-multi-line-editor>
<div class="col-12 py-3">
  <!-- Título de la sección -->
  
  <!-- Mensaje cuando no hay configuración -->
  <div *ngIf="projectOrBranch === null" class="alert alert-info" role="alert">
    <i class="bi bi-info-circle-fill me-2"></i>
    Primero debe configurar el almacén en <strong>Setup</strong> para indicar si trabajará por Proyectos o Sucursales.
  </div>

  <!-- Mensaje cuando no hay proyecto/sucursal seleccionado -->
  <div *ngIf="projectOrBranch !== null && !idReference" class="alert alert-warning" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <span *ngIf="projectOrBranch">Seleccione un <strong>Proyecto</strong> en el menú lateral para ver las requisiciones.</span>
    <span *ngIf="!projectOrBranch">Seleccione una <strong>Sucursal</strong> en el menú lateral para ver las requisiciones.</span>
  </div>

  <!-- Botones y grid principal con master-detail -->
  <div class="row mb-3" *ngIf="idReference">
    <div class="col-auto">
      <div class="d-flex flex-column gap-1">
        <button type="button" class="btn btn-primary" (click)="addMasterRow()" title="Agregar nueva requisición">
          <i class="bi bi-plus-lg"></i>
        </button>

        <button type="button" class="btn btn-success position-relative" (click)="saveMasterChanges()" title="Guardar cambios">
          <i class="bi bi-floppy"></i>
          <span
            class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
            *ngIf="masterNotSavedChanges">
            <span class="visually-hidden">Hay cambios sin guardar</span>
          </span>
        </button>

        <button type="button" class="btn btn-warning" (click)="revertMasterData()" title="Deshacer cambios">
          <i class="bi bi-arrow-clockwise"></i>
        </button>

        <button type="button" class="btn btn-danger" (click)="deleteMasterEntry()" title="Eliminar requisición">
          <i class="bi bi-trash"></i>
        </button>
        
      </div>
    </div>

    <div class="col">
      <ag-grid-angular
        style="width: 100%; height: 75vh;"
        class="ag-theme-quartz small-text-ag-grid"
        [rowData]="masterRowData"
        [columnDefs]="colMaster"
        [gridOptions]="gridOptions"
        (selectionChanged)="onMasterSelectionChanged($event)"
        (cellValueChanged)="onMasterCellValueChanged($event)"
        (rowSelected)="onMasterRowSelected($event)"
        (gridReady)="onMasterGridReady($event)"
        [rowSelection]="rowSelection"
        [pivotPanelShow]="pivotPanelShow"
        [stopEditingWhenCellsLoseFocus]="true">
      </ag-grid-angular>
    </div>
  </div>
</div>
