
<div class="container-fluid mt-3">
  <!-- Main Content: Buttons Left, Grid Right -->
  <div class="row">
    <!-- Left Panel: CRUD Buttons -->
    <nav class="col-auto d-flex flex-column align-items-start">
      <button type="button" class="btn btn-primary me-1 mb-2" (click)="addRequisition()"
          *ngIf="authService.getCrudPermissionDetail('shoppingDelison', 'requisitions','Req_prin', 'create')">
        <i class="bi bi-plus-lg" style="font-size: 1rem;"></i>
      </button>

      <button type="button" class="btn btn-success position-relative mb-2" (click)="saveChanges()"
        *ngIf="authService.getCrudPermissionDetail('shoppingDelison', 'requisitions','Req_prin', 'create') || authService.getCrudPermissionDetail('shoppingDelison', 'requisitions','Req_prin', 'update')">
        <i class="bi bi-floppy" style="font-size: 1rem;"></i>
        <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
          *ngIf="hasUnsavedChanges">
          <span class="visually-hidden">Hay cambios sin guardar</span>
        </span>
      </button>

      <button type="button" class="btn btn-warning mb-2" (click)="refreshData()">
        <i class="bi bi-arrow-clockwise" style="font-size: 1rem;"></i>
      </button>

      <button type="button" class="btn btn-danger mb-2" (click)="deleteRequisition()"
        *ngIf="authService.getCrudPermissionDetail('shoppingDelison', 'requisitions','Req_prin', 'delete')">
        <i class="bi bi-trash" style="font-size: 1rem;"></i>
      </button>
    </nav>

    <!-- Right Panel: Grid -->
    <div class="col">
      <!-- Leyenda de colores -->
      <div class="d-flex gap-3 mb-2 align-items-center flex-wrap">
        <div class="d-flex align-items-center gap-1">
          <div style="width:14px; height:14px; border-radius:3px; background:#FFCC80; border:1px solid #e0a040; flex-shrink:0;"></div>
          <span style="font-size:11px; color:#555;">COMPRA NO AUTORIZADA</span>
        </div>
        <div class="d-flex align-items-center gap-1">
          <div style="width:14px; height:14px; border-radius:3px; background:#FFF59D; border:1px solid #d4c000; flex-shrink:0;"></div>
          <span style="font-size:11px; color:#555;">CAMBIO DE ESPECIFICACIÓN</span>
        </div>
      </div>

      <ag-grid-angular
        style="width: 100%;"
        [ngStyle]="{'height': gridHeight}"
        class="ag-theme-quartz small-text-ag-grid"
        [columnDefs]="colMaster"
        [rowData]="rowData"
        [gridOptions]="gridOptions"
        [defaultColDef]="defaultColDef"
        [localeText]="AG_GRID_LOCALE_ES"
        [components]="components"
        (gridReady)="onGridReady($event)"
        (selectionChanged)="onSelectionChanged($event)"
        (cellValueChanged)="onCellValueChanged($event)"
        (cellClicked)="onCellClicked($event)"
        (cellEditingStopped)="onCellEditingStopped($event)">
      </ag-grid-angular>
    </div>
  </div>
</div>
