<div class="provider-quote-container">
<!-- Header del proveedor -->
  <div class="provider-header d-flex justify-content-between align-items-center mb-3 p-3 rounded">
    <div class="d-flex align-items-center gap-3">
      <h5 class="mb-0">
        <i class="bi bi-shop me-2"></i>
        COTIZACIÓN - {{ providerName || 'PROVEEDOR ' + providerNumber }}
        <small class="ms-2" *ngIf="cotizId">(COTIZ #{{ cotizId }})</small>
        <span class="badge bg-success ms-2" *ngIf="isLocked">
          <i class="bi bi-lock-fill me-1"></i> GANADOR - OC Creada
        </span>
      </h5>
      <!-- Combo box para cambiar proveedor -->
      <div class="d-flex align-items-center gap-2" *ngIf="!isLocked">
        <label class="text-white small mb-0">Cambiar Proveedor:</label>
        <select class="form-select form-select-sm" style="width: 200px;"
                [disabled]="!proveedores || proveedores.length === 0">
          <option [ngValue]="null" selected>{{ providerName || 'Seleccione proveedor' }}</option>
          <option *ngFor="let prov of proveedores"
                  [ngValue]="prov.id"
                  [selected]="prov.id === idProvider">
            {{ prov.name }}
          </option>
        </select>
      </div>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-primary" (click)="convertToOC()"
              [disabled]="hasUnsavedChanges || rowData.length === 0 || isLocked"
              title="Convertir esta cotización en Orden de Compra">
        <i class="bi bi-cart-check"></i> Convertir a OC
      </button>
      <button class="btn btn-sm btn-outline-danger" (click)="generatePDF()">
        <i class="bi bi-file-earmark-pdf"></i> PDF
      </button>
      <button type="button" class="btn btn-sm btn-outline-secondary" (click)="revertChanges()"
              [disabled]="isLocked">
        <i class="bi bi-arrow-clockwise"></i> Deshacer
      </button>
      <button class="btn btn-sm btn-success position-relative" (click)="saveChanges()"
              [disabled]="!hasUnsavedChanges || isLocked">
        <i class="bi bi-floppy"></i> Guardar
        <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
              *ngIf="hasUnsavedChanges && !isLocked">
          <span class="visually-hidden">Hay cambios sin guardar</span>
        </span>
      </button>
      <button class="btn btn-sm btn-warning" (click)="deleteSelectedItem()" [disabled]="isLocked">
        <i class="bi bi-trash"></i> Borrar
      </button>
    </div>
  </div>

  <!-- Grid de cotización -->
  <div class="quote-grid-container" style="height: 500px;">
    <ag-grid-angular
      style="width: 100%; height: 100%;"
      [gridOptions]="gridOptions"
      [rowData]="rowData"
      [columnDefs]="colDefs"
      [localeText]="AG_GRID_LOCALE_ES"
      (gridReady)="onGridReady($event)">
    </ag-grid-angular>
  </div>
</div>
