<div class="container-fluid mt-4 mb-4 light-blue-background">
        <div class="container-fluid mt-4 mb-4 light-blue-background">
            <div class="col-12">
                <div class="form-group">
                    <label>{{ 'modules.shopping.ui.setup.viewRequisitionsBy' | translate }}</label>

                    <div>
                        <input type="radio" id="project" name="projectOrBranch" [(ngModel)]="warehouseSetup.projectOrBranch" [value]="true" (change)="onProjectOrBranchChange()">
                        <label for="project"> {{ 'modules.shopping.ui.projects' | translate }}</label>
                    </div>

                    <div>
                        <input type="radio" id="branch" name="projectOrBranch" [(ngModel)]="warehouseSetup.projectOrBranch" [value]="false" (change)="onProjectOrBranchChange()">
                        <label for="branch">{{ 'modules.shopping.ui.branches' | translate }}</label>
                    </div>

                </div>

                <!-- Sección de configuración según selección -->
                <div class="form-group mt-4" *ngIf="warehouseSetup.projectOrBranch !== null && warehouseSetup.projectOrBranch !== undefined">

                    <!-- Mensaje para Proyectos cuando no hay contrato seleccionado -->
                    <div *ngIf="warehouseSetup.projectOrBranch === true && !selectedContract" class="alert alert-warning" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        {{ 'modules.shopping.ui.setup.contractRequired' | translate }}
                    </div>

                    <!-- Formulario para Sucursales -->
                    <div *ngIf="warehouseSetup.projectOrBranch === false">
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="branchSelect">{{ 'modules.shopping.ui.branch' | translate }}:</label>
                                <select id="branchSelect" name="branchSelect" [(ngModel)]="selectedBranchOrProject" class="form-select" (change)="onBranchOrProjectSelection()">
                                    <option [value]="null">{{ 'modules.shopping.ui.setup.selectBranch' | translate }}</option>
                                    <option *ngFor="let branch of branches" [value]="branch.id">{{ branch.name || branch.description }}</option>
                                </select>
                            </div>
                        </div>
                        <!-- Campos de Prefijos para Sucursales -->
                        <div *ngIf="selectedBranchOrProject">
                            <h6 class="mt-3 mb-2">{{ 'modules.shopping.ui.setup.prefixConfiguration' | translate }}</h6>
                            <div class="row mb-2">
                                <div class="col-md-2"><label>{{ 'modules.shopping.ui.requisitions.title' | translate }}:</label></div>
                                <div class="col-md-2">
                                    <input type="text" [(ngModel)]="prefixReq" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.prefix' | translate" maxlength="10">
                                </div>
                                <div class="col-md-2">
                                    <input type="number" [(ngModel)]="consecutiveReq" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.consecutive' | translate" min="0">
                                </div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-md-2"><label>{{ 'modules.shopping.ui.quotes' | translate }}:</label></div>
                                <div class="col-md-2">
                                    <input type="text" [(ngModel)]="prefixCotiz" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.prefix' | translate" maxlength="7">
                                </div>
                                <div class="col-md-2">
                                    <input type="number" [(ngModel)]="consecutiveCotiz" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.consecutive' | translate" min="0">
                                </div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-md-2"><label>{{ 'modules.shopping.ui.receipts' | translate }}:</label></div>
                                <div class="col-md-2"><input type="text" [(ngModel)]="prefixEntry" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.prefix' | translate" maxlength="10"></div>
                                <div class="col-md-2"><input type="number" [(ngModel)]="consecutiveEntry" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.consecutive' | translate" min="0"></div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-md-2"><label>{{ 'modules.shopping.ui.issues' | translate }}:</label></div>
                                <div class="col-md-2"><input type="text" [(ngModel)]="prefixOut" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.prefix' | translate" maxlength="10"></div>
                                <div class="col-md-2"><input type="number" [(ngModel)]="consecutiveOut" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.consecutive' | translate" min="0"></div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-md-2"><label>{{ 'modules.shopping.ui.purchaseOrders' | translate }}:</label></div>
                                <div class="col-md-2">
                                    <input type="text" [(ngModel)]="prefixOc" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.prefix' | translate" maxlength="7">
                                </div>
                                <div class="col-md-2">
                                    <input type="number" [(ngModel)]="consecutiveOc" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.consecutive' | translate" min="0">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Formulario para Proyectos (solo si hay contrato seleccionado) -->
                    <div *ngIf="warehouseSetup.projectOrBranch === true && selectedContract">
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="projectSelect">{{ 'modules.shopping.ui.project' | translate }}:</label>
                                <select id="projectSelect" name="projectSelect" [(ngModel)]="selectedBranchOrProject" class="form-select" (change)="onBranchOrProjectSelection()">
                                    <option [value]="null">{{ 'modules.shopping.ui.setup.selectProject' | translate }}</option>
                                    <option *ngFor="let project of projects" [value]="project.id">{{ project.name || project.description }}</option>
                                </select>
                            </div>
                        </div>
                        <!-- Campos de Prefijos para Proyectos -->
                        <div *ngIf="selectedBranchOrProject">
                            <h6 class="mt-3 mb-2">{{ 'modules.shopping.ui.setup.prefixConfiguration' | translate }}</h6>
                            <div class="row mb-2">
                                <div class="col-md-2"><label>{{ 'modules.shopping.ui.requisitions.title' | translate }}:</label></div>
                                <div class="col-md-2">
                                    <input type="text" [(ngModel)]="prefixReq" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.prefix' | translate" maxlength="10">
                                </div>
                                <div class="col-md-2">
                                    <input type="number" [(ngModel)]="consecutiveReq" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.consecutive' | translate" min="0">
                                </div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-md-2"><label>{{ 'modules.shopping.ui.quotes' | translate }}:</label></div>
                                <div class="col-md-2">
                                    <input type="text" [(ngModel)]="prefixCotiz" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.prefix' | translate" maxlength="7">
                                </div>
                                <div class="col-md-2">
                                    <input type="number" [(ngModel)]="consecutiveCotiz" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.consecutive' | translate" min="0">
                                </div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-md-2"><label>{{ 'modules.shopping.ui.purchaseOrders' | translate }}:</label></div>
                                <div class="col-md-2">
                                    <input type="text" [(ngModel)]="prefixOc" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.prefix' | translate" maxlength="7">
                                </div>
                                <div class="col-md-2">
                                    <input type="number" [(ngModel)]="consecutiveOc" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.consecutive' | translate" min="0">
                                </div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-md-2"><label>{{ 'modules.shopping.ui.receipts' | translate }}:</label></div>
                                <div class="col-md-2"><input type="text" [(ngModel)]="prefixEntry" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.prefix' | translate" maxlength="10"></div>
                                <div class="col-md-2"><input type="number" [(ngModel)]="consecutiveEntry" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.consecutive' | translate" min="0"></div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-md-2"><label>{{ 'modules.shopping.ui.issues' | translate }}:</label></div>
                                <div class="col-md-2"><input type="text" [(ngModel)]="prefixOut" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.prefix' | translate" maxlength="10"></div>
                                <div class="col-md-2"><input type="number" [(ngModel)]="consecutiveOut" class="form-control form-control-sm" [placeholder]="'modules.shopping.ui.setup.consecutive' | translate" min="0"></div>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="form-group mt-4">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="activateOc" name="activateOc"
                               [(ngModel)]="warehouseSetup.activateOc">
                        <label class="form-check-label" for="activateOc">
                            {{ 'modules.shopping.ui.setup.enablePurchaseOrders' | translate }}
                        </label>
                    </div>
                </div>

                <div class="form-group mt-4">
                    <label for="notifications">{{ 'modules.shopping.ui.setup.enableNotifications' | translate }}</label>
                    <input type="checkbox" id="notifications" name="notifications">
                </div>
        
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group mt-4">
                            <label for="notificationChannels">{{ 'modules.shopping.ui.setup.notificationChannels' | translate }}</label>
                            <select id="notificationChannels" name="notificationChannels" multiple class="form-control">
                                <option value="email">{{ 'modules.shopping.ui.setup.email' | translate }}</option>
                                <option value="sms">SMS</option>
                                <option value="whatsapp">WhatsApp</option>
                                <option value="slack">Telegram</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group mt-4">
                            <label for="notificationEvents">{{ 'modules.shopping.ui.setup.notificationEvents' | translate }}</label>
                            <select id="notificationEvents" name="notificationEvents" multiple class="form-control">
                                <option value="lowStock">{{ 'modules.shopping.ui.setup.lowStock' | translate }}</option>
                                <option value="orderReceived">{{ 'modules.shopping.ui.setup.orderReceived' | translate }}</option>
                                <option value="orderDelayed">{{ 'modules.shopping.ui.setup.orderDelayed' | translate }}</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="mt-4 text-end">
                    <button type="button" class="btn btn-primary me-2" (click)="saveData()"><i
                            class="fas fa-save me-2"></i>{{ 'modules.shopping.ui.save' | translate }}</button>
                    <button type="button" class="btn btn-secondary" (click)="revertChanges()"><i
                            class="fas fa-times me-2"></i>{{ 'modules.shopping.ui.cancel' | translate }}</button>
                </div>
            </div>
        </div>
</div>
