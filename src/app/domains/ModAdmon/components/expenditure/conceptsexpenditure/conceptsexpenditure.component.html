<!-- conceptsexpenditure.component.html -->
<div class="container-fluid pt-2">
    <div class="row">
        <!-- Vertical buttons column -->
        <div class="col-auto pe-0">
            <div class="d-flex flex-column align-items-start gap-2">
                <button
                    type="button"
                    class="btn btn-primary btn-sm"
                    title="Añadir Concepto"
                    (click)="addRow()"
                    [disabled]="!idIncExp"> <!-- Disable if no parent Income/Expense is selected -->
                    <i class="bi bi-plus-lg"></i>
                </button>
                <button
                    type="button"
                    class="btn btn-success btn-sm position-relative"
                    title="Guardar Cambios"
                    (click)="saveChanges()"
                    [disabled]="!notSavedChanges"> <!-- Only enable if there are changes -->
                    <i class="bi bi-floppy"></i>
                    <!-- Change indicator -->
                    <span
                        *ngIf="notSavedChanges"
                        class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle">
                        <span class="visually-hidden">Hay cambios sin guardar</span>
                    </span>
                </button>
                <button
                    type="button"
                    class="btn btn-warning btn-sm"
                    title="Descartar Cambios"
                    (click)="revert()"
                    [disabled]="!notSavedChanges"> <!-- Only enable if there are changes -->
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
                
                <button
                    type="button"
                    class="btn btn-danger btn-sm"
                    title="Eliminar Concepto Seleccionado"
                    (click)="deleteEntry()"
                    [disabled]="!selectedData"> <!-- Enable only if a row is selected -->
                    <i class="bi bi-trash"></i>
                </button>
            </div>
        </div>
        
        <!-- AG Grid column -->
        <div class="col">
            <div class="h-100 position-relative">
                <ag-grid-angular
                    style="width: 100%; height: 37vh;"
                    class="ag-theme-quartz small-text-ag-grid"
                    [gridOptions]="gridOptions"
                    [rowData]="rowData"
                    [columnDefs]="colMaster"
                    [components]="components"
                    (selectionChanged)="onSelectionChanged($event)"
                    
                    (rowSelected)="onSelectedRow($event)"
                    (gridReady)="onGridReady($event)"
                    rowSelection="single"
                    [suppressRowClickSelection]="false"
                    [stopEditingWhenCellsLoseFocus]="true">
                </ag-grid-angular>
            </div>
           <!-- Mensaje overlay cuando no hay gasto seleccionado -->
                <div *ngIf="!idIncExp" class="grid-overlay-message">
                    <div class="alert alert-info text-center">
                        <p>Seleccione o cree un gasto para gestionar conceptos</p>
                    </div>
                </div>
        </div>
    </div>
</div>
    
    <!-- Totals Section - Always show when idIncExp is selected -->
  <!-- ESTO ES CORRECTO -->
<div *ngIf="idIncExp" class="row mt-2 justify-content-end small">
    <div class="col-auto">
        <span class="fw-bold">Subtotal:</span> {{ subtotal() | currency:'MXN':'symbol':'1.2-2' }}
    </div>
    <div class="col-auto">
        <span class="fw-bold">IVA ({{ivaPercent()}}%):</span> {{ iva2() | currency:'MXN':'symbol':'1.2-2' }}
    </div>
    <div class="col-auto">
        <span class="fw-bold">Total:</span> {{ total() | currency:'MXN':'symbol':'1.2-2' }}
    </div>
</div>
