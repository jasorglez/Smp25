<app-multi-line-editor></app-multi-line-editor>
<div class="row mb-3">
  <div class="col text-right">
    <button type="button" class="btn btn-warning ms-1 me-1" (click)="revert()"><i class="bi bi-arrow-clockwise"
       ></i></button>
  </div>
</div>

<div class="row">
  <!-- The AG Grid component -->
  <ag-grid-angular style="width: 100%; height: 32vh;" class="ag-theme-quartz" [rowData]="rowData"
    [columnDefs]="colMaster" (selectionChanged)="onSelectionChanged($event)"
    (cellValueChanged)="onCellValueChanged($event)" (rowSelected)="onSelectedRow($event)"
    (gridReady)="onGridReady($event)" rowSelection="single" [pivotPanelShow]="pivotPanelShow"
    [rowSelection]="rowSelection" [pagination]="true" [rowGroupPanelShow]="rowGroupPanelShow">
  </ag-grid-angular>

</div>
