<app-multi-line-editor></app-multi-line-editor>
<div class="col-12 mt-3">
  <div class="row mt-3">
    <!-- Columna de botones -->
    <div class="col-auto">
      <div class="d-flex flex-column gap-2">
        <button type="button" class="btn btn-primary" (click)="addRow()">
          <i class="bi bi-plus-lg"></i>
        </button>

        <button type="button" class="btn btn-success position-relative" (click)="saveChanges()">
          <i class="bi bi-floppy"></i>
          <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
            *ngIf="notSavedChanges">
            <span class="visually-hidden">Hay cambios sin guardar</span>
          </span>
        </button>

        <button type="button" class="btn btn-warning" (click)="revert()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>

        <button type="button" class="btn btn-danger" (click)="deleteEntry()">
          <i class="bi bi-trash"></i>
        </button>
        
        <button type="button" class="btn btn-secondary ms-1 me-1" (click)="resetGridSize()">
          <i class="bi bi-arrows-fullscreen"></i>
        </button>

         <!-- Botón para radio de influencia -->
         <button type="button" class="btn btn-warning btn-sm" (click)="openRadiusInfluenceModal()">
          <i class="bi bi-circle"></i>
        </button>
                
      </div>
    </div>

    <!-- Columna de la tabla -->
    <div class="col">
      <ag-grid-angular style="width: 100%;"
      [ngStyle]="{'height': gridHeight}"
      class="ag-theme-quartz small-text-ag-grid" 
      [rowData]="rowData"
        [columnDefs]="colMaster" (selectionChanged)="onSelectionChanged($event)" [gridOptions]="gridOptions"
        (cellValueChanged)="onCellValueChanged($event)" (rowSelected)="onSelectedRow($event)"
        (gridReady)="onGridReady($event)" rowSelection="single" [pivotPanelShow]="pivotPanelShow"
        [rowSelection]="rowSelection" [rowGroupPanelShow]="rowGroupPanelShow" >
      </ag-grid-angular>
    </div>
  </div>
</div>

  <div class="row">
    <div class="container-fluid">
      <ul class="nav nav-pills">
        
        
      </ul>

      <div class="tab-pane" [class.active]="selectedTab === 'customers-payments'"
      *ngIf="showCreditsTab">
        <app-customers-payments></app-customers-payments>
      </div>
     
    </div>
  </div>
