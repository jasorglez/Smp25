<app-multi-line-editor></app-multi-line-editor>
<div class="col-12">
  <div class="row">
    <!-- Columna de botones -->
    <div class="col-auto">
      <div class="d-flex flex-column gap-1">
        <button type="button" class="btn btn-primary ms-1 me-1" (mousedown)="$event.preventDefault()" (click)="addRow()" >
          <i class="bi bi-plus-lg"></i>
        </button>

        <button type="button" class="btn btn-success ms-1 me-1 position-relative" (mousedown)="$event.preventDefault()" (click)="saveChanges()" >
          <i class="bi bi-floppy"></i>
          <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
            *ngIf="notSavedChanges">
            <span class="visually-hidden">Hay cambios sin guardar</span>
          </span>
        </button>

        <button type="button" class="btn btn-warning ms-1 me-1" (click)="revert()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>

        <button type="button" class="btn btn-danger ms-1 me-1" (click)="deleteEntry()" >
          <i class="bi bi-trash"></i>
        </button>

        <!-- Botón alternativo: abre cascada de cotizaciones para el cliente seleccionado -->
        <button type="button"
                class="btn btn-info ms-1 me-1"
                (click)="openCotizacionesForSelected()"
                [disabled]="!selectedRowData || type !== 'CUSTOMERS'"
                title="Cotizaciones del cliente (abre cascada en la fila)">
          <i class="bi bi-file-earmark-text"></i>
        </button>

      </div>
    </div>

    <!-- Columna de la tabla -->
    <div class="col">
      <ag-grid-angular
      style="width: 100%;"
      [ngStyle]="{'height': gridHeight}"
      class="ag-theme-quartz small-text-ag-grid"
        [rowData]="rowData"
        [columnDefs]="colMaster"
        (selectionChanged)="onSelectionChanged($event)"
        [gridOptions]="gridOptions"
        (cellValueChanged)="onCellValueChanged($event)"
        (rowSelected)="onSelectedRow($event)"
        (gridReady)="onGridReady($event)"
        [pagination]="false"
        (cellDoubleClicked)="onCellDoubleClicked($event)"
        [components]="components"
        [stopEditingWhenCellsLoseFocus]="true"
        [localeText]="AG_GRID_LOCALE_ES">
      </ag-grid-angular>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-12">

    <div class="tab-content" id="myTabContent">
      <div class="tab-pane fade show active" id="credits" role="tabpanel" aria-labelledby="credit-tab" *ngIf="showCreditsTab">
        <app-customers-payments></app-customers-payments>
      </div>

      <div class="tab-pane fade show active" id="billing" role="tabpanel" aria-labelledby="billing-tab" *ngIf="showBillingTab">
        <app-customers-billing></app-customers-billing>
      </div>
    </div>

  </div>
</div>
