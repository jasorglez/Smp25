<div class="col-12">
  <div class="row align-items-start">

    <!-- Sección Créditos -->
    <div class="col-7">
      <div class="card shadow-sm">
        <div class="card-header">
          <h3 class="card-title mb-0">Créditos</h3>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-auto">
              <div class="d-flex flex-column gap-0 me-0">
                <button type="button" class="btn btn-primary" (click)="addRow('Master')">
                  <i class="bi bi-plus-lg"></i>
                </button>
                <button type="button" class="btn btn-success position-relative" (click)="saveMasterChanges()">
                  <i class="bi bi-floppy"></i>
                  <span class="position-absolute top-0 end-0 translate-middle p-2 bg-danger border border-light rounded-circle"
                    *ngIf="masterNotSavedChanges">
                    <span class="visually-hidden">Hay cambios sin guardar</span>
                  </span>
                </button>
                <button type="button" class="btn btn-warning" (click)="revertMasterData()">
                  <i class="bi bi-arrow-clockwise"></i>
                </button>
                <button type="button" class="btn btn-danger" (click)="deleteMasterEntry()"><i class="bi bi-trash"></i></button>

              </div>
            </div>

            <div class="col p-0">
              <ag-grid-angular class="ag-theme-quartz small-text-ag-grid master-grid" style="height: 40vh;"
              [rowData]="maestroRowData" [columnDefs]="maestroColumnDefs" [gridOptions]="maestroGridOptions"
              (selectionChanged)="onMaestroSelectionChanged($event)"
              (cellValueChanged)="onMasterCellValueChanged($event)" (gridReady)="onMaestroGridReady($event)"
              [rowSelection]="'single'">
            </ag-grid-angular>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Sección Abonos del Crédito -->
    <div class="col-5">
      <div class="card shadow-sm">
        <div class="card-header">
          <h3 class="card-title mb-0">Abonos del Crédito</h3>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="col-auto">
              <div class="d-flex flex-column gap-0 me-0">
                <button type="button" class="btn btn-primary" (click)="addRow('Detailed')">
                  <i class="bi bi-plus-lg"></i>
                </button>
                <button type="button" class="btn btn-success position-relative" (click)="saveDetailChanges()">
                  <i class="bi bi-floppy"></i>
                  <span class="position-absolute top-0 end-0 translate-middle p-2 bg-danger border border-light rounded-circle"
                    *ngIf="detailNotSavedChanges">
                    <span class="visually-hidden">Hay cambios sin guardar</span>
                  </span>
                </button>
                <button type="button" class="btn btn-warning" (click)="revertDetailData()">
                  <i class="bi bi-arrow-clockwise"></i>
                </button>
                <button type="button" class="btn btn-danger" (click)="deleteDetalleEntry()"><i class="bi bi-trash"></i></button>

              </div>
            </div>
            <div class="col p-0">
              <ag-grid-angular class="ag-theme-quartz small-text-ag-grid detail-grid" style="height: 40vh;"
                [rowData]="detalleRowData" [columnDefs]="detalleColumnDefs" [gridOptions]="detalleGridOptions"
                (gridReady)="onDetalleGridReady($event)" [rowSelection]="'single'"
                (cellValueChanged)="onDetailCellValueChanged($event)">
              </ag-grid-angular>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
