<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h5><i class="bi bi-receipt"></i> Facturación Electrónica</h5>
        </div>
        <div class="card-body">

          <!-- Primera Card: Comprobante -->
          <div class="card mb-4">
            <div class="card-header">
              <h6><i class="bi bi-file-earmark-text"></i> Comprobante</h6>
            </div>
            <div class="card-body">
              <form class="row g-3">
                <div class="col-md-4">
                  <label for="regimenFiscal" class="form-label">Régimen Fiscal</label>
                  <select class="form-select" id="regimenFiscal" [(ngModel)]="comprobante.regimenFiscal" name="regimenFiscal">
                    <option value="">Seleccionar...</option>
                    <option *ngFor="let regimen of regimenesFiscales" [value]="regimen.id">
                      {{ regimen.description }}
                    </option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label for="codigoPostal" class="form-label">Código Postal Empresa</label>
                  <input type="text" class="form-control" id="codigoPostal" [(ngModel)]="comprobante.codigoPostal" name="codigoPostal" maxlength="5">
                </div>
                <div class="col-md-4">
                  <label for="fechaEmision" class="form-label">Fecha de Emisión</label>
                  <input type="datetime-local" class="form-control" id="fechaEmision" [(ngModel)]="comprobante.fechaEmision" name="fechaEmision">
                </div>
                <div class="col-md-4">
                  <label for="tipoFactura" class="form-label">Tipo de Factura</label>
                  <select class="form-select" id="tipoFactura" [(ngModel)]="comprobante.tipoFactura" name="tipoFactura">
                    <option value="">Seleccionar...</option>
                    <option *ngFor="let tipo of tiposComprobante" [value]="tipo.tipoDeComprobante">
                      {{ tipo.descripcion }}
                    </option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label for="formaPago" class="form-label">Forma de Pago</label>
                  <select class="form-select" id="formaPago" [(ngModel)]="comprobante.formaPago" name="formaPago">
                    <option value="">Seleccionar...</option>
                    <option *ngFor="let forma of formasPago" [value]="forma.formaPagoValue">
                      {{ forma.descripcion }}
                    </option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label for="metodoPago" class="form-label">Método de Pago</label>
                  <select class="form-select" id="metodoPago" [(ngModel)]="comprobante.metodoPago" name="metodoPago">
                    <option value="">Seleccionar...</option>
                    <option *ngFor="let metodo of metodosPago" [value]="metodo.metodoPagoValue">
                      {{ metodo.descripcion }}
                    </option>
                  </select>
                </div>
              </form>
            </div>
          </div>

          <!-- Segunda Card: Datos Generales -->
          <div class="card mb-4">
            <div class="card-header">
              <h6><i class="bi bi-info-circle"></i> Datos Generales</h6>
            </div>
            <div class="card-body">
              <form class="row g-3">
                <div class="col-md-6">
                  <label for="moneda" class="form-label">Moneda</label>
                  <select class="form-select" id="moneda" [(ngModel)]="datosGenerales.moneda" name="moneda">
                    <option value="">Seleccionar...</option>
                    <option *ngFor="let mon of monedas" [value]="mon.cMoneda">
                      {{ mon.descripcion }}
                    </option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="tipoCambio" class="form-label">Tipo de Cambio</label>
                  <input type="number" class="form-control" id="tipoCambio" [(ngModel)]="datosGenerales.tipoCambio" name="tipoCambio" step="0.01">
                </div>
              </form>
            </div>
          </div>

          <!-- Tercera Card: Datos del Cliente -->
          <div class="card mb-4">
            <div class="card-header">
              <h6><i class="bi bi-person"></i> Datos del Cliente</h6>
            </div>
            <div class="card-body">
              <form class="row g-3">
                <div class="col-md-6">
                  <label for="cliente" class="form-label">Cliente</label>
                  <select class="form-select" id="cliente" [(ngModel)]="cliente.clienteSeleccionado" name="cliente">
                    <option value="">Seleccionar cliente...</option>
                    <option *ngFor="let cli of clientes" [value]="cli.id">
                      {{ cli.name }}
                    </option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="nombreRazonSocial" class="form-label">Nombre o Razón Social</label>
                  <input type="text" class="form-control" id="nombreRazonSocial" [(ngModel)]="cliente.nombreRazonSocial" name="nombreRazonSocial">
                </div>
                <div class="col-md-6">
                  <label for="codigoPostalCliente" class="form-label">Código Postal</label>
                  <input type="text" class="form-control" id="codigoPostalCliente" [(ngModel)]="cliente.codigoPostal" name="codigoPostalCliente" maxlength="5">
                </div>
                <div class="col-md-6">
                  <label for="regimenFiscalCliente" class="form-label">Régimen Fiscal</label>
                  <select class="form-select" id="regimenFiscalCliente" [(ngModel)]="cliente.regimenFiscal" name="regimenFiscalCliente">
                    <option value="">Seleccionar régimen fiscal...</option>
                    <option *ngFor="let regimen of regimenesFiscales" [value]="regimen.id">
                      {{ regimen.description }}
                    </option>
                  </select>
                </div>
                <div class="col-md-12">
                  <label for="usoFactura" class="form-label">Uso de la Factura</label>
                  <select class="form-select" id="usoFactura" [(ngModel)]="cliente.usoFactura" name="usoFactura">
                    <option value="">Seleccionar uso de factura...</option>
                    <option *ngFor="let uso of usosFactura" [value]="uso.cUsoCFDI">
                      {{ uso.descripcion }}
                    </option>
                  </select>
                </div>
              </form>
            </div>
          </div>

          <!-- Cuarta Card: Productos y Servicios -->
          <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
              <h6><i class="bi bi-box-seam"></i> Productos y Servicios</h6>
              <button type="button" class="btn btn-primary btn-sm" (click)="agregarProducto()">
                <i class="bi bi-plus-lg"></i> Agregar
              </button>
            </div>
            <div class="card-body p-1">
              <div class="table-responsive">
                <table class="table table-striped table-hover">
                  <thead>
                    <tr>
                      <th>Descripción Detallada</th>
                      <th>Producto o Servicio</th>
                      <th>Unidad de Medida</th>
                      <th>Cantidad</th>
                      <th>Valor Unitario</th>
                      <th>Importe</th>
                      <th>Objeto de Impuesto</th>
                      <th>Número de Identificación</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr *ngFor="let producto of productos; let i = index">
                      <td>
                        <input type="text" class="form-control form-control-sm" [(ngModel)]="producto.descripcionDetallada" [name]="'descripcionDetallada_' + i">
                      </td>
                      <td>
                        <div class="input-group input-group-sm">
                          <span class="input-group-text" style="cursor: pointer;" title="Buscar producto o servicio">
                            <i class="bi bi-search"></i>
                          </span>
                          <input type="text"
                                 class="form-control form-control-sm"
                                 [(ngModel)]="producto.productoServicio"
                                 [name]="'productoServicio_' + i"
                                 placeholder="Producto o servicio"
                                 [title]="'Escribe las tres primeras letras de la descripcion o la clave completa conforme al catalogo. Podras Consulta la clave en el icono de la busqueda'">
                        </div>
                      </td>
                      <td>
                        <input type="text" class="form-control form-control-sm" [(ngModel)]="producto.unidadMedida" [name]="'unidadMedida_' + i">
                      </td>
                      <td>
                        <input type="number" class="form-control form-control-sm" [(ngModel)]="producto.cantidad" [name]="'cantidad_' + i" step="0.001" (input)="calcularImporte(i)">
                      </td>
                      <td>
                        <input type="number" class="form-control form-control-sm" [(ngModel)]="producto.valorUnitario" [name]="'valorUnitario_' + i" step="0.01" (input)="calcularImporte(i)">
                      </td>
                      <td>
                        <input type="number" class="form-control form-control-sm" [(ngModel)]="producto.importe" [name]="'importe_' + i" readonly>
                      </td>
                      <td>
                        <select class="form-select form-select-sm" [(ngModel)]="producto.objetoImpuesto" [name]="'objetoImpuesto_' + i">
                          <option value="">Seleccionar...</option>
                          <option *ngFor="let objeto of objetosImpuesto" [value]="objeto.id">
                            {{ objeto.descripcion }}
                          </option>
                        </select>
                      </td>
                      <td>
                        <input type="text" class="form-control form-control-sm" [(ngModel)]="producto.numeroIdentificacion" [name]="'numeroIdentificacion_' + i">
                      </td>
                      <td>
                        <button type="button" class="btn btn-danger btn-sm" (click)="eliminarProducto(i)">
                          <i class="bi bi-trash"></i>
                        </button>
                      </td>
                    </tr>
                  </tbody>
                  <tfoot>
                    <tr>
                      <td colspan="5" class="text-end"><strong>Total:</strong></td>
                      <td><strong>{{ calcularTotal() | number:'1.2-2' }}</strong></td>
                      <td colspan="3"></td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
