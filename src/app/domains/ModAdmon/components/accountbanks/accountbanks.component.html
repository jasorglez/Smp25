<app-multi-line-editor></app-multi-line-editor>
<div class="col-12">
  <div class="row">  <!-- Fila principal contenedora -->
    <!-- Columna para botones verticales -->
    <div class="col-auto">
      <div class="d-flex flex-column gap-1 me-3">  <!-- Contenedor vertical -->
        <button type="button" class="btn btn-primary" (click)="addRow()" >
          <i class="bi bi-plus-lg"></i>
        </button>
        <button type="button" class="btn btn-success position-relative" (click)="saveChanges()">
          <i class="bi bi-floppy"></i>
          <span class="position-absolute top-0 end-0 translate-middle p-2 bg-danger border border-light rounded-circle"
            *ngIf="notSavedChanges">
            <span class="visually-hidden">Hay cambios sin guardar</span>
          </span>
        </button>
        <button type="button" class="btn btn-warning" (click)="revert()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button type="button" class="btn btn-danger" (click)="deleteEntry()" >
          <i class="bi bi-trash"></i>
        </button>
        <button type="button" class="btn btn-info" (click)="openSaldosModal()"
                [disabled]="!selectedRowData || !rowDetails?.length"
                title="Reporte de Saldos PDF">
          <i class="bi bi-file-earmark-pdf"></i>
        </button>
      </div>
    </div>

    <!-- Columna contenedora de ambos grids -->
    <div class="col d-flex flex-column gap-3">
      <!-- Loading Indicator -->
      <div *ngIf="isLoading" class="text-center p-3">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-2">Cargando datos...</p>
      </div>

      <!-- Grid Maestro -->
      <ag-grid-angular
        *ngIf="!isLoading"
        class="ag-theme-quartz small-text-ag-grid master-grid"
        style="width: 100%; height: 300px;"
        [rowData]="rowMaster"
        [columnDefs]="colMaster"
        [gridOptions]="gridOptions"
        (selectionChanged)="onSelectionChanged($event)"
        (cellValueChanged)="onCellValueChanged($event)"
        (gridReady)="onMasterGridReady($event)"
        [rowSelection]="'single'"
        [pivotPanelShow]="pivotPanelShow"
        
        [stopEditingWhenCellsLoseFocus]="true">
      </ag-grid-angular>

      <!-- Grid Detalle -->
      <ag-grid-angular
        *ngIf="!isLoading"
        class="ag-theme-quartz small-text-ag-grid detail-grid"
        style="width: 100%; height: 400px;"
        [rowData]="rowDetails"
        [columnDefs]="colDetails"
        (gridReady)="onDetailGridReady($event)"
        [rowSelection]="'single'"
        [pivotPanelShow]="pivotPanelShow">
      </ag-grid-angular>
    </div>
  </div>
</div>

<!-- Modal Reporte de Saldos -->
<div class="modal fade" [class.show]="showSaldosModal" [style.display]="showSaldosModal ? 'block' : 'none'" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header bg-info text-white">
        <h5 class="modal-title">
          <i class="bi bi-file-earmark-pdf me-2"></i>Reporte de Saldos
        </h5>
        <button type="button" class="btn-close btn-close-white" (click)="closeSaldosModal()" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted mb-3 small">
          <i class="bi bi-bank me-1"></i>
          <strong>{{ selectedRowData?.nameAccount }}</strong>
        </p>
        <form>
          <div class="mb-3">
            <label for="saldosStartDate" class="form-label">Fecha de Inicio <span class="text-danger">*</span></label>
            <input type="date" class="form-control" id="saldosStartDate"
                   [(ngModel)]="reportSaldosStartDate" name="saldosStartDate" required>
          </div>
          <div class="mb-3">
            <label for="saldosEndDate" class="form-label">Fecha de Término <span class="text-danger">*</span></label>
            <input type="date" class="form-control" id="saldosEndDate"
                   [(ngModel)]="reportSaldosEndDate" name="saldosEndDate" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeSaldosModal()">
          <i class="bi bi-x-lg me-1"></i>Cancelar
        </button>
        <button type="button" class="btn btn-info text-white"
                (click)="generateSaldosReport()"
                [disabled]="!reportSaldosStartDate || !reportSaldosEndDate || isGeneratingSaldosReport">
          <span *ngIf="isGeneratingSaldosReport" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          <i *ngIf="!isGeneratingSaldosReport" class="bi bi-file-earmark-pdf me-1"></i>
          {{ isGeneratingSaldosReport ? 'Generando...' : 'Generar PDF' }}
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade" [class.show]="showSaldosModal" [style.display]="showSaldosModal ? 'block' : 'none'"></div>
