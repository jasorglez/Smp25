<app-multi-line-editor></app-multi-line-editor>
<div class="col-12 ">
  <div class="row mb-1">
    <div class="col text-right"><button type="button" class="btn btn-primary me-1" (click)="addRow()"><i
          class="bi bi-plus-lg" style="font-size: 1.2rem;"></i></button>
      <button type="button" class="btn btn-success ms-1 me-1 position-relative" (click)="saveChanges()">
        <i class="bi bi-floppy" style="font-size: 1.2rem;"></i>
        <span
          class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
          *ngIf="notSavedChanges"><span class="visually-hidden">Hay cambios sin guardar</span>
        </span>
      </button>
      <button type="button" class="btn btn-warning ms-1 me-1" (click)="revert()"><i class="bi bi-arrow-clockwise"
          style="font-size: 1.2rem;"></i></button>
      <button type="button" class="btn btn-danger ms-1 me-1" (click)="deleteEntry()"><i class="bi bi-trash"
          style="font-size: 1.2rem;"></i></button>
    </div>
  </div>

  <div class="row">
<!--  EL maestro de las cuentas arriba-->
    <!-- The AG Grid component -->
    <ag-grid-angular 
        class="ag-theme-quartz master-grid"
        style="width: 100%; height: 300px;" 
        [rowData]="rowMaster"
        [columnDefs]="colMaster" 
        (selectionChanged)="onSelectionChanged($event)"
        (cellValueChanged)="onCellValueChanged($event)" 
        (gridReady)="onMasterGridReady($event)"
        [rowSelection]="'single'" 
        [pivotPanelShow]="pivotPanelShow"
        [rowGroupPanelShow]="rowGroupPanelShow">
</ag-grid-angular>

  </div>

  <!--  EL Detalle de las cuentas abajo-->
   <div class="row">
    <!-- The AG Grid component -->
    <ag-grid-angular 
        class="ag-theme-quartz detail-grid" 
        style="width: 100%; height: 400px;" 
        [rowData]="rowDetails"
        [columnDefs]="colDetails" 
        (gridReady)="onDetailGridReady($event)" 
        [rowSelection]="'single'" 
        [pivotPanelShow]="pivotPanelShow"
        [rowGroupPanelShow]="rowGroupPanelShow">
</ag-grid-angular>

  </div>
</div>
