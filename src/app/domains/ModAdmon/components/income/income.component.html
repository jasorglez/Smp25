<app-multi-line-editor></app-multi-line-editor>
<div class="col-12">
  <div class="row mt-3 mb-3">
    <div class="col">
      <ng-select
        [items]="bankAccounts"
        bindValue="id"
        [(ngModel)]="idAccount"
        [disabled]="!bankAccounts?.length"
        placeholder="{{
          bankAccounts?.length
            ? 'Seleccione cuenta bancaria'
            : 'No hay cuentas disponibles'
        }}"
      >
        <ng-template ng-label-tmp let-item="item">
          {{ item?.nameAccount }} - {{ item?.bankName }}
        </ng-template>
        <ng-template ng-option-tmp let-item="item">
          {{ item.nameAccount }} - {{ item.bankName }}
        </ng-template>
      </ng-select>
    </div>
  </div>

  <!-- Leyenda de estatus -->
  <div class="row mb-2">
    <div class="col-12">
      <div class="d-flex flex-wrap gap-2">
        <span class="badge bg-primary text-white p-2">
          <i class="bi bi-square-fill me-1"></i> Pendiente
        </span>
        <span class="badge bg-success text-white p-2">
          <i class="bi bi-square-fill me-1"></i> Pagada
        </span>
        <span class="badge bg-danger text-white p-2">
          <i class="bi bi-square-fill me-1"></i> Cancelada
        </span>
        <span class="badge bg-warning text-dark p-2">
          <i class="bi bi-square-fill me-1"></i> Entregada
        </span>
      </div>
    </div>
  </div>

  <div class="row mb-3">
    <!-- Columna vertical para botones -->
    <div class="col-auto pe-0">
      <div class="d-flex flex-column align-items-start gap-2">
        <button
          type="button"
          class="btn btn-primary"
          (click)="addRow()"
          [disabled]="!idAccount"
          *ngIf="authService.getCrudPermission('administration', 'income', 'create')"
        >
          <i class="bi bi-plus-lg"></i>
        </button>
        <button
          type="button"
          class="btn btn-success position-relative"
          (click)="saveChanges()"
          [disabled]="!idAccount || !notSavedChanges"
          *ngIf="authService.getCrudPermission('administration', 'income', 'create') || authService.getCrudPermission('administration', 'income', 'update')"
        >
          <i class="bi bi-floppy"></i>
          <span
            class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
            *ngIf="notSavedChanges"
          >
            <span class="visually-hidden">Hay cambios sin guardar</span>
          </span>
        </button>
        <button
          type="button"
          class="btn btn-warning"
          (click)="revert()"
          [disabled]="!idAccount || !notSavedChanges"
        >
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button
          type="button"
          class="btn btn-danger"
          (click)="deleteEntry()"
          [disabled]="!idAccount || !selectedIncomes"
          *ngIf="authService.getCrudPermission('administration', 'income', 'delete')"
        >
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>

    <!-- El componente AG Grid -->
    <div class="col">
      <ag-grid-angular
        style="width: 100%"
        [ngStyle]="selectedIncomes ? { height: '37vh' } : { height: '67vh' }"
        class="ag-theme-quartz small-text-ag-grid"
        [gridOptions]="gridOptions"
        [rowData]="incomes"
        [columnDefs]="colMaster"
        [components]="components"
        (selectionChanged)="onSelectionChanged($event)"
        (cellValueChanged)="onCellValueChanged($event)"
        (rowSelected)="onSelectedRow($event)"
        (gridReady)="onGridReady($event)"
        rowSelection="single"
        [class.disabled-grid]="!idAccount"
        [stopEditingWhenCellsLoseFocus]="true"
      >
      </ag-grid-angular>
    </div>
  </div>

  <!-- ==================================================================== -->
  <!-- INICIO DE LA SECCIÓN DE PESTAÑAS CORREGIDA -->
  <!-- Tu código anterior aquí tenía una estructura HTML inválida que causaba el error. -->
  <!-- Ha sido reemplazado por esta estructura de pestañas funcional y controlada por Angular. -->
  <!-- ==================================================================== -->

  <!-- Contenedor principal para las pestañas de detalle. Solo se muestra si hay una fila seleccionada. -->
  <div *ngIf="selectedIncomes" class="mt-3">

    <!-- 1. Estructura de NAVEGACIÓN de pestañas (unificada y correcta) -->
    <ul class="nav nav-tabs" id="incomeDetailTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button
          class="nav-link"
          [class.active]="activeTab === 'concepts'"
          (click)="setActiveTab('concepts')"
          type="button">
          <i class="bi bi-list-ul me-1"></i> Conceptos
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button
          class="nav-link"
          [class.active]="activeTab === 'info'"
          (click)="setActiveTab('info')"
          type="button">
          <i class="bi bi-info-circle me-1"></i> Información Adicional
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button
          class="nav-link"
          [class.active]="activeTab === 'invoice'"
          (click)="setActiveTab('invoice')"
          type="button">
          <i class="bi bi-file-earmark-text me-1"></i> Facturación Electrónica
          <span
            *ngIf="selectedIncomes?.uuid && selectedIncomes?.uuid !== 'NA'"
            class="badge bg-success ms-2">
            <i class="bi bi-check-circle"></i> Timbrada
          </span>
        </button>
      </li>
    </ul>

    <!-- 2. Contenedor del CONTENIDO de las pestañas (unificado y correcto) -->
    <div class="tab-content pt-3" id="incomeDetailTabContent">
      
      <!-- Panel para "Conceptos" -->
      <!-- La clave: *ngIf asegura que el componente SÓLO se renderice si su pestaña está activa -->
      <div *ngIf="activeTab === 'concepts'" class="tab-pane fade show active">
        <app-conceptsincome></app-conceptsincome>
      </div>

      <!-- Panel para "Información Adicional" -->
      <div *ngIf="activeTab === 'info'" class="tab-pane fade show active">
        <app-additional-info></app-additional-info>
      </div>

      <!-- Panel para "Facturación Electrónica" -->
      <div *ngIf="activeTab === 'invoice'" class="tab-pane fade show active">
        <app-electronic-invoice></app-electronic-invoice>
      </div>

    </div>
  </div>

</div>

<!-- Las etiquetas de cierre que estaban aquí abajo se han movido o integrado arriba
     para formar una estructura HTML válida. -->
