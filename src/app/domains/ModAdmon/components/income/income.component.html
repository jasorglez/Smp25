<app-multi-line-editor></app-multi-line-editor>

<!-- Modal para agregar nuevo cliente -->
<div class="modal fade" id="modalNuevoCliente" tabindex="-1" aria-labelledby="modalNuevoClienteLabel" aria-hidden="true"
     [class.show]="showCustomerModal" [style.display]="showCustomerModal ? 'block' : 'none'">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title" id="modalNuevoClienteLabel">
          <i class="bi bi-person-plus me-2"></i>Nuevo Cliente
        </h5>
        <button type="button" class="btn-close btn-close-white" (click)="closeCustomerModal()"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="customerName" class="form-label">Nombre Contacto *</label>
          <input type="text" class="form-control" id="customerName"
                 [(ngModel)]="newCustomer.nameContact"
                 placeholder="Ingrese el nombre del contacto">
        </div>
        <div class="mb-3">
          <label for="customerCompany" class="form-label">Compania</label>
          <input type="text" class="form-control" id="customerCompany"
                 [(ngModel)]="newCustomer.company"
                 placeholder="Ingrese el nombre de la compania">
        </div>
        <div class="mb-3">
          <label for="customerType" class="form-label">Tipo Cliente *</label>
          <select class="form-select" id="customerType" [(ngModel)]="newCustomer.idTypecop">
            <option [ngValue]="null">Seleccione tipo</option>
            <option *ngFor="let type of customerTypes" [ngValue]="type.id">{{ type.description }}</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeCustomerModal()">
          <i class="bi bi-x-lg me-1"></i>Cancelar
        </button>
        <button type="button" class="btn btn-success" (click)="saveNewCustomer()"
                [disabled]="!newCustomer.nameContact || !newCustomer.idTypecop">
          <i class="bi bi-check-lg me-1"></i>Guardar
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade" [class.show]="showCustomerModal" *ngIf="showCustomerModal"></div>

<!-- Modal para Reporte Control de Facturación e Ingresos -->
<div class="modal fade" [class.show]="showIngresoReportModal" [style.display]="showIngresoReportModal ? 'block' : 'none'" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header bg-info text-white">
        <h5 class="modal-title">
          <i class="bi bi-file-earmark-pdf me-2"></i>Control de Facturación e Ingresos
        </h5>
        <button type="button" class="btn-close btn-close-white" (click)="closeIngresoReportModal()" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted mb-2">
          <i class="bi bi-info-circle me-1"></i>
          Seleccione el tipo de reporte y el rango de fechas.
        </p>
        <form>
          <!-- Tipo de reporte -->
          <div class="mb-3">
            <label class="form-label fw-bold">Tipo de Reporte</label>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="reportIngresoType"
                       id="ingresoTypeListado" value="listado"
                       [(ngModel)]="reportIngresoType">
                <label class="form-check-label" for="ingresoTypeListado">
                  <i class="bi bi-list-ul me-1"></i>Listado de Ingresos
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="reportIngresoType"
                       id="ingresoTypeSaldos" value="saldos"
                       [(ngModel)]="reportIngresoType">
                <label class="form-check-label" for="ingresoTypeSaldos">
                  <i class="bi bi-bank me-1"></i>Saldos de Cuenta
                </label>
              </div>
            </div>
          </div>
          <div class="mb-3">
            <label for="ingresoReportStartDate" class="form-label">Fecha de Inicio <span class="text-danger">*</span></label>
            <input
              type="date"
              class="form-control"
              id="ingresoReportStartDate"
              [(ngModel)]="reportStartDate"
              name="ingresoReportStartDate"
              required>
          </div>
          <div class="mb-3">
            <label for="ingresoReportEndDate" class="form-label">Fecha de Término <span class="text-danger">*</span></label>
            <input
              type="date"
              class="form-control"
              id="ingresoReportEndDate"
              [(ngModel)]="reportEndDate"
              name="ingresoReportEndDate"
              required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeIngresoReportModal()">
          <i class="bi bi-x-lg me-1"></i>Cancelar
        </button>
        <button
          type="button"
          class="btn btn-info text-white"
          (click)="generateIngresoReport()"
          [disabled]="!reportStartDate || !reportEndDate || isGeneratingIngresoReport">
          <span *ngIf="isGeneratingIngresoReport" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          <i *ngIf="!isGeneratingIngresoReport" class="bi bi-file-earmark-pdf me-1"></i>
          {{ isGeneratingIngresoReport ? 'Generando...' : 'Generar PDF' }}
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade" [class.show]="showIngresoReportModal" [style.display]="showIngresoReportModal ? 'block' : 'none'"></div>

<div class="col-12">
  <div class="row mt-3 mb-3">
    <div class="col">
      <ng-select
        [items]="bankAccounts"
        bindValue="id"
        [(ngModel)]="idAccount"
        [disabled]="!bankAccounts?.length"
        placeholder="{{
          bankAccounts?.length
            ? 'Seleccione cuenta bancaria'
            : 'No hay cuentas disponibles'
        }}"
      >
        <ng-template ng-label-tmp let-item="item">
          {{ item?.nameAccount }} - {{ item?.bankName }}
        </ng-template>
        <ng-template ng-option-tmp let-item="item">
          {{ item.nameAccount }} - {{ item.bankName }}
        </ng-template>
      </ng-select>
    </div>
  </div>

  <!-- Leyenda de estatus y empresa -->
  <div class="row mb-2">
    <div class="col-auto">
      <div class="d-flex flex-wrap gap-1 align-items-center">
        <span class="badge bg-primary text-white px-2 py-1" style="font-size: 0.7rem;">
          <i class="bi bi-circle-fill me-1" style="font-size: 0.5rem;"></i>Pendiente
        </span>
        <span class="badge bg-success text-white px-2 py-1" style="font-size: 0.7rem;">
          <i class="bi bi-circle-fill me-1" style="font-size: 0.5rem;"></i>Pagada
        </span>
        <span class="badge bg-danger text-white px-2 py-1" style="font-size: 0.7rem;">
          <i class="bi bi-circle-fill me-1" style="font-size: 0.5rem;"></i>Cancelada
        </span>
        <span class="badge bg-warning text-dark px-2 py-1" style="font-size: 0.7rem;">
          <i class="bi bi-circle-fill me-1" style="font-size: 0.5rem;"></i>Entregada
        </span>
      </div>
    </div>
    <div class="col text-end">
      <span class="badge bg-dark text-white px-3 py-2" style="font-size: 0.85rem;">
        <i class="bi bi-building me-1"></i>{{ signalsService.getCompanyNameSmall()() || 'Sin empresa' }}
      </span>
    </div>
  </div>

  <div class="row mb-3">
    <!-- Columna vertical para botones -->
    <div class="col-auto pe-0">
      <div class="d-flex flex-column align-items-start gap-2">
        <button
          type="button"
          class="btn btn-primary"
          (click)="addRow()"
          [disabled]="!idAccount"
          title="Agregar nuevo ingreso"
        >
          <i class="bi bi-plus-lg"></i>
        </button>
        <button
          type="button"
          class="btn btn-success position-relative"
          (click)="saveChanges()"
          [disabled]="!idAccount || !notSavedChanges"
          title="Guardar cambios"
        >
          <i class="bi bi-floppy"></i>
          <span
            class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
            *ngIf="notSavedChanges"
          >
            <span class="visually-hidden">Hay cambios sin guardar</span>
          </span>
        </button>
        <button
          type="button"
          class="btn btn-warning"
          (click)="revert()"
          [disabled]="!idAccount || !notSavedChanges"
          title="Deshacer cambios"
        >
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button
          type="button"
          class="btn btn-danger"
          (click)="deleteEntry()"
          [disabled]="!idAccount || !selectedIncomes"
          title="Eliminar ingreso"
        >
          <i class="bi bi-trash"></i>
        </button>
        <button
          type="button"
          class="btn btn-info"
          (click)="openIngresoReportModal()"
          [disabled]="!idAccount"
          title="Generar Reporte Control de Facturación e Ingresos PDF"
        >
          <i class="bi bi-file-earmark-pdf"></i>
        </button>
      </div>
    </div>

    <!-- El componente AG Grid con master-detail -->
    <div class="col">
      <ag-grid-angular
        style="width: 100%; height: 75vh;"
        class="ag-theme-quartz small-text-ag-grid"
        [gridOptions]="gridOptions"
        [rowData]="incomes"
        [columnDefs]="colMaster"
        [components]="components"
        (selectionChanged)="onSelectionChanged($event)"
        (cellValueChanged)="onCellValueChanged($event)"
        (rowSelected)="onSelectedRow($event)"
        (gridReady)="onGridReady($event)"
        rowSelection="single"
        [class.disabled-grid]="!idAccount"
        [stopEditingWhenCellsLoseFocus]="true"
      >
      </ag-grid-angular>
    </div>
  </div>
</div>
