<div class="container-fluid p-4">
  <!-- Header -->
  <div class="card mb-4">
    <div class="card-header bg-primary text-white">
      <div class="d-flex align-items-center">
        <i class="bi bi-list-alt fs-4 me-3"></i>
        <div>
          <h4 class="card-title mb-0">Catálogos de Mantenimiento</h4>
          <p class="mb-0 opacity-75">Administra los catálogos del módulo de mantenimiento</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Warning if no company -->
  <div class="alert alert-warning" *ngIf="idCompany <= 0">
    <i class="bi bi-exclamation-triangle me-2"></i>
    Debe seleccionar una empresa para administrar los catálogos.
  </div>

  <!-- Main Content -->
  <div class="row" *ngIf="idCompany > 0">
    <!-- Sidebar - Catalog Types -->
    <div class="col-md-3">
      <div class="card h-100">
        <div class="card-header">
          <h6 class="mb-0"><i class="bi bi-folder me-2"></i>Tipos de Catálogo</h6>
        </div>
        <div class="card-body p-0">
          <div class="list-group list-group-flush">
            <button
              *ngFor="let cat of catalogTypes"
              type="button"
              class="list-group-item list-group-item-action d-flex justify-content-between align-items-start"
              [class.active]="selectedType === cat.type"
              (click)="selectedType = cat.type; onTypeChange()"
            >
              <div class="ms-2 me-auto">
                <div class="fw-bold">{{ cat.label }}</div>
                <small class="text-muted">{{ cat.description }}</small>
              </div>
              <i class="bi bi-chevron-right mt-2" *ngIf="selectedType === cat.type"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="col-md-9">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h6 class="mb-0">
            <i class="bi bi-table me-2"></i>
            {{ getSelectedTypeName() }}
          </h6>
          <div class="d-flex gap-2">
            <!-- Add Button -->
            <button class="btn btn-sm btn-success" (click)="addRow()" [disabled]="saving">
              <i class="bi bi-plus-lg"></i> Agregar
            </button>

            <!-- Save Button -->
            <button
              class="btn btn-sm btn-primary position-relative"
              (click)="saveChanges()"
              [disabled]="!canSave()"
            >
              <i class="bi bi-floppy"></i> Guardar
              <span
                class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
                *ngIf="hasUnsavedChanges"
              >
                <span class="visually-hidden">Hay cambios sin guardar</span>
              </span>
            </button>

            <!-- Revert Button -->
            <button class="btn btn-sm btn-warning" (click)="revertChanges()" [disabled]="!hasUnsavedChanges || saving">
              <i class="bi bi-arrow-clockwise"></i> Deshacer
            </button>

            <!-- Delete Button -->
            <button class="btn btn-sm btn-danger" (click)="deleteSelected()" [disabled]="saving">
              <i class="bi bi-trash"></i> Borrar
            </button>
          </div>
        </div>

        <div class="card-body p-0">
          <!-- Loading -->
          <div class="text-center p-4" *ngIf="loading">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Cargando...</span>
            </div>
          </div>

          <!-- AG Grid -->
          <ag-grid-angular
            *ngIf="!loading"
            class="ag-theme-alpine"
            style="width: 100%; height: 500px;"
            [rowData]="rowData"
            [columnDefs]="colDefs"
            [gridOptions]="gridOptions"
            [localeText]="AG_GRID_LOCALE_ES"
            (gridReady)="onGridReady($event)"
            (cellValueChanged)="onCellValueChanged($event)"
          >
          </ag-grid-angular>
        </div>

        <!-- Footer with info -->
        <div class="card-footer text-muted small">
          <i class="bi bi-info-circle me-1"></i>
          Haga doble clic en una celda para editar. Los cambios se guardan al hacer clic en "Guardar".
        </div>
      </div>
    </div>
  </div>
</div>
