<div class="reportes-container">
  <!-- Header -->
  <div class="header">
    <div class="header-content">
      <div class="header-left">
        <i class="bi bi-bar-chart header-icon"></i>
        <div>
          <h1 class="header-title">Reportes y Análisis</h1>
          <p class="header-subtitle">Informes y estadísticas del módulo de mantenimiento</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters-section">
    <div class="filter-group">
      <label class="filter-label">Categoría:</label>
      <select class="form-select filter-select" [(ngModel)]="selectedCategory">
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
    </div>
  </div>

  <!-- Reports Grid -->
  <div class="reports-grid">
    <div class="report-card" *ngFor="let report of getFilteredReports()">
      <div class="report-header">
        <div class="report-icon">
          <i [class]="report.icon"></i>
        </div>
        <div class="report-info">
          <h3 class="report-title">{{ report.name }}</h3>
          <span class="report-category">{{ report.category }}</span>
        </div>
      </div>

      <div class="report-description">
        <p>{{ report.description }}</p>
      </div>

      <div class="report-date-range" *ngIf="requiresDateRange(report.id)">
        <div class="row g-2">
          <div class="col-6">
            <label class="form-label mb-1">Fecha inicial</label>
            <input
              type="date"
              class="form-control form-control-sm"
              [ngModel]="getDateFrom(report.id)"
              (ngModelChange)="setDateFrom(report.id, $event)"
              [disabled]="!canGenerateByBranch()">
          </div>
          <div class="col-6">
            <label class="form-label mb-1">Fecha final</label>
            <input
              type="date"
              class="form-control form-control-sm"
              [ngModel]="getDateTo(report.id)"
              (ngModelChange)="setDateTo(report.id, $event)"
              [disabled]="!canGenerateByBranch()">
          </div>
        </div>
      </div>

      <div class="report-actions">
        <button
          class="btn btn-primary btn-sm"
          (click)="generateReport(report.id)"
          [disabled]="exportingReportId === report.id || !canGenerateByBranch() || !hasDateRange(report.id)">
          <i class="bi bi-file-earmark-alt"></i> Generar Reporte ({{ getSelectedFormat(report.id) }})
        </button>
        <div class="dropdown">
          <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" [disabled]="exportingReportId === report.id || !canGenerateByBranch()">
            <i class="bi bi-sliders"></i> Opción: {{ getSelectedFormat(report.id) }}
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#" (click)="setSelectedFormat(report.id, 'PDF'); $event.preventDefault()">
              <i class="bi bi-file-earmark-pdf text-danger"></i> PDF</a></li>
            <li><a class="dropdown-item" href="#" (click)="setSelectedFormat(report.id, 'Excel'); $event.preventDefault()">
              <i class="bi bi-file-earmark-excel text-success"></i> Excel</a></li>
            <li><a class="dropdown-item" href="#" (click)="setSelectedFormat(report.id, 'CSV'); $event.preventDefault()">
              <i class="bi bi-file-earmark-csv text-primary"></i> CSV</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Stats -->
  <div class="stats-section">
    <div class="stats-card">
      <h4 class="stats-title">Estadísticas Rápidas</h4>
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-number">247</div>
          <div class="stat-label">Activos Totales</div>
        </div>
        <div class="stat-item">
          <div class="stat-number">18</div>
          <div class="stat-label">OT Activas</div>
        </div>
        <div class="stat-item">
          <div class="stat-number">94.2%</div>
          <div class="stat-label">Disponibilidad</div>
        </div>
        <div class="stat-item">
          <div class="stat-number">$33,750</div>
          <div class="stat-label">Costo Mensual</div>
        </div>
      </div>
    </div>
  </div>
</div>
