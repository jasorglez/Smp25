<!-- Header -->
<div class="header">
  <div class="header-content">
    <div class="header-left">
      <i class="fas fa-wrench header-icon"></i>
      <div>
        <h1 class="header-title">Módulo de Mantenimiento</h1>
        <p class="header-subtitle">Sistema ERP - Demo Presentación Cliente</p>
      </div>
    </div>
    <div class="header-right">
      <p class="user-name">Bienvenido, Usuario</p>
      <p class="current-date">{{ getCurrentDate() }}</p>
    </div>
  </div>
</div>

<!-- Navigation Menu -->
<div class="navigation-menu">
  <div class="nav-container">
    <a routerLink="dashboard" routerLinkActive="active" class="nav-item">
      <i class="fas fa-tachometer-alt nav-icon"></i>
      <span class="nav-text">Dashboard</span>
    </a>
    <a routerLink="assets" routerLinkActive="active" class="nav-item">
      <i class="fas fa-cogs nav-icon"></i>
      <span class="nav-text">Activos</span>
    </a>
    <a routerLink="equipos" routerLinkActive="active" class="nav-item">
      <i class="fas fa-users nav-icon"></i>
      <span class="nav-text">Equipos</span>
    </a>
    <a routerLink="reportes" routerLinkActive="active" class="nav-item">
      <i class="fas fa-chart-bar nav-icon"></i>
      <span class="nav-text">Reportes</span>
    </a>

    <a routerLink="workorders" routerLinkActive="active" class="nav-item">
      <i class="fas fa-clipboard-list nav-icon"></i>
      <span class="nav-text">Órdenes de Trabajo</span>
    </a>
  </div>
</div>

<!-- Router Outlet for Child Components -->
<router-outlet></router-outlet>
