<div class="container-fluid p-3">
  <h2 class="mb-3">Login</h2>
  <p class="text-muted mb-3">Imágenes WEBP para la pantalla de login. Haz clic en una imagen para verla en grande. Agrega, edita o elimina entradas y guarda los cambios.</p>

  <div class="d-flex gap-2 mb-2">
    <button type="button" class="btn btn-sm btn-success" (click)="addRow()" [disabled]="!gridApi">
      <i class="bi bi-plus-lg"></i> Agregar
    </button>
    <button type="button" class="btn btn-sm btn-primary position-relative" (click)="saveChanges()" [disabled]="!hasUnsavedChanges">
      <i class="bi bi-floppy"></i> Guardar
      <span
        class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
        *ngIf="hasUnsavedChanges">
        <span class="visually-hidden">Hay cambios sin guardar</span>
      </span>
    </button>
    <button type="button" class="btn btn-sm btn-warning" (click)="revertChanges()">
      <i class="bi bi-arrow-clockwise"></i> Deshacer
    </button>
    <button type="button" class="btn btn-sm btn-danger" (click)="deleteRow()" [disabled]="!selectedRowData">
      <i class="bi bi-trash"></i> Borrar
    </button>
  </div>

  <input
    #fileInput
    type="file"
    accept=".webp,image/webp"
    style="display: none;"
    (change)="onFileSelected($event)" />

  <ag-grid-angular
    style="width: 100%;"
    [ngStyle]="{ height: gridHeight }"
    class="ag-theme-quartz small-text-ag-grid"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    rowSelection="single"
    (selectionChanged)="onSelectionChanged($event)"
    (cellValueChanged)="onCellValueChanged($event)"
    (gridReady)="onGridReady($event)">
  </ag-grid-angular>
</div>

<dialog #imagePreview class="image-preview" aria-labelledby="image-preview-title"
        (close)="previewImage = null"
        (click)="$event.target === $event.currentTarget && closeImagePreview()">
  <div class="image-preview-content" *ngIf="previewImage">
    <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
      <h3 id="image-preview-title" class="h5 mb-0">Presentación preliminar: {{ previewImage.nombre }}</h3>
      <button type="button" class="btn-close" aria-label="Cerrar presentación preliminar"
              autofocus (click)="closeImagePreview()"></button>
    </div>
    <img *ngIf="!previewImageError" class="image-preview-full" [src]="previewImage.url"
         [alt]="previewImage.nombre" (error)="previewImageError = true" />
    <p *ngIf="previewImageError" class="text-danger" role="alert">No se pudo cargar la imagen.</p>
    <div class="text-end mt-3">
      <button type="button" class="btn btn-secondary" (click)="closeImagePreview()">Cerrar</button>
    </div>
  </div>
</dialog>
