<div class="row p-3">
    <div class="col-12">
        <div class="row mb-3">
            <nav class="col-auto d-flex flex-column align-items-start">
                <button type="button" class="btn btn-primary me-1 mb-2" (click)="addRow()"><i
                    class="bi bi-plus-lg"></i></button>
                <button type="button" class="btn btn-success position-relative mb-2" (click)="saveChanges()">
                    <i class="bi bi-floppy"></i>
                    <span
                        class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
                        *ngIf="notSavedChanges"><span class="visually-hidden">Hay cambios sin guardar</span>
                    </span>
                </button>
                <button type="button" class="btn btn-warning mb-2" (click)="revert()"><i class="bi bi-arrow-clockwise"
                   ></i></button>
            </nav>
            <div class="col">
                <ag-grid-angular style="width: 100%; height: 82vh;"
                class="ag-theme-quartz small-text-ag-grid"
                [rowData]="rowData"
                [columnDefs]="columnDefs"
                [defaultColDef]="defaultColDef"
                (selectionChanged)="onSelectionChanged($event)"
                        (cellValueChanged)="onCellValueChanged($event)"
                        (cellEditingStopped)="onCellEditingStopped($event)"
                        (gridReady)="onGridReady($event)"
                        rowSelection="single"
                [gridOptions]="gridOptions"
                [stopEditingWhenCellsLoseFocus]="true">
                </ag-grid-angular>
            </div>
        </div>
    </div>
</div>
