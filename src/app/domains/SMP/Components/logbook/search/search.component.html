<div class="d-flex align-items-center mb-3">
  <label for="lb" class="me-2 mb-0">Fecha:</label>
  <input type="date" id="lb" class="form-control form-control-sm me-2" name="lb" [(ngModel)]="lb">
  <button type="submit" class="btn btn-success d-flex align-items-center" (click)="buscar()">
    <i class="bi bi-search me-2" style="font-size: 0.8rem;"></i>
    <span style="font-size: 0.8rem;">Buscar</span>
  </button>
</div>
