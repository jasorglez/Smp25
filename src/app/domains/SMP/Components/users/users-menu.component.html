<div class="container-fluid mt-3">
  <div class="col-12">
    <div class="users-lower-section mt-2">
    <ul class="nav nav-pills">
      <li
        class="nav-item"
        *ngIf="showRoot || authService.hasSubDetailedPermission('setup', 'users', 'Sec_prin')"
      >
        <a
          class="nav-link"
          [class.active]="selectedTab === 'users'"
          data-toggle="tab"
          (click)="onUsersSelected('users')"
          >Selección de usuarios</a
        >
      </li>


      <li
        class="nav-item"
        *ngIf="showRoot || hasUsersSetupAccess('contractors')"
      >
        <a
          class="nav-link"
          [class.active]="selectedTab === 'usersxcompanys'"
          data-toggle="tab"
          (click)="onUsersSelected('usersxcompanys')"
          >Contratistas</a
        >
      </li>

      <li
        class="nav-item"
        *ngIf="showRoot || hasUsersSetupAccess('contracts')"
      >
        <a
          class="nav-link"
          [class.active]="selectedTab === 'usersxcontracts'"
          data-toggle="tab"
          (click)="onUsersSelected('usersxcontracts')"
          >Contratos</a
        >
      </li>

      <li
        class="nav-item"
        *ngIf="showRoot || hasUsersSetupAccess('oilfields')"
      >
        <a
          class="nav-link"
          [class.active]="selectedTab === 'usersxoilfields'"
          data-toggle="tab"
          (click)="onUsersSelected('usersxoilfields')"
          >Campos petroleros</a
        >
      </li>

      <li
        class="nav-item"
        *ngIf="showRoot || hasUsersSetupAccess('projects')"
      >
        <a
          class="nav-link"
          [class.active]="selectedTab === 'usersxprojects'"
          data-toggle="tab"
          (click)="onUsersSelected('usersxprojects')"
          >Proyectos</a
        >
      </li>

      <li
        class="nav-item"
        *ngIf="(showRoot || authService.hasSubDetailedPermission('setup', 'users', 'Emp_prin')) && hasSelectedUser"
      >
        <a
          class="nav-link"
          [class.active]="selectedTab === 'usersxroot'"
          data-toggle="tab"
          (click)="onUsersSelected('usersxroot')"
          >Empresas</a
        >
      </li>

      <li
        class="nav-item"
        *ngIf="(showRoot || authService.hasSubDetailedPermission('setup', 'users', 'Suc_prin')) && hasSelectedUser"
      >
        <a
          class="nav-link"
          [class.active]="selectedTab === 'usersxbranches'"
          data-toggle="tab"
          (click)="onUsersSelected('usersxbranches')"
          >Sucursales</a
        >
      </li>

        <li
          class="nav-item"
          *ngIf="(showRoot || authService.hasSubDetailedPermission('setup', 'users', 'Alm_prin')) && hasSelectedUser"
        >
        <a class="nav-link" [class.active]="selectedTab === 'usersxwarehouses'" data-toggle="tab"
          (click)="onUsersSelected('usersxwarehouses')">Almacenes</a>
      </li> 

      <!--  <li class="nav-item" *ngIf="profile().emailUser()">
        <a class="nav-link" [class.active]="selectedTab === 'usersxstores'" data-toggle="tab"
          (click)="onUsersSelected('usersxstores')">Tiendas</a>
      </li>

      <li class="nav-item" *ngIf="profile().emailUser()">
        <a class="nav-link" [class.active]="selectedTab === 'usersxcashregisters'" data-toggle="tab"
          (click)="onUsersSelected('usersxcashregisters')">Cajas</a>
      </li> -->
    </ul>

      <div class="card users-content-card">
        <div class="card-body users-content-body">
        <div *ngIf="!selectedTab" class="px-2 py-3">
          Selecciona una opción para mostrar el contenido.
        </div>
        <div
          class="tab-pane"
          [class.active]="selectedTab === 'users'"
        *ngIf="selectedTab === 'users' && (showRoot || authService.hasSubDetailedPermission('setup', 'users', 'Sec_prin'))"
        >
          <app-users (userSelectionChange)="onUserSelectionChange($event)"></app-users>
        </div>
        <div
          class="tab-pane"
          [class.active]="selectedTab === 'usersxcompanys'"
          *ngIf="selectedTab === 'usersxcompanys'"
        >
          <app-usersxcompanys></app-usersxcompanys>
        </div>
        <div
          class="tab-pane"
          [class.active]="selectedTab === 'usersxcontracts'"
          *ngIf="selectedTab === 'usersxcontracts'"
        >
          <app-usersxcontracts></app-usersxcontracts>
        </div>
        <div
          class="tab-pane"
          [class.active]="selectedTab === 'usersxprojects'"
          *ngIf="selectedTab === 'usersxprojects'"
        >
          <app-usersxprojects></app-usersxprojects>
        </div>
        <div
          class="tab-pane"
          [class.active]="selectedTab === 'usersxoilfields'"
          *ngIf="selectedTab === 'usersxoilfields'"
        >
          <app-usersxoilfields></app-usersxoilfields>
        </div>
        <div
          class="tab-pane"
          [class.active]="selectedTab === 'usersxroot'"
          *ngIf="selectedTab === 'usersxroot' && hasSelectedUser"
        >
          <app-usersxroot></app-usersxroot>
        </div>
        <div
          class="tab-pane"
          [class.active]="selectedTab === 'usersxwarehouses'"
        *ngIf="selectedTab === 'usersxwarehouses' && (showRoot || authService.hasSubDetailedPermission('setup', 'users', 'Alm_prin'))"
        >
          <app-usersxwarehouses></app-usersxwarehouses>
        </div>
        <div
          class="tab-pane"
          [class.active]="selectedTab === 'usersxbranches'"
          *ngIf="selectedTab === 'usersxbranches' && hasSelectedUser"
        >
          <app-usersxbranches></app-usersxbranches>
        </div>
        <div
          class="tab-pane"
          [class.active]="selectedTab === 'usersxstores'"
          *ngIf="selectedTab === 'usersxstores'"
        >
          <app-usersxstores></app-usersxstores>
        </div>
        <div
          class="tab-pane"
          [class.active]="selectedTab === 'usersxcashregisters'"
          *ngIf="selectedTab === 'usersxcashregisters'"
        >
          <app-usersxcashregisters></app-usersxcashregisters>
        </div>
      </div>
    </div>
  </div>
</div>
