<div class="container-fluid mt-3">
  <section class="users-module-shell">
    <header class="users-module-header">
      <div class="module-heading">
        <span class="module-icon"><i class="bi bi-people"></i></span>
        <div>
          <h4>Administración de usuarios</h4>
          <p>Usuarios, accesos y asignaciones operativas</p>
        </div>
      </div>
      <div class="selected-user" *ngIf="profile().emailUser()">
        <img *ngIf="profile().profilePicUser()" [src]="profile().profilePicUser()" alt="">
        <span>
          <small>Usuario seleccionado</small>
          <strong>{{ profile().nameUser() || profile().emailUser() }}</strong>
        </span>
      </div>
    </header>

    <div class="users-navigation">
    <ul class="nav nav-pills users-tabs">
      <li class="nav-item">
        <a
          class="nav-link"
          [class.active]="selectedTab === 'users'"
          data-toggle="tab"
          (click)="onUsersSelected('users')"
          ><i class="bi bi-person-check"></i> Usuarios</a
        >
      </li>

      <li
        class="nav-item"
        *ngIf="
          profile().emailUser() && (showRoot ||
            authService.hasDetailedPermission(
              'users-setup',
              'master-permissions'
            ))
        "
      >
        <a
          class="nav-link"
          [class.active]="selectedTab === 'usersxmasterpermissions'"
          data-toggle="tab"
          (click)="onUsersSelected('usersxmasterpermissions')"
          ><i class="bi bi-shield-check"></i> Permisos maestros</a
        >
      </li>

      <li
        class="nav-item"
        *ngIf="
          profile().emailUser() && (showRoot ||
            authService.hasDetailedPermission(
              'users-setup',
              'companies'
            ))
        "
      >
        <a
          class="nav-link"
          [class.active]="selectedTab === 'usersxroot'"
          data-toggle="tab"
          (click)="onUsersSelected('usersxroot')"
          ><i class="bi bi-building"></i> Empresas</a
        >
      </li>

      <li
        class="nav-item"
        *ngIf="
          profile().emailUser() && (showRoot ||
            authService.hasDetailedPermission(
              'users-setup',
              'branches'
            ))
        "
      >
        <a
          class="nav-link"
          [class.active]="selectedTab === 'usersxbranches'"
          data-toggle="tab"
          (click)="onUsersSelected('usersxbranches')"
          ><i class="bi bi-geo-alt"></i> Sucursales</a
        >
      </li>


            <li
        class="nav-item"
        *ngIf="
          profile().emailUser() && (showRoot ||
            authService.hasDetailedPermission(
              'users-setup',
              'contracts'
            ))
        "
      >
        <a
          class="nav-link"
          [class.active]="selectedTab === 'usersxcontracts'"
          data-toggle="tab"
          (click)="onUsersSelected('usersxcontracts')"
          ><i class="bi bi-file-earmark-text"></i> Contratos</a
        >
      </li>  


      <li
        class="nav-item"
        *ngIf="
          profile().emailUser() && (showRoot ||
            authService.hasDetailedPermission(
              'users-setup',
              'projects'
            ))
        "
      >
        <a
          class="nav-link"
          [class.active]="selectedTab === 'usersxprojects'"
          data-toggle="tab"
          (click)="onUsersSelected('usersxprojects')"
          ><i class="bi bi-diagram-3"></i> Proyectos</a
        >
      </li>


        <li class="nav-item" *ngIf="profile().emailUser()">
        <a class="nav-link" [class.active]="selectedTab === 'usersxwarehouses'" data-toggle="tab"
          (click)="onUsersSelected('usersxwarehouses')"><i class="bi bi-box-seam"></i> Almacenes</a>
      </li> 

      <!--  <li class="nav-item" *ngIf="profile().emailUser()">
        <a class="nav-link" [class.active]="selectedTab === 'usersxstores'" data-toggle="tab"
          (click)="onUsersSelected('usersxstores')">Tiendas</a>
      </li>

      <li class="nav-item" *ngIf="profile().emailUser()">
        <a class="nav-link" [class.active]="selectedTab === 'usersxcashregisters'" data-toggle="tab"
          (click)="onUsersSelected('usersxcashregisters')">Cajas</a>
      </li> -->
    </ul>
    </div>

    <div class="users-tab-content">

    <div
      class="tab-pane"
      [class.active]="selectedTab === 'users'"
      *ngIf="selectedTab === 'users'"
    >
      <app-users></app-users>
    </div>
    <div
      class="tab-pane"
      [class.active]="selectedTab === 'usersxcompanys'"
      *ngIf="selectedTab === 'usersxcompanys'"
    >
      <app-usersxcompanys></app-usersxcompanys>
    </div>
    <div
      class="tab-pane"
      [class.active]="selectedTab === 'usersxcontracts'"
      *ngIf="selectedTab === 'usersxcontracts'"
    >
      <app-usersxcontracts></app-usersxcontracts>
    </div>
    <div
      class="tab-pane"
      [class.active]="selectedTab === 'usersxprojects'"
      *ngIf="selectedTab === 'usersxprojects'"
    >
      <app-usersxprojects></app-usersxprojects>
    </div>
    <div
      class="tab-pane"
      [class.active]="selectedTab === 'usersxoilfields'"
      *ngIf="selectedTab === 'usersxoilfields'"
    >
      <app-usersxoilfields></app-usersxoilfields>
    </div>
    <div
      class="tab-pane"
      [class.active]="selectedTab === 'usersxroot'"
      *ngIf="selectedTab === 'usersxroot'"
    >
      <app-usersxroot></app-usersxroot>
    </div>
    <div
      class="tab-pane"
      [class.active]="selectedTab === 'usersxwarehouses'"
      *ngIf="selectedTab === 'usersxwarehouses'"
    >
      <app-usersxwarehouses></app-usersxwarehouses>
    </div>
    <div
      class="tab-pane"
      [class.active]="selectedTab === 'usersxbranches'"
      *ngIf="selectedTab === 'usersxbranches'"
    >
      <app-usersxbranches></app-usersxbranches>
    </div>
    <div
      class="tab-pane"
      [class.active]="selectedTab === 'usersxmasterpermissions'"
      *ngIf="selectedTab === 'usersxmasterpermissions'"
    >
      <app-usersxmasterpermissions2></app-usersxmasterpermissions2>
    </div>
    <div
      class="tab-pane"
      [class.active]="selectedTab === 'usersxstores'"
      *ngIf="selectedTab === 'usersxstores'"
    >
      <app-usersxstores></app-usersxstores>
    </div>
    <div
      class="tab-pane"
      [class.active]="selectedTab === 'usersxcashregisters'"
      *ngIf="selectedTab === 'usersxcashregisters'"
    >
      <app-usersxcashregisters></app-usersxcashregisters>
    </div>
    </div>
  </section>
</div>
