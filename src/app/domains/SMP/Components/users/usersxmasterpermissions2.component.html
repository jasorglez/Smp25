<h2>Gestión de Permisos</h2>

<div *ngFor="let master of masterPermissions" class="master-permission">
  <h3>{{ master.permissionName }}</h3>
  <ul>
    <li *ngFor="let detail of master.detailedPermissions" class="detail-permission">
      <label>
        <input
          type="checkbox"
          [checked]="isPermissionChecked(detail.id)"
          (change)="togglePermission(detail.id)"
        />
        {{ detail.permissionName }}
      </label>
    </li>
  </ul>
</div>
