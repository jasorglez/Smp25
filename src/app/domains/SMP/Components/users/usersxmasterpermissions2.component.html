<div class="mp-shell">
  <div class="row g-3 g-lg-4">
    <div [ngClass]="profile().emailUser() != null ? 'col-lg-9 col-xl-10' : 'col-12'">
      <div class="mp-grid-wrap">
        <div class="mp-grid">
          <div
            class="mp-card"
            *ngFor="let master of masterPermissions; let i = index"
            [style.animation-delay.ms]="i * 45">
            <div class="accordion mp-accordion" [id]="'permissionsAccordion' + master.id">
              <div class="accordion-item">
                <h2 class="accordion-header" [id]="'heading' + master.id">
                  <button
                    class="accordion-button collapsed"
                    type="button"
                    data-bs-toggle="collapse"
                    [attr.data-bs-target]="'#collapse' + master.id"
                    aria-expanded="false"
                    [attr.aria-controls]="'collapse' + master.id">
                    {{ master.permissionName }}
                  </button>
                </h2>
                <div
                  [id]="'collapse' + master.id"
                  class="accordion-collapse collapse"
                  [attr.aria-labelledby]="'heading' + master.id"
                  [attr.data-bs-parent]="'#permissionsAccordion' + master.id">
                  <div class="accordion-body">
                    <label class="mp-switch-row" *ngFor="let detail of master.detailedPermissions">
                      <span class="mp-switch-label">{{ detail.permissionName }}</span>
                      <span class="mp-toggle">
                        <input
                          type="checkbox"
                          role="switch"
                          class="mp-toggle-input"
                          [attr.aria-label]="'Permiso: ' + detail.permissionName"
                          [checked]="isPermissionChecked(detail.id)"
                          (change)="togglePermission(detail.id)" />
                        <span class="mp-toggle-track" aria-hidden="true"></span>
                      </span>
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-3 col-xl-2" *ngIf="profile().emailUser()">
      <aside class="mp-sidebar">
        <div class="mp-profile-shell">
          <app-users-profile></app-users-profile>
        </div>
      </aside>
    </div>
  </div>
</div>
