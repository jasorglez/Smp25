<div class="row p-3 master-permissions-page">
  <div [ngClass]="profile().emailUser() != null ? 'col-lg-10 col-md-9 col-sm-9 col-9' : 'col-12'">
    <section class="permissions-panel">
      <header class="permissions-header">
        <span class="permissions-icon"><i class="bi bi-shield-check"></i></span>
        <div>
          <h5>Permisos maestros</h5>
          <p>Configure los accesos de {{ profile().nameUser() || profile().emailUser() }}</p>
        </div>
      </header>
    <div class="row g-3 permissions-grid">
      <div class="col-xl-3 col-lg-4 col-sm-6 col-12" *ngFor="let master of masterPermissions">
        <div class="accordion" id="permissionsAccordion{{ master.id }}">
          <div class="accordion-item">
            <h2 class="accordion-header" id="heading{{ master.id }}">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                [attr.data-bs-target]="'#collapse' + master.id" aria-expanded="false"
                [attr.aria-controls]="'collapse' + master.id">
                {{ master.permissionName }}
                <span class="badge ms-2"
                  [ngClass]="getActiveCount(master) === master.detailedPermissions?.length
                    ? 'bg-success'
                    : getActiveCount(master) === 0
                      ? 'bg-secondary'
                      : 'bg-warning text-dark'">
                  {{ getActiveCount(master) }}/{{ master.detailedPermissions?.length }}
                </span>
              </button>
            </h2>
            <div id="collapse{{ master.id }}" class="accordion-collapse collapse"
              [attr.aria-labelledby]="'heading' + master.id"
              [attr.data-bs-parent]="'#permissionsAccordion' + master.id">
              <div class="accordion-body">
                <!-- Botones masivos -->
                <div class="d-flex gap-1 align-items-center mb-2 pb-2 border-bottom">
                  <button class="btn btn-outline-success btn-sm permission-action"
                    (click)="enableAllInMaster(master)" title="Activar todos">
                    <i class="bi bi-check2-all"></i> Activar todos
                  </button>
                  <button class="btn btn-outline-danger btn-sm permission-action"
                    (click)="disableAllInMaster(master)" title="Desactivar todos">
                    <i class="bi bi-x-circle"></i> Desactivar todos
                  </button>
                </div>
                <!-- Switches individuales -->
                <div class="form-check form-switch" *ngFor="let detail of master.detailedPermissions">
                  <input type="checkbox" class="form-check-input" role="switch" [id]="'detail' + detail.id"
                    [checked]="isPermissionChecked(detail.id)" (change)="togglePermission(detail.id)" />
                  <label class="form-check-label small-text" [for]="'detail' + detail.id">{{ detail.permissionName
                    }}</label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    </section>
  </div>
  <div class="col-lg-2 col-md-3 col-sm-3 col-3" *ngIf="profile().emailUser()">
    <div class="card text-center profile-card">
      <app-users-profile></app-users-profile>
    </div>
  </div>
</div>
