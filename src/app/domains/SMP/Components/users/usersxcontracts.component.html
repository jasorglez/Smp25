<div class="row p-3 user-assignment-page">
    <div [ngClass]="
      profile().emailUser() != null
        ? 'col-lg-10 col-md-9 col-sm-9 col-9'
        : 'col-12'
    ">
        <section class="user-assignment-panel">
            <header class="user-assignment-header">
                <span class="assignment-icon"><i class="bi bi-file-earmark-text"></i></span>
                <div>
                    <h5>Asignación de contratos</h5>
                    <p>{{ profile().nameUser() || profile().emailUser() }}</p>
                </div>
                <div class="form-check form-switch ms-auto" *ngIf="idCompany != null">
                        <input type="checkbox" name="companyChecked" id="companyChecked" class="form-check-input"
                            [checked]="companyChecked()()" (change)="onCheckboxChange($event)">
                        <label for="companyChecked" class="form-check-label">Filtrar por contratista</label>
                </div>
                <span class="assignment-count">{{ rowData?.length || 0 }} asignados</span>
            </header>
            <div class="row g-0">
            <nav class="col-auto d-flex flex-column align-items-center action-rail">
                <button type="button" class="btn btn-primary action-button" (click)="addRow()" title="Agregar" aria-label="Agregar">
                    <i class="bi bi-plus-lg"></i>
                </button>
                <button type="button" class="btn btn-success action-button position-relative" (click)="saveChanges()" title="Guardar" aria-label="Guardar">
                    <i class="bi bi-floppy"></i>
                    <span
                        class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
                        *ngIf="notSavedChanges"><span class="visually-hidden">Hay cambios sin guardar</span>
                    </span>
                </button>
                <button type="button" class="btn btn-warning action-button" (click)="revert()" title="Deshacer" aria-label="Deshacer">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
                <button type="button" class="btn btn-danger action-button" (click)="deleteEntry()" [disabled]="!selectedRowData" title="Borrar" aria-label="Borrar">
                    <i class="bi bi-trash"></i>
                </button>
            </nav>
            <div class="col grid-area">
                <div class="row">
                    <ag-grid-angular style="width: 100%; height: 500px" class="ag-theme-quartz small-text-ag-grid" [rowData]="rowData"
                        [columnDefs]="columnDefs" (selectionChanged)="onSelectionChanged($event)"
                        (cellValueChanged)="onCellValueChanged($event)" (rowSelected)="onSelectedRow($event)"
                        (gridReady)="onGridReady($event)" rowSelection="single" [gridOptions]="gridOptions" [stopEditingWhenCellsLoseFocus]="true">
                    </ag-grid-angular>
                </div>
            </div>
        </div>
        </section>
    </div>
    <div class="col-lg-2 col-md-3 col-sm-3 col-3" *ngIf="profile().emailUser()">
        <div class="card text-center profile-card">
            <app-users-profile></app-users-profile>
        </div>
    </div>
</div>
