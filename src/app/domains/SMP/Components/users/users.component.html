<div class="row">
    <div class="col-lg-2 col-md-3 col-sm-3 col-3">
        <div class="card text-center" *ngIf="selectedRowData">
            <div class="row">
                <div class="col">
                    <img [src]="selectedRowData.picture" alt="Imagen" class="img-fluid">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <p><strong>Nombre</strong></p>
                    <p>{{selectedRowData.displayName}}</p>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <p><strong>Correo electrónico</strong></p>
                    <p>{{selectedRowData.emailu}}</p>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <p><strong>Organización</strong></p>
                    <p>{{selectedRowData.organization}}</p>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <p><strong>Posición</strong></p>
                    <p>{{selectedRowData.position}}</p>
                </div>
            </div>
        </div>
    </div>
    <div class="col-lg-10 col-md-9 col-sm-9 col-9">
        <ag-grid-angular
        style="width: 100%; height: 500px;"
        class="ag-theme-quartz"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [pagination]="pagination"
        [paginationPageSize]="paginationPageSize"
        rowSelection="single"
        (selectionChanged)="onSelectionChanged($event)"
        (gridReady)="onGridReady($event)">
        </ag-grid-angular>
    </div>
</div>
