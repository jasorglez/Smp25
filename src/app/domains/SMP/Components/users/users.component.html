<div class="users-list-page">
    <section class="users-grid-panel">
        <header class="users-list-header">
            <div class="users-heading">
                <span class="users-heading-icon"><i class="bi bi-people-fill"></i></span>
                <div>
                    <h1>Usuarios</h1>
                    <p>Administra las cuentas y sus accesos a la empresa</p>
                </div>
            </div>

            <div class="users-header-actions">
                <span class="users-unsaved-status" *ngIf="notSavedChanges">
                    <i class="bi bi-circle-fill"></i> Cambios sin guardar
                </span>
                <div class="users-action-group" aria-label="Acciones de usuarios">
                    <button type="button" class="btn users-action users-action-add" (click)="addRow()">
                        <i class="bi bi-plus-lg"></i><span>Agregar usuario</span>
                    </button>
                    <button type="button" class="btn users-action users-action-save position-relative" (click)="saveChanges()">
                        <i class="bi bi-floppy"></i><span>Guardar</span>
                        <span class="users-save-dot" *ngIf="notSavedChanges"><span class="visually-hidden">Hay cambios sin guardar</span></span>
                    </button>
                    <button type="button" class="btn users-action users-action-revert" (click)="revert()">
                        <i class="bi bi-arrow-counterclockwise"></i><span>Deshacer</span>
                    </button>
                    <button type="button" class="btn users-action users-action-delete" (click)="deleteUser()">
                        <i class="bi bi-trash3"></i><span>Borrar</span>
                    </button>
                </div>
            </div>
        </header>

        <div class="users-list-grid">
                    <ag-grid-angular style="width: 100%;"
                    [ngStyle]="{'height': gridHeight}"
                    class="ag-theme-quartz small-text-ag-grid"
                    [rowData]="rowData"
                    [columnDefs]="columnDefs"
                    [defaultColDef]="defaultColDef"
                    [pagination]="false"
                    [paginationPageSize]="paginationPageSize"
                    [paginationPageSizeSelector]="paginationPageSizeSelector"
                    rowSelection="single"
                    (selectionChanged)="onSelectionChanged($event)"
                    (cellValueChanged)="onCellValueChanged($event)"
                    (cellEditingStopped)="onCellEditingStopped($event)"
                    (rowSelected)="onSelectedRow($event)"
                    (gridReady)="onGridReady($event)"
                    (columnResized)="onColumnResized($event)"
                    [components]="components"
                    [gridOptions]="gridOptions"
                    [stopEditingWhenCellsLoseFocus]="true">
                    </ag-grid-angular>
        </div>
    </section>
</div>

<!-- Modal de Permisos -->
<div *ngIf="showPermissionsModal"
    class="permissions-modal-backdrop"
    (click)="closePermissionsModal()">
    <section class="permissions-modal-shell"
        (click)="$event.stopPropagation()">

        <!-- Header -->
        <header class="permissions-modal-header">
            <div class="permissions-modal-title">
                <span class="permissions-modal-icon"><i class="bi bi-shield-lock-fill"></i></span>
                <div><strong>Permisos</strong><small>{{ modalUserName }}</small></div>
            </div>

            <div class="permissions-modal-actions">
                <!-- Botón Modificar -->
                <button class="btn btn-sm btn-outline-primary" (click)="permissionsViewRef.modificar()" title="Modificar" aria-label="Modificar permisos">
                    <i class="bi bi-pencil"></i><span>Modificar</span>
                </button>
                <!-- Botón Guardar -->
                <button class="btn btn-sm btn-success position-relative"
                    (click)="permissionsViewRef.saveDetailChanges()"
                    [disabled]="!permissionsViewRef?.notSavedChanges"
                    title="Guardar cambios">
                    <i class="bi bi-floppy"></i><span>Guardar</span>
                    <span
                        class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
                        *ngIf="permissionsViewRef?.notSavedChanges">
                        <span class="visually-hidden">Hay cambios sin guardar</span>
                    </span>
                </button>
                <!-- Botón Revertir -->
                <button class="btn btn-sm btn-warning"
                    (click)="permissionsViewRef.revertChanges()"
                    [disabled]="!permissionsViewRef?.notSavedChanges"
                    title="Revertir cambios">
                    <i class="bi bi-arrow-counterclockwise"></i><span>Deshacer</span>
                </button>
                <!-- Botón Cerrar -->
                <button class="btn btn-sm btn-light permissions-modal-close" (click)="closePermissionsModal()" title="Cerrar" aria-label="Cerrar permisos">
                    <i class="bi bi-x-lg"></i><span>Cerrar</span>
                </button>
            </div>
        </header>

        <!-- Body -->
        <div class="permissions-modal-body">
            <app-permissions-view-by-user
                #permissionsViewRef
                *ngIf="modalPermissions"
                [idUserInput]="modalPermissions.idUser"
                [idBranchInput]="modalPermissions.idBranch"
                [idRoleInput]="modalPermissions.idRole"
                [idPosicionInput]="modalPermissions.idPosicion">
            </app-permissions-view-by-user>
        </div>

    </section>
</div>
