<div class="users-container">

  <!-- Toolbar -->
  <div class="users-toolbar">
    <div class="toolbar-actions">
      <button class="action-btn add"    (click)="addRow()"      title="Agregar usuario" [disabled]="hasDetailExpanded">
        <i class="bi bi-plus-lg"></i>
      </button>
      <button class="action-btn save position-relative" (click)="saveChanges()" title="Guardar cambios" [disabled]="hasDetailExpanded">
        <i class="bi bi-floppy"></i>
        <span class="unsaved-dot" *ngIf="notSavedChanges"></span>
      </button>
      <button class="action-btn revert" (click)="revert()"      title="Deshacer cambios" [disabled]="hasDetailExpanded">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
      <button class="action-btn delete" (click)="deleteUser()"  title="Eliminar usuario" [disabled]="hasDetailExpanded">
        <i class="bi bi-trash"></i>
      </button>
    </div>
  </div>

  <!-- Grid -->
  <div class="users-grid-wrapper">
    <ag-grid-angular
      class="ag-theme-quartz small-text-ag-grid"
      style="width: 100%; height: 100%;"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [pagination]="false"
      [paginationPageSize]="paginationPageSize"
      [paginationPageSizeSelector]="paginationPageSizeSelector"
      rowSelection="single"
      (selectionChanged)="onSelectionChanged($event)"
      (cellValueChanged)="onCellValueChanged($event)"
      (cellEditingStopped)="onCellEditingStopped($event)"
      (rowSelected)="onSelectedRow($event)"
      (gridReady)="onGridReady($event)"
      (rowGroupOpened)="onRowGroupOpened($event)"
      [components]="components"
      [gridOptions]="gridOptions"
      [stopEditingWhenCellsLoseFocus]="true">
    </ag-grid-angular>
  </div>

</div>

<!-- Modal de Permisos -->
<div *ngIf="showPermissionsModal" class="permissions-overlay" (click)="closePermissionsModal()">
  <div class="permissions-modal" (click)="$event.stopPropagation()">

    <div class="permissions-modal-header">
      <strong class="modal-title-text">Permisos — {{ modalUserName }}</strong>
      <div class="modal-header-actions">
        <button class="action-btn-sm save position-relative"
          (click)="permissionsViewRef.saveDetailChanges()"
          [disabled]="!(permissionsViewRef?.notSavedChanges ?? false)"
          title="Guardar">
          <i class="bi bi-floppy"></i>
          <span class="unsaved-dot" *ngIf="permissionsViewRef?.notSavedChanges"></span>
        </button>
        <button class="action-btn-sm revert"
          (click)="permissionsViewRef.revertChanges()"
          [disabled]="!(permissionsViewRef?.notSavedChanges ?? false)"
          title="Revertir"><i class="bi bi-arrow-clockwise"></i></button>
        <div class="modal-divider"></div>
        <button class="action-btn-sm close-btn" (click)="closePermissionsModal()" title="Cerrar"><i class="bi bi-x-lg"></i></button>
      </div>
    </div>

    <div class="permissions-modal-body">
      <app-permissions-view-by-user
        #permissionsViewRef
        *ngIf="modalPermissions"
        [idUserInput]="modalPermissions.idUser"
        [idBranchInput]="modalPermissions.idBranch"
        [idRoleInput]="modalPermissions.idRole"
        [idPosicionInput]="modalPermissions.idPosicion"
        [scopeInput]="modalPermissions.scope"
        [seedFromRolePosInput]="modalPermissions.seedFromRolePosition"
        [roleTemplateOnlyInput]="modalPermissions.roleTemplateOnly"
        [idCompanyInput]="modalPermissions.idCompany">
      </app-permissions-view-by-user>
    </div>

  </div>
</div>
