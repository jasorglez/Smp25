<div class="row">
    <div class="col-lg-2 col-md-3 col-sm-3 col-3">
        <div class="card text-center" *ngIf="selectedRowData">
            <div class="row">
                <div class="col">
                    <img [src]="selectedRowData.picture" alt="Imagen de perfil de {{selectedRowData.displayName}}"
                        class="img-fluid rounded">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <p><strong>Nombre</strong></p>
                    <p>{{selectedRowData.displayName}}</p>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <p><strong>Correo electrónico</strong></p>
                    <p>{{selectedRowData.emailu}}</p>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <p><strong>Organización</strong></p>
                    <p>{{selectedRowData.organization}}</p>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <p><strong>Posición</strong></p>
                    <p>{{selectedRowData.position}}</p>
                </div>
            </div>
        </div>
    </div>
    <div class="col-lg-10 col-md-9 col-sm-9 col-9">
        <div class="row py-3">
            <div class="col"><button type="button" class="btn btn-primary me-1" (click)="addRow()">Añadir fila</button>
                <button type="button" class="btn btn-success ms-1" (click)="saveChanges()">Guardar cambios</button>
            </div>
        </div>
        <div class="row">
            <ag-grid-angular style="width: 100%; height: 500px;" class="ag-theme-quartz" [rowData]="rowData"
                [columnDefs]="columnDefs" [pagination]="pagination" [paginationPageSize]="paginationPageSize"
                rowSelection="single" (selectionChanged)="onSelectionChanged($event)"
                (cellValueChanged)="onCellValueChanged($event)" (gridReady)="onGridReady($event)">
            </ag-grid-angular>
        </div>
    </div>
</div>
