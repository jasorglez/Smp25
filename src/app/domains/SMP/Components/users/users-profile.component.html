<div class="profile-summary">
    <div class="profile-avatar-wrap">
        <img [src]="profile.profilePicUser()" alt="Imagen de perfil de {{ profile.nameUser() }}"
            class="profile-avatar">
        <span class="status-dot" title="Usuario seleccionado"></span>
    </div>

    <h6>{{ profile.nameUser() }}</h6>
    <p class="profile-email" [title]="profile.emailUser()">{{ profile.emailUser() }}</p>

    <div class="profile-role" *ngIf="profile.organizationUser()">
        <i class="bi bi-person-badge"></i>
        <span>{{ profile.organizationUser() }}</span>
    </div>

    <div class="profile-context" *ngIf="nameCompany != null || nameContract != null">
        <div *ngIf="nameCompany != null">
            <small>Empresa seleccionada</small>
            <strong>{{ nameCompany }}</strong>
        </div>
        <div *ngIf="nameContract != null">
            <small>Contrato seleccionado</small>
            <strong>{{ nameContract }}</strong>
        </div>
    </div>
</div>
