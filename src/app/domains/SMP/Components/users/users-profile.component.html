<div class="profile-summary">
    <div class="profile-avatar-wrap">
        <img [src]="profile.profilePicUser()" alt="Imagen de perfil de {{ profile.nameUser() }}"
            class="profile-avatar">
        <span class="status-dot" title="Usuario seleccionado"></span>
    </div>

    <h6>{{ profile.nameUser() }}</h6>
    <p class="profile-email" [title]="profile.emailUser()">{{ profile.emailUser() }}</p>

    <div class="profile-role" *ngIf="profile.organizationUser()">
        <i class="bi bi-person-badge"></i>
        <span>{{ profile.organizationUser() }}</span>
    </div>

    <div class="profile-context" *ngIf="nameCompany != null || nameContract != null">
        <div *ngIf="nameCompany != null">
            <small>Empresa seleccionada</small>
            <strong>{{ nameCompany }}</strong>
        </div>
        <div *ngIf="nameContract != null">
            <small>Contrato seleccionado</small>
            <strong>{{ nameContract }}</strong>
        </div>
    </div>

    <div class="assignment-summary" *ngIf="sectionTitle">
        <div class="assignment-summary-title">
            <span><i class="bi" [ngClass]="sectionIcon"></i> {{ sectionTitle }}</span>
            <span class="assignment-total">{{ visibleAssignedItems.length }}</span>
        </div>
        <div class="assignment-items" *ngIf="visibleAssignedItems.length; else noAssignments">
            <div class="assignment-item" *ngFor="let item of visibleAssignedItems">
                <i class="bi bi-check-circle-fill"></i>
                <span>{{ item }}</span>
            </div>
        </div>
        <ng-template #noAssignments>
            <p class="empty-assignments">Sin asignaciones</p>
        </ng-template>
    </div>
</div>
