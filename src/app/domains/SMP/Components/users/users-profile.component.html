<div class="up-root">
  <div class="up-avatar-wrap">
    <img
      [src]="displayPic"
      (error)="onImgError()"
      [alt]="'Foto de ' + (profile.nameUser() || 'usuario')"
      class="up-avatar img-fluid" />
  </div>

  <div class="up-field">
    <span class="up-label">Nombre</span>
    <p class="up-value mb-0">{{ profile.nameUser() }}</p>
  </div>

  <div class="up-field">
    <span class="up-label">Correo electrónico</span>
    <p class="up-value mb-0">{{ profile.emailUser() }}</p>
  </div>

  <div class="up-field">
    <span class="up-label">Rol</span>
    <p class="up-value mb-0" [class.up-value--accent]="!isOrganizationPlaceholder">
      {{ profile.organizationUser() }}
    </p>
  </div>

  <div class="up-field" *ngIf="nameCompany != null">
    <span class="up-label">Proveedor seleccionado</span>
    <p class="up-value mb-0">{{ nameCompany }}</p>
  </div>

  <div class="up-field" *ngIf="nameContract != null">
    <span class="up-label">Contrato seleccionado</span>
    <p class="up-value mb-0">{{ nameContract }}</p>
  </div>
</div>
