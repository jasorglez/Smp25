<div class="row p-3">
    <div class="col-lg-2 col-md-3 col-sm-3 col-3" *ngIf="profile().emailUser()">
        <div class="card text-center">
            <app-users-profile></app-users-profile>
        </div>
    </div>
    <div [ngClass]="profile().emailUser() ? 'col-lg-10 col-md-9 col-sm-9 col-9' : 'col-12'">
        <div class="row mb-3">
            <nav class="col-auto d-flex flex-column align-items-start">
                <div class="col text-left" *ngIf="idContract != null">
                    <div class="form-check">
                        <input type="checkbox" name="contractChecked" id="contractChecked" class="form-check-input"
                            [checked]="contractChecked()()" (change)="onCheckboxChange($event)">
                        <label for="contractChecked" class="form-check-label">Filtrar por contrato</label>
                    </div>
                </div>
                <button type="button" class="btn btn-primary ms-1 me-1 mb-2" (click)="addRow()">
                    <i class="bi bi-plus-lg"></i>
                </button>
                <button type="button" class="btn btn-success ms-1 me-1 position-relative mb-2" (click)="saveChanges()">
                    <i class="bi bi-floppy"></i>
                    <span
                        class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
                        *ngIf="notSavedChanges"><span class="visually-hidden">Hay cambios sin guardar</span>
                    </span>
                </button>
                <button type="button" class="btn btn-warning ms-1 me-1 mb-2" (click)="revert()">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
                <button type="button" class="btn btn-danger ms-1 me-1 mb-2" (click)="deleteEntry()">
                    <i class="bi bi-trash"></i>
                </button>
            </nav>
            <div class="col">
                <div class="row">
                    <ag-grid-angular style="width: 100%; height: 500px" class="ag-theme-quartz small-text-ag-grid" [rowData]="rowData"
                        [columnDefs]="columnDefs" (selectionChanged)="onSelectionChanged($event)"
                        (cellValueChanged)="onCellValueChanged($event)" (rowSelected)="onSelectedRow($event)"
                        (gridReady)="onGridReady($event)" rowSelection="single" [gridOptions]="gridOptions">
                    </ag-grid-angular>
                </div>
            </div>
        </div>
    </div>
</div>
