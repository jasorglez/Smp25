<div class="row p-3">
    <div [ngClass]="profile().emailUser() ? 'col-lg-10 col-md-9 col-sm-9 col-9' : 'col-12'">
        <div class="mb-3">
            <div class="d-flex align-items-center flex-wrap gap-2 mb-2">
                <div class="form-check me-2" *ngIf="idContract != null">
                    <input type="checkbox" name="contractChecked" id="contractChecked" class="form-check-input"
                        [checked]="contractChecked()()" (change)="onCheckboxChange($event)">
                    <label for="contractChecked" class="form-check-label">Filtrar por contrato</label>
                </div>
                <button type="button" class="btn btn-sm btn-success" (click)="addRow()" title="Agregar proyecto">
                    <i class="bi bi-plus-lg"></i> Agregar
                </button>
                <button type="button" class="btn btn-sm btn-outline-success" (click)="addAllProjects()" title="Agregar todos los proyectos disponibles">
                    <i class="bi bi-plus-square"></i> Agregar todos
                </button>
                <button type="button" class="btn btn-sm btn-primary position-relative" (click)="saveChanges()" [disabled]="!notSavedChanges" title="Guardar cambios">
                    <i class="bi bi-floppy"></i> Guardar
                    <span
                        class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
                        *ngIf="notSavedChanges"><span class="visually-hidden">Hay cambios sin guardar</span>
                    </span>
                </button>
                <button type="button" class="btn btn-sm btn-warning" (click)="revert()" title="Deshacer cambios">
                    <i class="bi bi-arrow-clockwise"></i> Deshacer
                </button>
                <button type="button" class="btn btn-sm btn-danger" (click)="deleteEntry()" [disabled]="!selectedRowData" title="Borrar proyecto">
                    <i class="bi bi-trash"></i> Borrar
                </button>
            </div>
            <div>
                    <ag-grid-angular style="width: 100%; height: 500px" class="ag-theme-quartz small-text-ag-grid" [rowData]="rowData"
                        [columnDefs]="columnDefs" (selectionChanged)="onSelectionChanged($event)"
                        (cellValueChanged)="onCellValueChanged($event)" (rowSelected)="onSelectedRow($event)"
                        (gridReady)="onGridReady($event)" rowSelection="single" [gridOptions]="gridOptions" [stopEditingWhenCellsLoseFocus]="true">
                    </ag-grid-angular>
            </div>
        </div>
    </div>
    <div class="col-lg-2 col-md-3 col-sm-3 col-3" *ngIf="profile().emailUser()">
        <div class="card text-center">
            <app-users-profile></app-users-profile>
        </div>
    </div>
</div>
