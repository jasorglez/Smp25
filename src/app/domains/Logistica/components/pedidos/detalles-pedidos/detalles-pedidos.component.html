<div class="container-fluid p-2">
  <!-- Botones del detalle (arriba, alineados a la derecha) -->
  <div class="detail-toolbar d-flex justify-content-end gap-2 mb-2">
    <button type="button" [class.btn-info]="!hasBancoInfo" [class.btn-warning]="hasBancoInfo" class="btn btn-sm" (click)="openBancoModal()">
      <i [class.bi-bank]="!hasBancoInfo" [class.bi-pencil]="hasBancoInfo" class="bi"></i>
      {{ hasBancoInfo ? 'Editar banco' : 'Añadir banco' }}
    </button>
    <button type="button" class="btn btn-secondary btn-sm" (click)="sendToRemision(selectedRow)"
      [disabled]="!selectedRow || selectedRow?.estado !== 'RECIBIDO'">
      <i class="bi bi-truck"></i> Remisión
    </button>
    <button type="button" class="btn btn-primary btn-sm" (click)="addItem()" [disabled]="isLocked">
      <i class="bi bi-plus-lg"></i> Agregar
    </button>
    <button type="button" class="btn btn-success btn-sm position-relative" (click)="saveChanges()" [disabled]="isLocked || !hasUnsavedChanges">
      <i class="bi bi-floppy"></i> Guardar
      <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
        *ngIf="hasUnsavedChanges">
      </span>
    </button>
    <button type="button" class="btn btn-warning btn-sm" (click)="discardChanges()" [disabled]="isLocked || !hasUnsavedChanges">
      <i class="bi bi-arrow-clockwise"></i> Deshacer
    </button>
    <button type="button" class="btn btn-danger btn-sm" (click)="deleteSelectedItem()" [disabled]="isLocked">
      <i class="bi bi-trash"></i> Eliminar
    </button>
  </div>
  <!-- Grid de detalles -->
  <div class="detail-grid-shell">
    <ag-grid-angular
      style="width: 100%; height: 100%;"
      class="ag-theme-quartz small-text-ag-grid pedidos-detalles-grid"
      [rowData]="rowData"
      [columnDefs]="colDefs"
      [defaultColDef]="gridOptions?.defaultColDef"
      [rowSelection]="'single'"
      [animateRows]="true"
      [gridOptions]="gridOptions"
      (gridReady)="onGridReady($event)"
      (cellValueChanged)="onCellValueChanged($event)"
      [localeText]="AG_GRID_LOCALE_ES">
    </ag-grid-angular>
  </div>


</div>

<!-- Modal pago al banco -->
<div class="modal-overlay" *ngIf="showBancoModal">
  <div class="modal-card">
    <div class="modal-header-minimal">
      <h5 class="modal-title-minimal">{{ bancoModalTitle }}</h5>
      <button type="button" class="btn-close-minimal" (click)="closeBancoModal()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="modal-body-minimal">
      <div class="form-group-minimal mb-3">
        <label class="form-label-minimal">Selecciona un Banco *</label>
        <select class="form-control-minimal" [(ngModel)]="selectedBanco" placeholder="Elige un banco">
          <option value="" disabled selected>-- Selecciona un banco --</option>
          <option *ngFor="let banco of bancos" [value]="banco.name">{{ banco.name }}</option>
        </select>
      </div>

      <div class="form-group-minimal">
        <label class="form-label-minimal">Ingresa el Total *</label>
        <input type="number" class="form-control-minimal" [(ngModel)]="totalBanco" placeholder="0.00" min="0" step="0.01">
      </div>
    </div>

    <div class="modal-footer-minimal">
      <button type="button" class="btn-cancel-minimal" (click)="closeBancoModal()">
        Cancelar
      </button>
      <button type="button" class="btn-save-minimal" (click)="saveBancoTotal()" [disabled]="!selectedBanco || !totalBanco">
        Guardar
      </button>
    </div>
  </div>
</div>

<!-- Modal Nueva Plataforma -->
<div class="modal" tabindex="-1" [style.display]="showPlataformaModal ? 'block' : 'none'" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Nueva Plataforma</h5>
        <button type="button" class="btn-close" (click)="closePlataformaModal()"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Descripción *</label>
          <input type="text" class="form-control" [(ngModel)]="newPlataforma.description" placeholder="Nombre de la plataforma">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closePlataformaModal()">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="saveNewPlataforma()">Guardar</button>
      </div>
    </div>
  </div>
</div>
