<div class="col-12 p-2">
  <div class="d-flex gap-2">
    <div class="d-flex flex-column gap-1">
      <button type="button" class="btn btn-primary ms-1" (click)="loadData()" title="Recargar remisiones">
        <i class="bi bi-arrow-repeat"></i>
      </button>
    </div>

    <div class="flex-grow-1">
      <div class="d-flex gap-2 mb-2 flex-wrap">
        <button class="btn btn-sm"
          [style.background-color]="activeFilter === 'ABIERTA' ? '#fd7e14' : '#ffe5d0'"
          [style.color]="activeFilter === 'ABIERTA' ? 'white' : '#8a4b08'"
          [style.border]="'1px solid #fd7e14'"
          (click)="setFilter('ABIERTA')">
          Abiertas
        </button>
        <button class="btn btn-sm"
          [style.background-color]="activeFilter === 'CERRADA' ? '#17a2b8' : '#d1ecf1'"
          [style.color]="activeFilter === 'CERRADA' ? 'white' : '#0c5460'"
          [style.border]="'1px solid #17a2b8'"
          (click)="setFilter('CERRADA')">
          Cerradas
        </button>
        <button class="btn btn-sm"
          [class.btn-secondary]="activeFilter !== null"
          [class.btn-dark]="activeFilter === null"
          (click)="setFilter(null)">
          Todas
        </button>
      </div>

      <ag-grid-angular
        style="width: 100%; height: 78vh;"
        class="ag-theme-quartz small-text-ag-grid"
        [rowData]="rowData"
        [columnDefs]="colDefs"
        [defaultColDef]="defaultColDef"
        [gridOptions]="gridOptions"
        (gridReady)="onGridReady($event)"
        [localeText]="AG_GRID_LOCALE_ES">
      </ag-grid-angular>
    </div>
  </div>
</div>
