<div class="col-12">
  <div class="row">
    <div class="col-auto">
      <div class="d-flex flex-column gap-1">
        <button type="button" class="btn btn-secondary ms-1 me-1" (click)="goBackToPedidos()" title="Volver a pedidos">
          <i class="bi bi-arrow-left"></i>
        </button>
      </div>
    </div>

    <div class="col">
      <div class="d-flex gap-2 mb-2 flex-wrap align-items-center">
        <button type="button" class="btn btn-sm btn-info text-white" disabled>
          Entregado x cliente
        </button>
        <span class="text-muted small">
          Maestro agrupado por cliente. Expande una fila para ver pedidos y subtotales.
        </span>
      </div>

      <ag-grid-angular
        style="width: 100%;"
        [ngStyle]="{ height: gridHeight }"
        class="ag-theme-quartz small-text-ag-grid pedidos-main-grid"
        [rowData]="rowData"
        [columnDefs]="colDefs"
        [defaultColDef]="defaultColDef"
        [gridOptions]="gridOptions"
        (gridReady)="onGridReady($event)"
        [localeText]="AG_GRID_LOCALE_ES">
      </ag-grid-angular>
    </div>
  </div>
</div>
