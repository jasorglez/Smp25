<div class="container-fluid mt-2">
  <app-projects class="d-none" (projectCreated)="onProjectCreated($event)"></app-projects>
  <div class="d-flex align-items-center flex-wrap gap-3 mb-3 px-1">
    <label class="form-label mb-0 fw-semibold">{{ 'modules.warehouses.ui.movements.warehouse' | translate }}</label>
    <div class="warehouse-picker">
      <span class="warehouse-picker-icon"><i class="bi bi-building-fill-gear"></i></span>
      <ng-select
        class="warehouse-select"
        [attr.aria-label]="'modules.warehouses.ui.movements.warehouse' | translate"
        [items]="warehouses"
        bindLabel="nombreAlmacen"
        bindValue="idAlmacen"
        [ngModel]="selectedWarehouse?.idAlmacen || null"
        (ngModelChange)="onWarehouseChange($event)"
        [placeholder]="'modules.warehouses.ui.movements.selectWarehouse' | translate"
        [clearable]="false"
        [searchable]="true">
      </ng-select>
    </div>
    <ng-container>
      <label class="form-check form-check-inline mb-0" *ngIf="projectId">
        <input class="form-check-input" type="checkbox" [ngModel]="movementScope === 'project'" (ngModelChange)="onMovementScopeChange($event ? 'project' : 'all')">
        <span class="form-check-label">{{ 'modules.warehouses.ui.movements.onlySidebarProject' | translate }}</span>
      </label>
    </ng-container>
    <ng-container *ngIf="contractId">
      <label class="form-check form-check-inline mb-0">
        <input class="form-check-input" type="checkbox" [ngModel]="movementScope === 'contract'" (ngModelChange)="onMovementScopeChange($event ? 'contract' : 'all')">
        <span class="form-check-label">{{ 'modules.warehouses.ui.movements.onlySidebarContract' | translate }}</span>
      </label>
      <label class="form-check form-check-inline mb-0">
        <input class="form-check-input" type="checkbox" [ngModel]="movementScope === 'all'" (ngModelChange)="onMovementScopeChange($event ? 'all' : 'contract')">
        <span class="form-check-label">{{ 'modules.warehouses.ui.movements.allContracts' | translate }}</span>
      </label>
    </ng-container>
    <small class="text-muted" *ngIf="!warehouses.length">{{ 'modules.warehouses.ui.movements.noAuthorizedWarehouses' | translate }}</small>
  </div>
  <div class="row">
    <!-- Left Panel: CRUD Buttons -->
    <nav class="col-auto d-flex flex-column align-items-start">
      <button type="button" class="btn btn-primary me-1 mb-2" (click)="addEntry()" [disabled]="!selectedWarehouse">
        <i class="bi bi-plus-lg" style="font-size: 1rem;"></i>
      </button>

      <button type="button" class="btn btn-success position-relative mb-2" (click)="saveChanges()" [title]="'modules.warehouses.ui.movements.saveChangesF10' | translate">
        <i class="bi bi-floppy" style="font-size: 1rem;"></i>
        <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
          *ngIf="hasUnsavedChanges">
          <span class="visually-hidden">{{ 'modules.warehouses.ui.movements.unsavedChanges' | translate }}</span>
        </span>
      </button>

      <button type="button" class="btn btn-warning mb-2" (click)="refreshData()">
        <i class="bi bi-arrow-clockwise" style="font-size: 1rem;"></i>
      </button>

      <button type="button" class="btn btn-danger mb-2" (click)="deleteEntry()">
        <i class="bi bi-trash" style="font-size: 1rem;"></i>
      </button>

      <button type="button" class="btn btn-outline-dark mb-2" (click)="generateEvidenceReport()" [title]="'modules.warehouses.ui.movements.evidenceReport' | translate">
        <i class="bi bi-images" style="font-size: 1rem;"></i>
      </button>
    </nav>

    <!-- Right Panel: Grid -->
    <div class="col">
      <ag-grid-angular
        style="width: 100%;"
        [ngStyle]="{'height': gridHeight}"
        class="ag-theme-quartz small-text-ag-grid"
        [columnDefs]="colMaster"
        [rowData]="rowData"
        [context]="{ componentParent: this }"
        [gridOptions]="gridOptions"
        [localeText]="AG_GRID_LOCALE_ES"
        (gridReady)="onGridReady($event)"
        (cellKeyDown)="onMasterGridCellKeyDown($event)"
        (columnResized)="onMasterColumnResized($event)"
        (selectionChanged)="onSelectionChanged($event)"
        (cellClicked)="onCellClicked($event)"
        (cellValueChanged)="onCellValueChanged($event)"
        (cellEditingStopped)="onCellEditingStopped($event)"
        (cellDoubleClicked)="onCellDoubleClicked($event)">
      </ag-grid-angular>
    </div>
  </div>
</div>
