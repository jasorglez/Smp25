<div class="container-fluid mt-2">
  <div class="d-flex align-items-center gap-2 mb-2 px-1">
    <label class="form-label mb-0 fw-semibold">Almacén:</label>
    <select class="form-select form-select-sm" style="max-width:280px" [ngModel]="selectedWarehouse?.idAlmacen || ''" (ngModelChange)="onWarehouseChange($event)">
      <option value="">Seleccione un almacén</option>
      <option *ngFor="let warehouse of warehouses" [value]="warehouse.idAlmacen">{{ warehouse.nombreAlmacen || warehouse.name || warehouse.description }}</option>
    </select>
    <small class="text-muted" *ngIf="!warehouses.length">No tienes almacenes autorizados.</small>
  </div>
  <div class="row">
    <!-- Left Panel: CRUD Buttons -->
    <nav class="col-auto d-flex flex-column align-items-start">
      <button type="button" class="btn btn-primary me-1 mb-2" (click)="addEntry()" [disabled]="!selectedWarehouse">
        <i class="bi bi-plus-lg" style="font-size: 1rem;"></i>
      </button>

      <button type="button" class="btn btn-success position-relative mb-2" (click)="saveChanges()">
        <i class="bi bi-floppy" style="font-size: 1rem;"></i>
        <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
          *ngIf="hasUnsavedChanges">
          <span class="visually-hidden">Hay cambios sin guardar</span>
        </span>
      </button>

      <button type="button" class="btn btn-warning mb-2" (click)="refreshData()">
        <i class="bi bi-arrow-clockwise" style="font-size: 1rem;"></i>
      </button>

      <button type="button" class="btn btn-danger mb-2" (click)="deleteEntry()">
        <i class="bi bi-trash" style="font-size: 1rem;"></i>
      </button>
    </nav>

    <!-- Right Panel: Grid -->
    <div class="col">
      <ag-grid-angular
        style="width: 100%;"
        [ngStyle]="{'height': gridHeight}"
        class="ag-theme-quartz small-text-ag-grid"
        [columnDefs]="colMaster"
        [rowData]="rowData"
        [gridOptions]="gridOptions"
        [localeText]="AG_GRID_LOCALE_ES"
        (gridReady)="onGridReady($event)"
        (selectionChanged)="onSelectionChanged($event)"
        (cellValueChanged)="onCellValueChanged($event)"
        (cellEditingStopped)="onCellEditingStopped($event)"
        (cellDoubleClicked)="onCellDoubleClicked($event)">
      </ag-grid-angular>
    </div>
  </div>
</div>
