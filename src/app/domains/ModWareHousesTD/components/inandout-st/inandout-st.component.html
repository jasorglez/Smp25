<div class="container-fluid mt-3">
  <!-- Top: Warehouse, Catalog and OT Selectors -->
  <div class="row">
    <div class="col-4">
      <div class="form-group">
        <label for="warehouseSelect">Seleccionar Almacén:</label>
        <select
          id="warehouseSelect"
          class="form-control"
          style="font-size: 0.9em;"
          [(ngModel)]="selectedWarehouse"
          (change)="onWarehouseChange()">
          <option *ngFor="let wh of warehouses" [ngValue]="wh">
            {{ wh.name }}
          </option>
        </select>
      </div>
    </div>
    <div class="col-4">
      <div class="form-group">
        <label for="catalogSelect">Tipo de Movimiento:</label>
        <select
          id="catalogSelect"
          class="form-control"
          style="font-size: 0.9em;"
          [(ngModel)]="selectedCatalog"
          (change)="onCatalogChange()">
          <option *ngFor="let cat of catalogs" [ngValue]="cat">
            {{ cat.description }}
          </option>
          <option [ngValue]="addNewSentinel" style="color:#28a745;font-weight:600;">
            + Agregar Registro
          </option>
        </select>

        <!-- Formulario inline para nuevo tipo de movimiento -->
        <div *ngIf="showAddCatalogForm" class="d-flex gap-1 mt-1 align-items-center">
          <input
            type="text"
            class="form-control form-control-sm"
            [(ngModel)]="newCatalogDesc"
            placeholder="Descripción del nuevo tipo..."
            (keyup.enter)="saveNewCatalog()"
            autofocus
            style="font-size:0.8rem;" />
          <button class="btn btn-sm btn-success" (click)="saveNewCatalog()"
            [disabled]="!newCatalogDesc.trim() || savingCatalog" title="Guardar">
            <i class="bi bi-check-lg"></i>
          </button>
          <button class="btn btn-sm btn-outline-secondary" (click)="cancelNewCatalog()" title="Cancelar">
            <i class="bi bi-x-lg"></i>
          </button>
        </div>
      </div>
    </div>
    <div class="col-4">
      <div class="form-group">
        <label for="otSelect">Orden de Trabajo:</label>
        <select
          id="otSelect"
          class="form-control"
          style="font-size: 0.9em;"
          [(ngModel)]="selectedOt"
          (change)="onOtChange()">
          <option *ngFor="let ot of otList" [ngValue]="ot">
            {{ ot.description }}
          </option>
        </select>
      </div>
    </div>
  
  </div>

  <!-- Main Content: Buttons Left, Grid Right -->
  <div class="row">
    <!-- Left Panel: CRUD Buttons -->
    <nav class="col-auto d-flex flex-column align-items-start">
      <button type="button" class="btn btn-primary me-1 mb-2" (click)="addEntry()">
        <i class="bi bi-plus-lg" style="font-size: 1rem;"></i>
      </button>

      <button type="button" class="btn btn-success position-relative mb-2" (click)="saveChanges()">
        <i class="bi bi-floppy" style="font-size: 1rem;"></i>
        <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
          *ngIf="hasUnsavedChanges">
          <span class="visually-hidden">Hay cambios sin guardar</span>
        </span>
      </button>

      <button type="button" class="btn btn-warning mb-2" (click)="refreshData()">
        <i class="bi bi-arrow-clockwise" style="font-size: 1rem;"></i>
      </button>

      <button type="button" class="btn btn-danger mb-2" (click)="deleteEntry()">
        <i class="bi bi-trash" style="font-size: 1rem;"></i>
      </button>
    </nav>

    <!-- Right Panel: Grid -->
    <div class="col">
      <ag-grid-angular
        style="width: 100%;"
        [ngStyle]="{'height': gridHeight}"
        class="ag-theme-quartz small-text-ag-grid"
        [columnDefs]="colMaster"
        [rowData]="rowData"
        [gridOptions]="gridOptions"
        [localeText]="AG_GRID_LOCALE_ES"
        (gridReady)="onGridReady($event)"
        (selectionChanged)="onSelectionChanged($event)"
        (cellValueChanged)="onCellValueChanged($event)"
        (cellEditingStopped)="onCellEditingStopped($event)"
        (cellDoubleClicked)="onCellDoubleClicked($event)"
        (cellMouseOver)="onCellMouseOver($event)">
      </ag-grid-angular>
    </div>
  </div>
</div>
