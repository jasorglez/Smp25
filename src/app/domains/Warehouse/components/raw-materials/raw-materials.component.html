<app-multi-line-editor></app-multi-line-editor>
<div class="col-12 py-3">
  <!-- Botones y grid principal -->
  <div class="row mb-3">
    <div class="col-auto">
      <div class="d-flex flex-column gap-1">
        <button type="button" class="btn btn-primary" (click)="addMasterRow()">
          <i class="bi bi-plus-lg"></i>
        </button>
        
        <button *ngIf="idRequisition != null" type="button" class="btn btn-info position-relative"
          (click)="createOC(idRequisition, 'open')">
          <i class="bi bi-file-earmark-pdf"></i>
        </button>

        <button type="button" class="btn btn-success position-relative" (click)="saveMasterChanges()">
          <i class="bi bi-floppy"></i>
          <span
            class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
            *ngIf="masterNotSavedChanges">
            <span class="visually-hidden">Hay cambios sin guardar</span>
          </span>
        </button>
        <button type="button" class="btn btn-warning" (click)="revertMasterData()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button type="button" class="btn btn-danger" (click)="deleteMasterEntry()">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
    <div class="col">
      <ag-grid-angular style="width: 100%; height: 32vh;" class="ag-theme-quartz small-text-ag-grid" 
        [rowData]="masterRowData"
        [columnDefs]="colMaster"
        [gridOptions]="gridOptions" 
        (selectionChanged)="onMasterSelectionChanged($event)"
        (cellValueChanged)="onMasterCellValueChanged($event)" (rowSelected)="onMasterRowSelected($event)"
        (gridReady)="onMasterGridReady($event)" 
        [rowSelection]="rowSelection" 
        [pivotPanelShow]="pivotPanelShow"
        [stopEditingWhenCellsLoseFocus]="true">
      </ag-grid-angular>
    </div>
  </div>
</div>
