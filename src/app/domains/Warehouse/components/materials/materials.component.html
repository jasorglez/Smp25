<app-multi-line-editor></app-multi-line-editor>
<section class="col-12 mt-3">
  <div class="row">
    <aside class="col-2" *ngIf="id">
      <figure class="col mb-2">
        <img [src]="material.picture" alt="Imagen de {{material.description}}" class="img-fluid rounded" style="width:100%;">
      </figure>

      <div class="row">
        <figcaption class="col text-center">
          <p>{{material.description}}</p>
          <p>{{material.measure}}</p>
        </figcaption>
      </div>
    </aside>

    <main [ngClass]="id ? 'col-10' : 'col-12'">
      <div class="row">
        <nav class="col-auto d-flex flex-column align-items-start">
          <button type="button" class="btn btn-primary me-1 mb-2" (click)="addRow()">
            <i class="bi bi-plus-lg" style="font-size: 1.5rem;"></i>
          </button>
          <button type="button" class="btn btn-success position-relative mb-2" (click)="saveChanges()">
            <i class="bi bi-floppy" style="font-size: 1.5rem;"></i>
            <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
              *ngIf="notSavedChanges">
              <span class="visually-hidden">Hay cambios sin guardar</span>
            </span>
          </button>
          <button type="button" class="btn btn-warning mb-2" (click)="revert()">
            <i class="bi bi-arrow-clockwise" style="font-size: 1.5rem;"></i>
          </button>
          <button type="button" class="btn btn-danger mb-2" (click)="deleteEntry()">
            <i class="bi bi-trash" style="font-size: 1.5rem;"></i>
          </button>
        </nav>

        <section class="col">
          <ag-grid-angular style="width: 100%; height: 500px;" class="ag-theme-quartz" [rowData]="rowData"
            [columnDefs]="colMaster" (selectionChanged)="onSelectionChanged($event)"
            (cellValueChanged)="onCellValueChanged($event)" (rowSelected)="onSelectedRow($event)"
            (gridReady)="onGridReady($event)" rowSelection="single" [pivotPanelShow]="pivotPanelShow"
            [rowSelection]="rowSelection" [rowGroupPanelShow]="rowGroupPanelShow"
            [paginationPageSize]="paginationPageSize" [paginationPageSizeSelector]="paginationPageSizeSelector"
            [pagination]="true">
          </ag-grid-angular>
        </section>
      </div>
    </main>
  </div>
</section>
