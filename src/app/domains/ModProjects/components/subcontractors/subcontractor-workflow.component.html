<div class="subcontractor-home container-fluid py-3">
  <div class="card shadow-sm mx-auto" *ngIf="context.selected() as provider; else noProvider">
    <div class="card-header"><i class="bi {{icon}} me-2"></i>{{title}}</div>
    <div class="card-body">
      <div class="selected-provider mb-3"><i class="bi bi-person-check-fill"></i> Subcontratista seleccionado: <strong>{{provider.name}}</strong></div>
      <router-outlet></router-outlet>
      <div class="alert alert-info mb-0"><i class="bi bi-info-circle me-1"></i>Esta pantalla está ligada exclusivamente a <strong>{{provider.name}}</strong>; no consulta ni captura información de otro proveedor.</div>
    </div>
  </div>
  <ng-template #noProvider><div class="alert alert-warning">Primero selecciona el proveedor en <a routerLink="../subcontractors">Subcontratistas</a>.</div></ng-template>
</div>
