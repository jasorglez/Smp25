<div class="row p-3">
  <div class="col-12">

    <div class="d-flex align-items-center gap-2 mb-3">
      <h5 class="mb-0 me-3"><i class="bi bi-wrench-adjustable me-2"></i>Catálogo de Herramientas</h5>

      <button class="btn btn-sm btn-success" (click)="addRow()">
        <i class="bi bi-plus-lg"></i> Agregar
      </button>

      <button class="btn btn-sm btn-primary position-relative" (click)="saveChanges()" [disabled]="!hasChanges">
        <i class="bi bi-floppy"></i> Guardar
        <span *ngIf="hasChanges"
              class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle">
        </span>
      </button>

      <button class="btn btn-sm btn-warning" (click)="revertChanges()">
        <i class="bi bi-arrow-clockwise"></i> Deshacer
      </button>

      <button class="btn btn-sm btn-danger" (click)="deleteSelected()" [disabled]="!selectedRow">
        <i class="bi bi-trash"></i> Borrar
      </button>
    </div>

    <ag-grid-angular
      class="ag-theme-quartz"
      style="height: 75vh; width: 100%;"
      [rowData]="rowData"
      [columnDefs]="colDefs"
      [defaultColDef]="defaultColDef"
      [rowClassRules]="rowClassRules"
      rowSelection="single"
      [stopEditingWhenCellsLoseFocus]="true"
      (gridReady)="onGridReady($event)"
      (cellValueChanged)="onCellValueChanged($event)"
      (selectionChanged)="onSelectionChanged()"
      (cellEditingStopped)="onCellEditingStopped($event)">
    </ag-grid-angular>

  </div>
</div>
