<div class="row p-3">
  <div class="col-12">
    <div class="row mb-2">
      <div class="col text-right">
        <button type="button" class="btn btn-sm btn-primary me-1 compact-btn" (click)="addRow()">
          <i class="bi bi-plus-lg"></i>
        </button>
        <button type="button" class="btn btn-sm btn-success ms-1 me-1 compact-btn position-relative" (click)="saveChanges()">
          <i class="bi bi-floppy"></i>
          <span
            class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"
            *ngIf="notSavedChanges"><span class="visually-hidden">Cambios sin guardar</span>
          </span>
        </button>
        <label class="btn btn-sm btn-primary ms-1 me-1 mb-0 compact-btn">
          <i class="bi bi-file-excel"></i>
          <input type="file" (change)="importExcel($event)" style="display: none;">
        </label>
        <button type="button" class="btn btn-sm btn-warning ms-1 me-1 compact-btn" (click)="revert()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button type="button" class="btn btn-sm btn-danger ms-1 compact-btn" (click)="deleteEntry()">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
    <div class="row" style="height: 550px;">
      <div class="col-md-3">
        <ag-grid-angular [gridOptions]="gridOptions" style="width: 100%; height: 100%;" class="ag-theme-quartz small-text-ag-grid" [rowData]="rowData"
          [columnDefs]="columnDefs" (cellValueChanged)="onCellValueChanged($event)" (gridReady)="onGridReady($event)">
        </ag-grid-angular>
      </div>
      <div class="col-md-9">
        <div class="chart-container">
          <apx-chart #chart [series]="chartOptions.series" [chart]="chartOptions.chart" [xaxis]="chartOptions.xaxis"
            [stroke]="chartOptions.stroke" [colors]="chartOptions.colors" [dataLabels]="chartOptions.dataLabels"
            [legend]="chartOptions.legend" [markers]="chartOptions.markers" [grid]="chartOptions.grid"
            [yaxis]="chartOptions.yaxis" [title]="chartOptions.title"></apx-chart>
        </div>
      </div>
    </div>
  </div>
</div>
