<div class="row p-3">
  <div class="col-12">

    <!-- Botones -->
    <div class="row mb-2">
      <div class="col text-right">
        <button type="button" class="btn btn-sm btn-primary me-1 compact-btn" (click)="addRow()">
          <i class="bi bi-plus-lg"></i>
        </button>
        <button type="button" class="btn btn-sm btn-success ms-1 me-1 compact-btn position-relative" (click)="saveChanges()">
          <i class="bi bi-floppy"></i>
          <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"
            *ngIf="notSavedChanges"><span class="visually-hidden">Cambios sin guardar</span></span>
        </button>
        <label class="btn btn-sm btn-primary ms-1 me-1 mb-0 compact-btn">
          <i class="bi bi-file-excel"></i>
          <input type="file" (change)="importExcel($event)" style="display: none;">
        </label>
        <button type="button" class="btn btn-sm btn-warning ms-1 me-1 compact-btn" (click)="revert()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button type="button" class="btn btn-sm btn-danger ms-1 compact-btn" (click)="deleteEntry()">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>

    <!-- Grid + Gráfica + Tabla -->
    <div class="row">
      <!-- Grid izquierda -->
      <div class="col-md-3">
        <ag-grid-angular [gridOptions]="gridOptions" style="width: 100%; height: 480px;"
          class="ag-theme-quartz small-text-ag-grid" [rowData]="rowData"
          [columnDefs]="columnDefs" (cellValueChanged)="onCellValueChanged($event)" (gridReady)="onGridReady($event)">
        </ag-grid-angular>
      </div>
      <!-- Gráfica + Tabla derecha -->
      <div class="col-md-9 d-flex flex-column">
        <div class="chart-container">
          <apx-chart #chart
            [series]="chartOptions.series" [chart]="chartOptions.chart"
            [xaxis]="chartOptions.xaxis"   [yaxis]="chartOptions.yaxis"
            [stroke]="chartOptions.stroke" [colors]="chartOptions.colors"
            [fill]="chartOptions.fill"     [dataLabels]="chartOptions.dataLabels"
            [plotOptions]="chartOptions.plotOptions"
            [legend]="chartOptions.legend" [markers]="chartOptions.markers"
            [grid]="chartOptions.grid"     [title]="chartOptions.title"
            [tooltip]="chartOptions.tooltip">
          </apx-chart>
        </div>
        <!-- Tabla resumen mensual debajo de la gráfica -->
        <div class="table-resumen mt-1">
          <table class="table table-bordered table-sm mb-0">
            <thead>
              <tr>
                <th class="th-label">MES</th>
                <th *ngFor="let m of monthlyTableData" class="th-month">{{ m.month }}</th>
              </tr>
            </thead>
            <tbody>
              <tr class="tr-program">
                <td class="td-label">AVANCE PROGRAMADO ACUMULADO</td>
                <td *ngFor="let m of monthlyTableData" class="td-value">
                  {{ m.program !== null ? (m.program | number:'1.0-0') + '%' : '' }}
                </td>
              </tr>
              <tr class="tr-hitos">
                <td class="td-label">HITOS DE AVANCE</td>
                <td *ngFor="let m of monthlyTableData" class="td-value">
                  {{ m.hito !== null ? (m.hito | number:'1.0-0') + '%' : '' }}
                </td>
              </tr>
              <tr class="tr-physical">
                <td class="td-label">AVANCE REAL ACUMULADO</td>
                <td *ngFor="let m of monthlyTableData" class="td-value">
                  {{ m.physical !== null ? (m.physical | number:'1.0-0') + '%' : '' }}
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>
