<!-- Modal: Nuevo Tipo de Equipo -->
<div class="modal fade" [class.show]="showTypeEquipmentModal"
     [style.display]="showTypeEquipmentModal ? 'block' : 'none'"
     tabindex="-1" role="dialog" aria-modal="true">
  <div class="modal-dialog modal-sm" role="document">
    <div class="modal-content">
      <div class="modal-header bg-info text-white py-2">
        <h6 class="modal-title mb-0">
          <i class="bi bi-plus-circle me-2"></i>Nuevo Tipo de Equipo
        </h6>
        <button type="button" class="btn-close btn-close-white btn-sm" (click)="closeTypeEquipmentModal()"></button>
      </div>
      <div class="modal-body py-2">
        <div class="mb-2">
          <label class="form-label form-label-sm mb-1">Descripción</label>
          <input type="text" class="form-control form-control-sm"
                 [(ngModel)]="newTypeEquipment.description"
                 placeholder="Ej: Generador, Compresor..."
                 (keyup.enter)="saveNewTypeEquipment()" autofocus>
        </div>
      </div>
      <div class="modal-footer py-1">
        <button type="button" class="btn btn-sm btn-secondary" (click)="closeTypeEquipmentModal()">Cancelar</button>
        <button type="button" class="btn btn-sm btn-info text-white" (click)="saveNewTypeEquipment()">
          <i class="bi bi-floppy me-1"></i>Guardar
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show" *ngIf="showTypeEquipmentModal" (click)="closeTypeEquipmentModal()"></div>

<div class="row p-3">
  <div class="col-12 py-3">
    <!-- Botones y grid principal -->
    <div class="row mb-3">
      <nav class="col-auto d-flex flex-column align-items-start">
        <button type="button" class="btn btn-primary ms-1 me-1 mb-2" (click)="addMasterRow()">
          <i class="bi bi-plus-lg"></i>
        </button>
        <button type="button" class="btn btn-success ms-1 me-1 position-relative mb-2" (click)="saveMasterChanges()" >
          <i class="bi bi-floppy"></i>
          <span
            class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
              *ngIf="notSavedChanges">
            <span class="visually-hidden">Hay cambios sin guardar</span>
          </span>
        </button>
        <button type="button" class="btn btn-warning ms-1 me-1 mb-2"  (click)="revertMasterData()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button type="button" class="btn btn-danger ms-1 me-1 mb-2" (click)="deleteMasterEntry()"><i class="bi bi-trash"></i>
        </button>
      </nav>

    <div class="col">
      <div class="row">
        <ag-grid-angular
        style="width: 100%;"
        [ngStyle]="{'height': gridHeight}"
        class="ag-theme-quartz small-text-ag-grid"
        [rowData]="rowData"
        [columnDefs]="colMaster"
        (selectionChanged)="onMasterSelectionChanged($event)"
        [gridOptions]="gridOptions"
        (cellValueChanged)="onMasterCellValueChanged($event)"
        (rowSelected)="onMasterRowSelected($event)"
        (gridReady)="onMasterGridReady($event)"
        [pagination]="false"
        (cellDoubleClicked)="onCellDoubleClicked($event)"
        [components]="components"
        [stopEditingWhenCellsLoseFocus]="true"
        >
      </ag-grid-angular>
      </div>
    </div>
  </div>
</div>
