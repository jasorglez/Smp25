<div class="row p-2">
  <div class="col-12 mb-1">
    <div class="d-flex align-items-center gap-1">
      <small class="text-muted fw-bold me-1">
        <i class="bi bi-calendar-check me-1"></i>Reportes Diarios
      </small>

      <button type="button" class="btn btn-success btn-sm" (click)="add()">
        <i class="bi bi-plus-lg"></i>
      </button>
      <button type="button" class="btn btn-primary btn-sm position-relative" (click)="saveChanges()">
        <i class="bi bi-floppy"></i>
        <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
              *ngIf="hasUnsavedChanges">
          <span class="visually-hidden">Hay cambios sin guardar</span>
        </span>
      </button>
      <button type="button" class="btn btn-warning btn-sm" (click)="revertChanges()">
        <i class="bi bi-arrow-counterclockwise"></i>
      </button>
      <button type="button" class="btn btn-danger btn-sm" (click)="delete()">
        <i class="bi bi-trash"></i>
      </button>
      <button class="btn btn-sm btn-outline-secondary" (click)="loadReports()">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
    </div>
  </div>

  <div class="col-12">
    <ag-grid-angular
      class="ag-theme-quartz small-text-ag-grid"
      style="width:100%; height:85vh;"
      [rowData]="rowData"
      [columnDefs]="colDefs"
      [defaultColDef]="defaultColDef"
      [gridOptions]="gridOptions"
      [rowSelection]="'single'"
      (gridReady)="onGridReady($event)"
      (selectionChanged)="onRowSelected($event)"
      (cellValueChanged)="onCellValueChanged($event)"
      (columnPinned)="saveColState()"
      (columnMoved)="saveColState()"
      (columnResized)="saveColState()"
      (columnVisible)="saveColState()">
    </ag-grid-angular>
  </div>
</div>
