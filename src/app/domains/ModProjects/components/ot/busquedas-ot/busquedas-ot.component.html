<div class="container-fluid p-2">
  <div class="card search-card">
    <div class="card-header bg-white">
      <h5 class="mb-0"><i class="bi bi-search me-2"></i>Búsquedas OT</h5>
    </div>

    <div class="card-body d-flex flex-column">
      <form class="row g-3 align-items-end mb-3" (ngSubmit)="search()">
        <div class="col-sm-6 col-lg-3">
          <label for="searchCdc" class="form-label">CDC</label>
          <input id="searchCdc" name="cdc" type="text" class="form-control"
                 [(ngModel)]="cdc" placeholder="Buscar por CDC">
        </div>
        <div class="col-sm-6 col-lg-3">
          <label for="searchOtNumber" class="form-label">Número OT</label>
          <input id="searchOtNumber" name="otNumber" type="text" class="form-control"
                 [(ngModel)]="otNumber" placeholder="Buscar por número de OT">
        </div>
        <div class="col-sm-6 col-lg-3">
          <label for="searchArea" class="form-label">Área</label>
          <input id="searchArea" name="area" type="text" class="form-control"
                 [(ngModel)]="area" placeholder="Buscar por área">
        </div>
        <div class="col-sm-6 col-lg-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
            <i *ngIf="!loading" class="bi bi-search me-1"></i>Buscar
          </button>
          <button type="button" class="btn btn-outline-secondary" (click)="clear()" [disabled]="loading">
            <i class="bi bi-eraser me-1"></i>Limpiar
          </button>
        </div>
      </form>

      <div class="d-flex justify-content-between align-items-center mb-2">
        <small class="text-muted">Los filtros se pueden combinar. Una búsqueda vacía muestra todas las OT.</small>
        <span *ngIf="searched" class="badge bg-secondary">{{ rowData.length }} resultado(s)</span>
      </div>

      <ag-grid-angular
        class="ag-theme-quartz search-grid"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [gridOptions]="gridOptions"
        [loading]="loading"
        (gridReady)="onGridReady($event)">
      </ag-grid-angular>
    </div>
  </div>
</div>
