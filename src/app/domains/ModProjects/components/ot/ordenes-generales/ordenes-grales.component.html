<div class="container-fluid mt-3">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4 class="mb-0">
        <i class="bi bi-card-list me-2"></i>
        {{ 'Órdenes de Trabajo Generales' | translate }}
      </h4>
    </div>
    <div class="card-body">
      <form [formGroup]="form" (ngSubmit)="buscarOts()">
        <div class="row g-3 align-items-end">
          <div class="col-md-4 col-lg-3">
            <label for="fechaInicio" class="form-label">{{ 'Fecha de Inicio' | translate }}</label>
            <input type="date" id="fechaInicio" class="form-control" formControlName="fechaInicio">
          </div>
          <div class="col-md-4 col-lg-3">
            <label for="fechaFin" class="form-label">{{ 'Fecha de Fin' | translate }}</label>
            <input type="date" id="fechaFin" class="form-control" formControlName="fechaFin">
          </div>
          <div class="col-md-4 col-lg-2">
            <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              <i *ngIf="!isLoading" class="bi bi-search"></i>
              {{ 'Buscar' | translate }}
            </button>
          </div>
        </div>
      </form>

      <div class="ag-theme-quartz mt-4" style="height: 65vh; width: 100%;">
        <ag-grid-angular
          [rowData]="rowData"
          [columnDefs]="columnDefs"
          (gridReady)="onGridReady($event)">
        </ag-grid-angular>
      </div>
    </div>
  </div>
</div>
