<div class="container-fluid p-1">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h5 class="card-title m-0">
            <i class="bi bi-clock-history"></i> 
            Histórico de OT
          </h5>
        </div>
        <div class="card-body p-1">
          <!-- SECCIÓN PRINCIPAL: Botones CRUD y Grid -->
          <div class="row" style="position: relative; height: calc(100vh - 200px);">
            
            <!-- Columna izquierda: Botones CRUD -->
            <div class="col-auto border-end" style="position: relative; height: 100%;">
              <nav class="d-flex flex-column align-items-start pt-2">
                <button type="button" 
                        class="btn btn-primary ms-1 me-1 mb-2" 
                        (click)="addRow()" 
                        title="Agregar nueva fila">
                  <i class="bi bi-plus-lg"></i>
                </button>
                
                <button type="button" 
                        class="btn btn-success ms-1 me-1 mb-2" 
                        (click)="saveChanges()" 
                        [disabled]="!notSavedChanges"
                        title="Guardar cambios">
                  <i class="bi bi-floppy"></i>
                </button>
                
                <button type="button" 
                        class="btn btn-warning ms-1 me-1 mb-2" 
                        (click)="revert()" 
                        [disabled]="!notSavedChanges"
                        title="Revertir cambios">
                  <i class="bi bi-arrow-clockwise"></i>
                </button>
                
                <button type="button" 
                        class="btn btn-danger ms-1 me-1 mb-2" 
                        (click)="deleteEntry()" 
                        title="Eliminar fila seleccionada">
                  <i class="bi bi-trash"></i>
                </button>
              </nav>
            </div>
            
            <!-- Columna derecha: Grid de datos históricos de OT -->
            <div class="col overflow-hidden" style="position: relative; height: 100%; display: flex; flex-direction: column;">
              <div class="d-flex align-items-center justify-content-between gap-2 mb-2 px-1">
                <div class="form-check form-switch m-0">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="showOpenOnly"
                    [(ngModel)]="showOpenOnly"
                    (change)="onOpenOnlyChange()">
                  <label class="form-check-label" for="showOpenOnly">
                    Ver abiertas
                  </label>
                </div>
                <small class="text-muted">
                  Desactivado: cerradas por defecto
                </small>
              </div>

              <div class="flex-grow-1 overflow-auto">
                <ag-grid-angular 
                  style="height: 100%; width: 100%;"
                  class="ag-theme-quartz small-text-ag-grid"
                  [rowData]="rowData"
                  [columnDefs]="columnDefs"
                  [defaultColDef]="defaultColDef"
                  [gridOptions]="gridOptions"
                  (selectionChanged)="onSelectionChanged($event)"
                  (gridReady)="onGridReady($event)"
                  (cellValueChanged)="onCellValueChanged($event)"
                  (cellEditingStarted)="onCellEditingStarted($event)"
                  (cellEditingStopped)="onCellEditingStopped($event)"
                  [rowSelection]="'single'"
                  [stopEditingWhenCellsLoseFocus]="true"
                  [singleClickEdit]="true">
                </ag-grid-angular>
              </div>
              
              <!-- Indicador de cambios no guardados -->
              <div class="alert alert-warning mt-2 mb-0 py-1" *ngIf="notSavedChanges">
                <small>
                  <i class="bi bi-exclamation-triangle"></i>
                  Hay cambios sin guardar
                </small>
              </div>
            </div>
            
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
