<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">
            <i class="bi bi-file-earmark-text"></i> 
            {{'work_orders' | translate}}
          </h3>
        </div>
        <div class="card-body">
          <!-- Botones CRUD y AG-Grid -->
          <div class="row">
            <!-- Botones de acciones -->
            <nav class="col-auto d-flex flex-column align-items-start">
              <button type="button" class="btn btn-primary ms-1 me-1 mb-2" (click)="addRow()">
                <i class="bi bi-plus-lg"></i>
              </button>
              <button type="button" class="btn btn-success ms-1 me-1 position-relative mb-2" (click)="saveChanges()">
                <i class="bi bi-floppy"></i>
                <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
                      *ngIf="notSavedChanges">
                  <span class="visually-hidden">Hay cambios sin guardar</span>
                </span>
              </button>
              <button type="button" class="btn btn-warning ms-1 me-1 mb-2" (click)="revert()">
                <i class="bi bi-arrow-clockwise"></i>
              </button>
              <button type="button" class="btn btn-danger ms-1 me-1 mb-2" (click)="deleteEntry()">
                <i class="bi bi-trash"></i>
              </button>
            </nav>
            
            <!-- AG-Grid para mostrar datos de órdenes -->
            <div class="col">
              <ag-grid-angular style="width: 100%; height: 700px;"
                class="ag-theme-quartz small-text-ag-grid"
                [rowData]="rowData"
                [columnDefs]="columnDefs"
                [gridOptions]="gridOptions"
                (selectionChanged)="onSelectionChanged($event)"
                (cellValueChanged)="onCellValueChanged($event)"
                (gridReady)="onGridReady($event)"
                [rowSelection]="'single'"
                [stopEditingWhenCellsLoseFocus]="true">
              </ag-grid-angular>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
