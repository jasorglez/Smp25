<div class="container-fluid mt-3">
  <!-- Fila de filtros y acciones -->
  <div class="card shadow-sm mb-3">
    <div class="card-body">

      <div class="d-flex align-items-center gap-3">
        <!-- Fecha Inicio -->
        <div class="d-flex align-items-center gap-2">
          <label for="fechaInicio" class="form-label mb-0 text-nowrap">Fecha Inicio:</label>
          <input type="date" class="form-control form-control-sm" id="fechaInicio" [(ngModel)]="fechaInicio">
        </div>

        <!-- Fecha Fin -->
        <div class="d-flex align-items-center gap-2">
          <label for="fechaFin" class="form-label mb-0 text-nowrap">Fecha Fin:</label>
          <input type="date" class="form-control form-control-sm" id="fechaFin" [(ngModel)]="fechaFin">
        </div>

        <!-- Botones -->
        <div class="ms-auto d-flex gap-2">
          <button class="btn btn-primary btn-sm" (click)="consultarEstimaciones()" [disabled]="isLoading">
            <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            <i *ngIf="!isLoading" class="bi bi-search"></i>
            {{ isLoading ? 'Consultando...' : 'Consultar' }}
          </button>

          <button class="btn btn-success btn-sm" (click)="exportarExcel()">
            <i class="bi bi-file-earmark-excel"></i> Exportar Excel
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Grid de Estimaciones -->
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <ag-grid-angular
         style="width: 100%; height: 500px;" 
         class="ag-theme-quartz small-text-ag-grid" 
        [columnDefs]="columnDefs"
        [rowData]="rowData"
        [defaultColDef]="defaultColDef"
        (gridReady)="onGridReady($event)"
      >
      </ag-grid-angular>
    </div>
  </div>
</div>
