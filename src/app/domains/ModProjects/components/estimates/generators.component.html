<div class="row p-1">
    <div class="col-12">

        <!-- Cabecera -->
        <div class="row mb-1">
            <div class="col-12">
                <div class="alert alert-info d-flex justify-content-between align-items-center py-2">
                    <div>
                        <h6 class="mb-0">
                            <i class="bi bi-folder2"></i> Generadores - Vista Maestro
                        </h6>
                        <small class="text-muted">
                            Haga doble-click en un generador para ver sus ítems
                        </small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Botones + Grid -->
        <div class="row">

            <!-- Botones MAESTRO -->
            <nav class="col-auto d-flex flex-column align-items-start">
                <div class="mb-2 small text-primary fw-bold">
                    <i class="bi bi-folder2"></i> GENERADORES
                </div>

                <!-- Agregar -->
                <button type="button" class="btn btn-primary me-1 mb-2"
                        (click)="addGenerator()" title="Agregar nuevo generador">
                    <i class="bi bi-plus-lg"></i>
                </button>

                <!-- Guardar -->
                <button type="button" class="btn btn-success position-relative mb-2"
                        (click)="saveGenerators()" title="Guardar cambios">
                    <i class="bi bi-floppy"></i>
                    <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
                          *ngIf="notSavedChanges">
                        <span class="visually-hidden">Hay cambios sin guardar</span>
                    </span>
                </button>

                <!-- Deshacer -->
                <button type="button" class="btn btn-warning mb-2"
                        (click)="revert()" title="Deshacer cambios">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>

                <!-- Eliminar generador -->
                <button type="button" class="btn btn-danger mb-2"
                        (click)="deleteGenerator()" [disabled]="!selectedRowData"
                        title="Eliminar generador seleccionado">
                    <i class="bi bi-trash"></i>
                </button>

                <!-- Indicador seleccionado -->
                <div class="mt-2 small text-muted" *ngIf="selectedRowData">
                    <i class="bi bi-folder2"></i>
                    {{ selectedRowData?.numero || 'Generador' }} seleccionado
                </div>
            </nav>

            <!-- Grid maestro -->
            <div class="col">
                <ag-grid-angular
                    style="width: 100%; height: 560px;"
                    class="ag-theme-quartz small-text-ag-grid"
                    [rowData]="rowData"
                    [columnDefs]="columnDefs"
                    [defaultColDef]="defaultColDef"
                    [gridOptions]="gridOptions"
                    (cellValueChanged)="onCellValueChanged($event)"
                    (cellEditingStopped)="onCellEditingStopped($event)"
                    (gridReady)="onGridReady($event)"
                    rowSelection="single">
                </ag-grid-angular>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Agregar Nueva Área/Fase -->
<div *ngIf="showFaseModal" class="modal d-block" tabindex="-1" style="background:rgba(0,0,0,.45);">
  <div class="modal-dialog modal-dialog-centered" style="max-width:380px;">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white py-2">
        <h6 class="modal-title mb-0"><i class="bi bi-plus-circle me-1"></i> Nueva Área</h6>
        <button type="button" class="btn-close btn-close-white" (click)="closeFaseModal()"></button>
      </div>
      <div class="modal-body py-3">
        <label class="form-label fw-semibold">
          Nombre del Área <span class="text-muted small">(máx. 20 caracteres)</span>
        </label>
        <input type="text" class="form-control" [(ngModel)]="newFaseName"
               maxlength="20" placeholder="Ej. CIVIL, MECÁNICA..."
               (keydown.enter)="confirmNewFase()">
        <div class="text-end mt-1">
          <small class="text-muted">{{ newFaseName.length }}/20</small>
        </div>
      </div>
      <div class="modal-footer py-2">
        <button class="btn btn-secondary btn-sm" (click)="closeFaseModal()">Cancelar</button>
        <button class="btn btn-primary btn-sm" (click)="confirmNewFase()" [disabled]="!newFaseName.trim()">
          <i class="bi bi-check-lg me-1"></i> Agregar
        </button>
      </div>
    </div>
  </div>
</div>
