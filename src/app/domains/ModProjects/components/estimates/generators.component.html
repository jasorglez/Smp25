<div class="row p-3">
    <div class="col-12">
        <div class="row mb-3">
            <nav class="col-auto d-flex flex-column align-items-start">
                <!-- Botones contextuales según selección -->
                <button type="button" class="btn btn-primary me-1 mb-2" (click)="addTreeNode()" 
                        [title]="getAddButtonTitle()">
                    <i class="bi bi-plus-lg"></i>
                </button>
                <button type="button" class="btn btn-success position-relative mb-2" (click)="saveTreeChanges()">
                    <i class="bi bi-floppy"></i>
                    <span
                        class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
                        *ngIf="notSavedChanges">
                        <span class="visually-hidden">Hay cambios sin guardar</span>
                    </span>
                </button>
                <button type="button" class="btn btn-warning mb-2" (click)="revert()">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
                <button type="button" class="btn btn-danger mb-2" (click)="deleteTreeNode()" 
                        [disabled]="!selectedRowData">
                    <i class="bi bi-trash"></i>
                </button>
                
                <!-- Indicador del tipo de nodo seleccionado -->
                <div class="mt-2 small text-muted" *ngIf="selectedNodeType">
                    <i class="bi" [ngClass]="selectedNodeType === 'generator' ? 'bi-folder2' : 'bi-file-text'"></i>
                    {{ selectedNodeType === 'generator' ? 'Generador' : 'Item' }} seleccionado
                </div>
            </nav>
            <div class="col">
                <!-- Tree Data Grid -->
                <ag-grid-angular 
                    style="width: 100%; height: 500px;" 
                    class="ag-theme-quartz small-text-ag-grid" 
                    [rowData]="treeData"
                    [columnDefs]="columnDefs" 
                    [gridOptions]="gridOptions"
                    (cellValueChanged)="onCellValueChanged($event)" 
                    (gridReady)="onGridReady($event)" 
                    rowSelection="single">
                </ag-grid-angular>
            </div>
        </div>
    </div>
</div>
