<div class="row p-3">
    <div class="col-12">
        <div class="row mb-3">
            <nav class="col-auto d-flex flex-column align-items-start">
                <button type="button" class="btn btn-primary me-1 mb-2" (click)="addRow()">
                    <i class="bi bi-plus-lg"></i>
                </button>
                <button type="button" class="btn btn-success position-relative mb-2" (click)="saveChanges()">
                    <i class="bi bi-floppy"></i>
                    <span
                        class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
                        *ngIf="notSavedChanges">
                        <span class="visually-hidden">Hay cambios sin guardar</span>
                    </span>
                </button>
                <button type="button" class="btn btn-warning mb-2" (click)="revert()">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
                <button type="button" class="btn btn-danger mb-2" (click)="deleteEntry()">
                    <i class="bi bi-trash"></i>
                </button>
            </nav>
            <div class="col">
                <!-- Grid Maestro -->
                <ag-grid-angular 
                    style="width: 100%; height: 250px;" 
                    class="ag-theme-quartz small-text-ag-grid" 
                    [rowData]="rowData"
                    [columnDefs]="columnDefs" 
                    (selectionChanged)="onSelectionChanged($event)" 
                    [gridOptions]="gridOptions"
                    (cellValueChanged)="onCellValueChanged($event)" 
                    (gridReady)="onGridReady($event)" 
                    rowSelection="single">
                </ag-grid-angular>

                <!-- Grid Detalle -->
                <div *ngIf="showDetailGrid" class="mt-3">
                    <div class="card">
                        <div class="card-header bg-light d-flex justify-content-between align-items-center">
                            <h6 class="card-title mb-0">
                                <i class="bi bi-list-ul me-2"></i>
                                Items del Generador: {{ selectedRowData?.numero }}
                            </h6>
                            <div class="btn-group btn-group-sm">
                                <button type="button" class="btn btn-primary" (click)="addDetailRow()" 
                                        [disabled]="!selectedGeneratorId || selectedGeneratorId.toString().startsWith('temp_')">
                                    <i class="bi bi-plus-lg"></i>
                                </button>
                                <button type="button" class="btn btn-success" (click)="saveDetailChanges()">
                                    <i class="bi bi-floppy"></i>
                                </button>
                                <button type="button" class="btn btn-danger" (click)="deleteDetailEntry()">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="card-body p-2">
                            <ag-grid-angular 
                                style="width: 100%; height: 200px;" 
                                class="ag-theme-quartz small-text-ag-grid" 
                                [rowData]="detailRowData"
                                [columnDefs]="detailColumnDefs" 
                                (selectionChanged)="onDetailSelectionChanged($event)" 
                                (cellValueChanged)="onDetailCellValueChanged($event)" 
                                (gridReady)="onDetailGridReady($event)" 
                                rowSelection="single">
                            </ag-grid-angular>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
