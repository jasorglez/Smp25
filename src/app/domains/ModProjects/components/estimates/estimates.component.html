<div class="row p-1">
    <div class="col-12">

        <!-- Cabecera -->
        <div class="row mb-1">
            <div class="col-12">
                <div class="alert alert-secondary d-flex justify-content-between align-items-center py-2">
                    <div>
                        <h6 class="mb-0">
                            <i class="bi bi-file-earmark-text"></i> Estimaciones
                        </h6>
                        <small class="text-muted">
                            Haga doble-click en una estimación para ver sus generadores
                        </small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Botones + Grid -->
        <div class="row">

            <!-- Botones MAESTRO -->
            <nav class="col-auto d-flex flex-column align-items-start">
                <div class="mb-2 small text-secondary fw-bold">
                    <i class="bi bi-file-earmark-text"></i> ESTIMACIONES
                </div>

                <!-- Agregar -->
                <button type="button" class="btn btn-primary mb-2"
                        (click)="addRow()" title="Agregar estimación">
                    <i class="bi bi-plus-lg"></i>
                </button>

                <!-- Guardar -->
                <button type="button" class="btn btn-success position-relative mb-2"
                        (click)="saveChanges()" title="Guardar cambios">
                    <i class="bi bi-floppy"></i>
                    <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
                          *ngIf="notSavedChanges">
                        <span class="visually-hidden">Hay cambios sin guardar</span>
                    </span>
                </button>

                <!-- Deshacer -->
                <button type="button" class="btn btn-warning mb-2"
                        (click)="revert()" title="Deshacer cambios">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>

                <!-- Eliminar -->
                <button type="button" class="btn btn-danger mb-2"
                        (click)="deleteEntry()" title="Eliminar estimación seleccionada">
                    <i class="bi bi-trash"></i>
                </button>

                <!-- PDF -->
                <button type="button" class="btn btn-outline-primary mb-2"
                        (click)="generateSamplePdf()" [disabled]="!selectedEstimate"
                        title="Generar PDF de estimación">
                    <i class="bi bi-file-earmark-pdf"></i>
                </button>

                <!-- Indicador seleccionado -->
                <div class="mt-2 small text-muted" *ngIf="selectedEstimate">
                    <i class="bi bi-file-earmark-text"></i>
                    {{ selectedEstimate?.number }}
                </div>
            </nav>

            <!-- Grid maestro -->
            <div class="col">
                <ag-grid-angular
                    style="width: 100%; height: 560px;"
                    class="ag-theme-quartz small-text-ag-grid"
                    [rowData]="rowData"
                    [columnDefs]="columnDefs"
                    [defaultColDef]="defaultColDef"
                    [gridOptions]="gridOptions"
                    (cellValueChanged)="onCellValueChanged($event)"
                    (cellEditingStopped)="onCellEditingStopped($event)"
                    (gridReady)="onGridReady($event)"
                    rowSelection="single">
                </ag-grid-angular>
            </div>
        </div>
    </div>
</div>
