<div class="row p-3">
  <div class="col-12 py-3">
    <!-- Botones y grid principal -->
    <div class="row mb-3">
      <nav class="col-auto d-flex flex-column align-items-start">
        <button type="button" class="btn btn-primary ms-1 me-1 mb-2" (click)="onAdd()">
          <i class="bi bi-plus"></i>
        </button>
        <button type="button" class="btn btn-success ms-1 me-1 position-relative mb-2" (click)="onEdit()" >
          <i class="bi bi-floppy"></i>
          <span
            class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
              *ngIf="notSavedChanges">
            <span class="visually-hidden">Hay cambios sin guardar</span>
          </span>
        </button>
        <button type="button" class="btn btn-warning ms-1 me-1 mb-2"  (click)="revertMasterData()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button type="button" class="btn btn-danger ms-1 me-1 mb-2" (click)="onDelete()"><i class="bi bi-trash"></i>
        </button>
      </nav>

    <div class="col">
      <div class="row">
        <ag-grid-angular
        style="width: 100%;"
        [ngStyle]="{'height': gridHeight}"
        class="ag-theme-quartz small-text-ag-grid"
        [rowData]="rowData"
        [columnDefs]="colMaster"
        (selectionChanged)="onMasterSelectionChanged($event)"
        [gridOptions]="gridOptions"
        (cellValueChanged)="onMasterCellValueChanged($event)"
        (rowSelected)="onMasterRowSelected($event)"
        (gridReady)="onMasterGridReady($event)"
        [pagination]="false"
        (cellDoubleClicked)="onCellDoubleClicked($event)"
        [components]="components"
        [stopEditingWhenCellsLoseFocus]="true"
        >
      </ag-grid-angular>
      </div>
    </div>
  </div>
</div>

<!-- Modal for image viewing -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-labelledby="imageModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="imageModalLabel">Vista de Imagen</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <img *ngIf="selectedImage" [src]="selectedImage" class="img-fluid" alt="Material Image" />
      </div>
    </div>
  </div>
</div>
