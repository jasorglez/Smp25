<div class="acat-layout d-flex flex-column" style="height: 100%; padding: 8px; gap: 6px; overflow: hidden;">

  <!-- ── Toolbar ─────────────────────────────────────────────────────────── -->
  <div class="d-flex gap-2 align-items-center flex-shrink-0">
    <button class="btn btn-sm btn-success" (click)="addRow()" [disabled]="!gridApi">
      <i class="bi bi-plus-lg"></i> Agregar
    </button>
    <button class="btn btn-sm btn-primary position-relative" (click)="saveChanges()" [disabled]="!hasMainChanges">
      <i class="bi bi-floppy"></i> Guardar
      <span *ngIf="hasMainChanges"
            class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"></span>
    </button>
    <button class="btn btn-sm btn-warning" (click)="revertChanges()" [disabled]="!hasMainChanges">
      <i class="bi bi-arrow-clockwise"></i> Deshacer
    </button>
    <button class="btn btn-sm btn-danger" (click)="deleteRow()" [disabled]="!selectedAuxiliar">
      <i class="bi bi-trash"></i>
    </button>
    <small class="text-muted ms-auto">{{ rowData.length }} auxiliares</small>
  </div>

  <!-- ── Split layout: LIST | DETAIL ────────────────────────────────────── -->
  <div class="d-flex flex-fill" [class.is-dragging]="isSplitterDragging" style="min-height: 0; overflow: hidden;">

    <!-- LEFT: master list -->
    <div class="d-flex flex-column flex-shrink-0" [style.width.px]="leftWidth" style="min-height: 0;">
      <ag-grid-angular
        class="ag-theme-quartz small-text-ag-grid"
        style="height: 100%; width: 100%;"
        [rowData]="rowData"
        [columnDefs]="colDefs"
        [gridOptions]="gridOptions"
        rowSelection="single"
        [animateRows]="true"
        (gridReady)="onGridReady($event)"
        (selectionChanged)="onSelectionChanged()"
        (cellValueChanged)="onCellValueChanged($event)"
        (cellEditingStopped)="onCellEditingStopped($event)">
      </ag-grid-angular>
    </div>

    <!-- SPLITTER -->
    <div class="split-handle" [class.dragging]="isSplitterDragging"
         (mousedown)="onSplitterMouseDown($event)">
      <div class="split-handle-grip">⋮</div>
    </div>

    <!-- RIGHT: detail panel -->
    <div class="flex-fill d-flex flex-column" style="min-width: 0; min-height: 0; overflow: hidden;">

      <!-- placeholder cuando no hay selección -->
      <ng-container *ngIf="!selectedAuxiliar; else detailTpl">
        <div class="d-flex align-items-center justify-content-center flex-fill text-muted">
          <div class="text-center">
            <i class="bi bi-arrow-left-circle d-block mb-2 opacity-25" style="font-size: 2.5rem;"></i>
            <small>Selecciona un auxiliar</small>
          </div>
        </div>
      </ng-container>

      <!-- ── Detalle del Auxiliar ──────────────────────────────────────── -->
      <ng-template #detailTpl>
        <!-- Barra de detalle -->
        <div class="d-flex align-items-center gap-2 mb-2 flex-shrink-0">
          <span class="fw-semibold text-truncate" style="font-size: 0.9rem;">
            <i class="bi bi-people-fill text-success me-1"></i>{{ selectedAuxiliar.name || '—' }}
          </span>
          <div class="ms-auto d-flex gap-1">
            <button class="btn btn-sm btn-outline-success" (click)="addItem()" [disabled]="!selectedAuxiliar?.id">
              <i class="bi bi-plus-lg"></i>
            </button>
            <button class="btn btn-sm btn-primary position-relative" (click)="saveItems()" [disabled]="!hasItemChanges">
              <i class="bi bi-floppy"></i>
              <span *ngIf="hasItemChanges"
                    class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"></span>
            </button>
            <button class="btn btn-sm btn-danger" (click)="deleteItem()" [disabled]="!selectedItem">
              <i class="bi bi-trash"></i>
            </button>
          </div>
        </div>

        <!-- Grid de workers/personal -->
        <ag-grid-angular
          class="ag-theme-quartz small-text-ag-grid flex-fill"
          style="width: 100%; height: calc(100vh - 200px);"
          [rowData]="itemRows"
          [columnDefs]="itemColDefs"
          [rowClassRules]="rowClassRules"
          rowSelection="single"
          (gridReady)="onItemGridReady($event)"
          (selectionChanged)="onItemSelectionChanged()"
          (cellValueChanged)="onItemValueChanged($event)">
        </ag-grid-angular>

        <!-- Subtotal footer -->
        <div class="d-flex justify-content-end align-items-center mt-1 flex-shrink-0" style="font-size: 0.82rem;">
          <span class="text-muted me-2">{{ itemRows.length }} registros — Subtotal MO:</span>
          <strong class="text-success">${{ subtotal | number:'1.2-2' }}</strong>
        </div>
      </ng-template>
    </div><!-- /right -->
  </div><!-- /split -->
</div>
