<app-multi-line-editor></app-multi-line-editor>
<div class="row p-3">
  <div class="col-12">
    <div class="row mt-3">
      <!-- Columna de botones -->
      <div class="col-auto">
        <div class="d-flex flex-column gap-1">
          <button type="button" class="btn btn-primary ms-1 me-1" (click)="addRow()">
            <i class="bi bi-plus-lg"></i>
          </button>
          <button type="button" class="btn btn-success ms-1 me-1 position-relative" (click)="saveChanges()">
            <i class="bi bi-floppy"></i>
            <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
              *ngIf="notSavedChanges">
              <span class="visually-hidden">Hay cambios sin guardar</span>
            </span>
          </button>
          <button type="button" class="btn btn-warning ms-1 me-1" (click)="revert()">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
          <button type="button" class="btn btn-danger ms-1 me-1" (click)="deleteEntry()">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
      <!-- Grid principal -->
      <div class="col">
        <ag-grid-angular 
        style="width: 100%"
        [ngStyle]="{ height: gridHeight }"
        class="ag-theme-quartz small-text-ag-grid"
          [rowData]="rowData" 
          [gridOptions]="gridOptions"
          [columnDefs]="columnDefs" 
          (selectionChanged)="onSelectionChanged($event)"
          (cellValueChanged)="onCellValueChanged($event)"
          (gridReady)="onGridReady($event)" 
          rowSelection="single"
          [localeText]="AG_GRID_LOCALE_ES">
        </ag-grid-angular>
      </div>
    </div>
  </div>
</div>

<div class="row mt-2 px-3" *ngIf="idConvention != null">
  <div class="col-12">

    <!-- Tab bar con botón cerrar -->
    <div class="d-flex align-items-center gap-2 mb-0">
      <button class="btn btn-sm btn-outline-secondary" (click)="resetGridSize()" title="Cerrar panel">
        <i class="bi bi-x-lg"></i>
      </button>
      <ul class="nav nav-tabs flex-fill mb-0" role="tablist">
        <li class="nav-item">
          <button class="nav-link" [class.active]="showDetailsTab && !showWorkProgramTab"
                  (click)="showDetailsTab = true; showWorkProgramTab = false">
            <i class="bi bi-list-ul me-1"></i> Detalle
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-link" [class.active]="showWorkProgramTab"
                  (click)="switchToWorkProgramTab()">
            <i class="bi bi-diagram-3 me-1"></i> Work Program
          </button>
        </li>
      </ul>
    </div>

    <!-- Detalle -->
    <app-convention-details *ngIf="showDetailsTab && !showWorkProgramTab"></app-convention-details>

    <!-- Work Program -->
    <div *ngIf="showWorkProgramTab">

      <!-- Cabecera: convenio + copiar -->
      <div class="card mt-0 mb-2" style="border-top-left-radius:0; border-top-right-radius:0;">
        <div class="card-body py-2">
          <div class="d-flex flex-wrap align-items-center gap-3">
            <span class="badge bg-success px-3 py-2">
              <i class="bi bi-bookmark-check-fill me-1"></i>{{ selectedRowData?.name }}
            </span>
            <div class="vr d-none d-md-block"></div>
            <div class="d-flex align-items-center gap-2">
              <label class="text-muted small mb-0">Copiar hacia:</label>
              <select class="form-select form-select-sm" style="min-width:200px;"
                      [(ngModel)]="targetConventionId" [disabled]="isCopying">
                <option [ngValue]="null">— Selecciona convenio destino —</option>
                <option *ngFor="let c of rowData" [value]="c.id" [disabled]="c.id === idConvention">
                  {{ c.name }}{{ c.id === idConvention ? ' (actual)' : '' }}
                </option>
              </select>
              <button class="btn btn-sm btn-warning" (click)="copyWorkProgram()"
                      [disabled]="!targetConventionId || isCopying">
                <i class="bi bi-copy me-1"></i>{{ isCopying ? 'Copiando...' : 'Copiar Work Program' }}
              </button>
            </div>
            <div class="vr d-none d-md-block"></div>
            <button class="btn btn-sm btn-outline-primary" (click)="loadWorkProgramForConvention()" [disabled]="isLoadingWP">
              <i class="bi bi-arrow-clockwise me-1"></i>{{ isLoadingWP ? 'Cargando...' : 'Recargar' }}
            </button>
          </div>
        </div>
      </div>

      <!-- Grid Work Program -->
      <div *ngIf="workprogramRows.length > 0" class="card">
        <div class="card-header py-1 d-flex justify-content-between align-items-center">
          <span class="small fw-semibold">
            <i class="bi bi-table me-1"></i>
            Work Program {{ selectedRowData?.name }}
            <span *ngIf="projectName()" class="text-primary ms-1">— {{ projectName() }}</span>
            <span class="badge bg-primary ms-2">{{ workprogramRows.length }} tareas</span>
          </span>
        </div>
        <div class="card-body p-0">
          <ag-grid-angular
            class="ag-theme-quartz small-text-ag-grid"
            style="height: 420px; width: 100%;"
            [rowData]="workprogramRows"
            [columnDefs]="wpColDefs"
            [defaultColDef]="wpDefaultColDef"
            [gridOptions]="wpGridOptions"
            [treeData]="true"
            [getDataPath]="wpGetDataPath"
            [autoGroupColumnDef]="wpAutoGroupColDef"
            [localeText]="AG_GRID_LOCALE_ES">
          </ag-grid-angular>
        </div>
      </div>

      <!-- Placeholder vacío -->
      <div *ngIf="workprogramRows.length === 0 && !isLoadingWP" class="text-center text-muted py-5">
        <i class="bi bi-diagram-3 fs-1 d-block mb-2 opacity-25"></i>
        Sin tareas en este convenio. Presiona <strong>Recargar</strong> o
        <strong>Copiar Work Program</strong> para importar desde otro convenio.
      </div>

    </div>
  </div>
</div>
