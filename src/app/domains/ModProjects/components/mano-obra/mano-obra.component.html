<div class="row p-3">
  <div class="col-12">

    <div class="d-flex align-items-center gap-2 mb-3">
      <h5 class="mb-0 me-3"><i class="bi bi-person-badge me-2"></i>Catálogo de Mano de Obra</h5>

      <button class="btn btn-sm btn-success" (click)="addRow()">
        <i class="bi bi-plus-lg"></i> Agregar
      </button>

      <button class="btn btn-sm btn-primary position-relative" (click)="saveChanges()" [disabled]="!hasChanges">
        <i class="bi bi-floppy"></i> Guardar
        <span *ngIf="hasChanges"
              class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle">
        </span>
      </button>

      <button class="btn btn-sm btn-warning" (click)="revertChanges()">
        <i class="bi bi-arrow-clockwise"></i> Deshacer
      </button>

      <button class="btn btn-sm btn-danger" (click)="deleteSelected()" [disabled]="!selectedRow">
        <i class="bi bi-trash"></i> Borrar
      </button>

      <button class="btn btn-sm btn-secondary" (click)="showPdfReport = true"
              title="Reporte PDF de Distribución (Cantidades)">
        <i class="bi bi-file-earmark-pdf"></i> PDF Dist.
      </button>

      <button class="btn btn-sm btn-success" (click)="showPdfMoneyReport = true"
              title="Reporte PDF Erogaciones ($)">
        <i class="bi bi-currency-dollar"></i> PDF $
      </button>
    </div>

    <ag-grid-angular
      class="ag-theme-quartz small-text-ag-grid"
      style="height: 75vh; width: 100%;"
      [rowData]="rowData"
      [columnDefs]="colDefs"
      [defaultColDef]="defaultColDef"
      [rowClassRules]="rowClassRules"
      [gridOptions]="gridOptions"
      rowSelection="single"
      [stopEditingWhenCellsLoseFocus]="true"
      (gridReady)="onGridReady($event)"
      (cellValueChanged)="onCellValueChanged($event)"
      (selectionChanged)="onSelectionChanged()"
      (cellEditingStopped)="onCellEditingStopped($event)">
    </ag-grid-angular>

    <!-- PDF Cantidades -->
    <app-pdf-mano-obra
      *ngIf="showPdfReport"
      [idCompany]="idCompany"
      mode="newTab"
      reportType="quantity"
      (closed)="showPdfReport = false">
    </app-pdf-mano-obra>

    <!-- PDF Erogaciones ($) -->
    <app-pdf-mano-obra
      *ngIf="showPdfMoneyReport"
      [idCompany]="idCompany"
      mode="newTab"
      reportType="money"
      (closed)="showPdfMoneyReport = false">
    </app-pdf-mano-obra>

  </div>
</div>
