<div class="row p-3">
  <div class="col-12">
    <!-- Botones y grid principal -->
    <div class="row mt-3">
      <!-- Columna de botones -->
      <div class="col-auto">
        <div class="d-flex flex-column gap-1">
          <button
            type="button"
            class="btn btn-success ms-1 me-1"
            (click)="addRow()"
            title="Agregar nuevo contrato"
          >
            <i class="bi bi-plus-lg"></i>
          </button>
          <button
            type="button"
            class="btn btn-warning ms-1 me-1"
            (click)="revertChanges()"
            title="Deshacer cambios"
          >
            <i class="bi bi-arrow-clockwise"></i>
          </button>
          <button
            type="button"
            class="btn btn-primary position-relative ms-1 me-1"
            (click)="saveChanges()"
            title="Guardar cambios"
          >
            <i class="bi bi-floppy"></i>
            <span class="position-absolute top-0 end-0 translate-middle p-2 bg-danger border border-light rounded-circle"
              *ngIf="notSavedChanges">
              <span class="visually-hidden">Hay cambios sin guardar</span>
            </span>
          </button>
          <button
            type="button"
            class="btn btn-danger ms-1 me-1"
            (click)="deleteContract()"
            title="Eliminar contrato"
          >
            <i class="bi bi-trash"></i>
          </button>
          <button
            type="button"
            class="btn btn-secondary ms-1 me-1"
            (click)="autoSizeAllColumns()"
            title="Autoajustar columnas"
          >
            <i class="bi bi-arrows-expand"></i>
          </button>
        </div>
      </div>
      <div class="col">
        <ag-grid-angular
          style="width: 100%"
          [ngStyle]="{ height: gridHeight }"
          class="ag-theme-quartz small-text-ag-grid"
          [columnDefs]="colMaster"
          [defaultColDef]="defaultColDef"
          [rowData]="contract"
          (selectionChanged)="onSelectionChanged($event)"
          (cellValueChanged)="onCellValueChanged($event)"
          [pagination]="true"
          (gridReady)="onGridReady($event)"
          [gridOptions]="gridOptions"
          [stopEditingWhenCellsLoseFocus]="true"
          [localeText]="AG_GRID_LOCALE_ES"
          [rowSelection]="rowSelection"
          [components]="components"
        >
        </ag-grid-angular>
      </div>
    </div>
  </div>
</div>

<div class="row" *ngIf="idContract != null">
  <div class="col-12">
    <ul class="nav nav-tabs" id="myTab" role="tablist"></ul>
    <div class="card shadow-sm mb-3">
      <div class="card-header d-flex align-items-center justify-content-between">
        <div>
          <strong>Sucursales ejecutoras</strong>
          <small class="text-muted ms-2">La sucursal del contrato se conserva como administrativa.</small>
        </div>
        <div class="d-flex gap-2">
          <select class="form-select form-select-sm" style="min-width: 250px" [(ngModel)]="selectedExecutingBranchId">
            <option [ngValue]="null">Seleccione sucursal</option>
            <option *ngFor="let branch of executingBranchOptions" [ngValue]="branch.id">{{ branch.name }}</option>
          </select>
          <button class="btn btn-sm btn-success" (click)="addExecutingBranch()" [disabled]="!selectedExecutingBranchId">
            <i class="bi bi-plus-lg"></i> Agregar
          </button>
        </div>
      </div>
      <div class="card-body py-2">
        <div class="text-muted small" *ngIf="!executingBranches.length">Aún no hay sucursales ejecutoras asignadas.</div>
        <div class="d-flex flex-wrap gap-2" *ngIf="executingBranches.length">
          <span class="badge text-bg-primary d-flex align-items-center gap-2 p-2" *ngFor="let branch of executingBranches">
            {{ branch.name }}
            <button type="button" class="btn-close btn-close-white" aria-label="Quitar" (click)="removeExecutingBranch(branch)"></button>
          </span>
        </div>
      </div>
    </div>
    <app-contract-details></app-contract-details>
  </div>
</div>
