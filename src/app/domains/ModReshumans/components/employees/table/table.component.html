<app-multi-line-editor></app-multi-line-editor>
<div class="col-12">
  <!-- Botones y grid principal -->
  <div class="row mt-3">
    <!-- Columna de botones -->
    <div class="col-auto">
      <div class="d-flex flex-column gap-1">
        <button
          type="button"
          class="btn btn-primary ms-1 me-1"
          (click)="addMasterRow()"
          *ngIf="authService.getCrudPermissionDetail('hr', 'employees','Emp_prin', 'create')"
        >
          <i class="bi bi-plus-lg"></i>
        </button>
        <button
          type="button"
          class="btn btn-success ms-1 me-1 position-relative"
          (click)="saveMasterChanges()"
          *ngIf="authService.getCrudPermissionDetail('hr', 'employees','Emp_prin',  'create') || authService.getCrudPermissionDetail('hr', 'employees','Emp_prin',  'update')"
        >
          <i class="bi bi-floppy"></i>
          <span
            class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
            *ngIf="notSavedChanges"
          >
            <span class="visually-hidden">Hay cambios sin guardar</span>
          </span>
        </button>
        <button
          type="button"
          class="btn btn-warning ms-1 me-1"
          (click)="revertMasterData()"
        >
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button
          type="button"
          class="btn btn-danger ms-1 me-1"
          (click)="deleteMasterEntry()"
          *ngIf="authService.getCrudPermissionDetail('hr', 'employees','Emp_prin', 'delete')"
        >
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
    <div class="col">
      <ag-grid-angular
        style="width: 100%"
        [ngStyle]="{ height: gridHeight }"
        class="ag-theme-quartz small-text-ag-grid"
        [rowData]="rowData"
        [columnDefs]="colMaster"
        (selectionChanged)="onMasterSelectionChanged($event)"
        [gridOptions]="gridOptions"
        (cellValueChanged)="onMasterCellValueChanged($event)"
        (rowSelected)="onMasterRowSelected($event)"
        (gridReady)="onMasterGridReady($event)"
        [pagination]="false"
        (cellDoubleClicked)="onCellDoubleClicked($event)"
        [components]="components"
        (cellClicked)="onCellClicked($event)"
        [stopEditingWhenCellsLoseFocus]="true"
        [localeText]="AG_GRID_LOCALE_ES"
      >
      </ag-grid-angular>
    </div>
  </div>
</div>

<div class="modal fade" [class.show]="showCatalogModal" [style.display]="showCatalogModal ? 'block' : 'none'" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">
          <i class="bi me-2" [ngClass]="catalogModalType === 'department' ? 'bi-diagram-3' : 'bi-person-badge'"></i>
          Agregar {{ catalogModalType === 'department' ? 'departamento' : 'posición' }}
        </h5>
        <button type="button" class="btn-close btn-close-white" (click)="closeCatalogModal()" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <label class="form-label">Nombre <span class="text-danger">*</span></label>
        <input type="text" class="form-control mb-3" [(ngModel)]="newCatalogDescription" name="newCatalogDescription" maxlength="150" autofocus>
        <ng-container *ngIf="catalogModalType === 'position'">
          <label class="form-label">Departamento <span class="text-danger">*</span></label>
          <select class="form-select" [(ngModel)]="newPositionDepartmentId" name="newPositionDepartmentId">
            <option [ngValue]="null">Selecciona un departamento</option>
            <option *ngFor="let dept of catalogRoles" [ngValue]="dept.id">{{ dept.description }}</option>
          </select>
          <div class="form-text">La posición quedará ligada al departamento seleccionado.</div>
        </ng-container>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeCatalogModal()">Cancelar</button>
        <button type="button" class="btn btn-primary" (click)="saveCatalogEntry()" [disabled]="savingCatalog">
          <span *ngIf="savingCatalog" class="spinner-border spinner-border-sm me-1"></span>Guardar
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade" [class.show]="showCatalogModal" [style.display]="showCatalogModal ? 'block' : 'none'"></div>

<div class="row" *ngIf="idEmployee != null">
  <div class="col-12">
    <ul class="nav nav-tabs" id="myTab" role="tablist"></ul>

    <div class="tab-content" id="myTabContent">
      <div
        class="tab-pane fade show active"
        id="loans"
        role="tabpanel"
        aria-labelledby="loans-tab"
        *ngIf="showLoansTab"
      >
        <app-employeesxloans></app-employeesxloans>
      </div>

      <div
        class="tab-pane fade show active"
        id="loans"
        role="tabpanel"
        aria-labelledby="loans-tab"
        *ngIf="showSavingsTab"
      >
        <app-employeesxsavings></app-employeesxsavings>
      </div>
    </div>
  </div>
</div>
