<app-multi-line-editor></app-multi-line-editor>
<div class="col-12">
  <!-- Botones y grid principal -->
  <div class="row mt-3">
    <!-- Columna de botones -->
    <div class="col-auto">
      <div class="d-flex flex-column gap-1">
        <button type="button" class="btn btn-primary ms-1 me-1" (click)="addMasterRow()">
          <i class="bi bi-plus-lg"></i>
        </button>
        <button type="button" class="btn btn-success ms-1 me-1 position-relative" (click)="saveMasterChanges()">
          <i class="bi bi-floppy"></i>
          <span
            class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
            *ngIf="notSavedChanges">
            <span class="visually-hidden">Hay cambios sin guardar</span>
          </span>
        </button>
        <button type="button" class="btn btn-warning ms-1 me-1" (click)="revertMasterData()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button type="button" class="btn btn-danger ms-1 me-1" (click)="deleteMasterEntry()">
          <i class="bi bi-trash"></i>
        </button>
        <button type="button" class="btn btn-secondary ms-1 me-1" (click)="resetGridSize()">
          <i class="bi bi-arrows-fullscreen"></i>
        </button>
        
      </div>
    </div>
    <div class="col">
      <ag-grid-angular
        style="width: 100%;"
        [ngStyle]="{'height': gridHeight}"
        class="ag-theme-quartz small-text-ag-grid"
        [rowData]="rowData"
        [columnDefs]="colMaster"
        (selectionChanged)="onMasterSelectionChanged($event)"
        [gridOptions]="gridOptions"
        (cellValueChanged)="onMasterCellValueChanged($event)"
        (rowSelected)="onMasterRowSelected($event)"
        (gridReady)="onMasterGridReady($event)"
        [pagination]="false"
        (cellDoubleClicked)="onCellDoubleClicked($event)"
        [components]="components">
      </ag-grid-angular>
    </div>
  </div>
</div>

<div class="row" *ngIf="idEmployee != null">
  <div class="col-12">
    <ul class="nav nav-tabs" id="myTab" role="tablist">
     
    </ul>

    <div class="tab-content" id="myTabContent">
      <div class="tab-pane fade show active" id="loans" role="tabpanel" aria-labelledby="loans-tab" *ngIf="showLoansTab">
        <app-employeesxloans></app-employeesxloans>
      </div>
   
      <div class="tab-content" id="myTabContent">
        <div class="tab-pane fade show active" id="loans" role="tabpanel" aria-labelledby="loans-tab" *ngIf="showSavingsTab">
          <app-employeesxsavings></app-employeesxsavings>
        </div>
     
    </div>
  </div>
</div>
