<app-multi-line-editor></app-multi-line-editor>
<div class="col-12">
  <!-- Botones y grid principal -->
  <div class="row mt-3">
    <!-- Columna de botones -->
    <div class="col-auto">
      <div class="d-flex flex-column gap-2">
        <button type="button" class="btn btn-primary ms-1 me-1" (click)="addRow()">
          <i class="bi bi-plus-lg"></i>
        </button>
        <button type="button" class="btn btn-success ms-1 me-1 position-relative" (click)="saveChanges()">
          <i class="bi bi-floppy"></i>
          <span
            class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
            *ngIf="notSavedChanges">
            <span class="visually-hidden">Hay cambios sin guardar</span>
          </span>
        </button>
        <button type="button" class="btn btn-warning ms-1 me-1" (click)="revert()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>
    </div>

    <div class="col">
      <ag-grid-angular style="width: 100%; height: 40vh;" class="ag-theme-quartz small-text-ag-grid" [rowData]="rowData"
        [columnDefs]="colMaster" (selectionChanged)="onSelectionChanged($event)"
        (cellValueChanged)="onCellValueChanged($event)" (rowSelected)="onSelectedRow($event)"
        (gridReady)="onGridReady($event)" [rowSelection]="rowSelection" [pivotPanelShow]="pivotPanelShow"
        [rowGroupPanelShow]="rowGroupPanelShow" [paginationPageSize]="15"
        [pagination]="true" [components]="components" [gridOptions]="gridOptions">
      </ag-grid-angular>
    </div>
  </div>
</div>
