<div class="col-12">
  <div class="shadow-sm" id="cartPrin">
    <div class="card-header d-flex align-items-center">
      <h3 class="card-title mb-0">Prestamos</h3>
      <div class="d-flex gap-1 ms-auto">
        <button type="button" class="btn btn-sm btn-primary" (click)="addRow()" *ngIf="authService.getCrudPermissionDetail('hr', 'employees','Emp_Pre', 'create')">
          <i class="bi bi-plus-lg"></i>
        </button>
        <button type="button" class="btn btn-sm btn-success position-relative" (click)="saveMasterChanges()" *ngIf="authService.getCrudPermissionDetail('hr', 'employees','Emp_Pre', 'create') || authService.getCrudPermissionDetail('hr', 'employees','Emp_Pre', 'update')">
          <i class="bi bi-floppy"></i>
          <span class="position-absolute top-0 end-0 translate-middle p-2 bg-danger border border-light rounded-circle" *ngIf="masterNotSavedChanges">
            <span class="visually-hidden">Hay cambios sin guardar</span>
          </span>
        </button>
        <button type="button" class="btn btn-sm btn-warning" (click)="revertMasterData()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button type="button" class="btn btn-sm btn-danger" (click)="deleteMasterEntry()" *ngIf="authService.getCrudPermissionDetail('hr', 'employees','Emp_Pre', 'delete')">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>
    <ag-grid-angular class="ag-theme-quartz small-text-ag-grid" style="width: 100%; height: 55vh;"
      [rowData]="maestroRowData" [columnDefs]="maestroColumnDefs" [gridOptions]="maestroGridOptions"
      [components]="components"
      (cellValueChanged)="onMasterCellValueChanged($event)" (gridReady)="onMaestroGridReady($event)"
      [rowSelection]="'single'" [stopEditingWhenCellsLoseFocus]="true">
    </ag-grid-angular>
  </div>
</div>
