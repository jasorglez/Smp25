<div class="clock-wrap">

  <!-- Selector de empleado (solo en modo standalone) -->
  <div class="clock-selector" *ngIf="externalIdEmployee() == null">
    <label for="employees">Seleccione empleado</label>
    <ng-select
      style="flex:1; font-size:11px"
      [(ngModel)]="idEmployee"
      bindLabel="name"
      bindValue="id"
      [items]="employees"
      (ngModelChange)="onEmployeeChange()"
      id="employees"
      placeholder="Seleccione un empleado"
      [clearable]="false"
    ></ng-select>
  </div>

  <form #scheduleForm="ngForm" (ngSubmit)="guardarHorario()">
    <table class="clock-table">
      <thead>
        <tr>
          <th>Día</th>
          <th>Entrada 1</th>
          <th>Salida 1</th>
          <th>Entrada 2</th>
          <th>Salida 2</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let dia of horario; let i = index">

          <td>
            <div class="day-cell">
              <input
                type="checkbox"
                [(ngModel)]="dia.enabled"
                [name]="'active_' + dia.id"
                [id]="'active_' + dia.id"
                [disabled]="!idEmployee"
                *ngIf="authService.getCrudPermissionDetail('hr', 'employees','Hor_prin', 'create')"
              />
              <label [for]="'active_' + dia.id">{{ dia.day }}</label>
            </div>
          </td>

          <td>
            <ngb-timepicker [(ngModel)]="dia.entry1" [name]="'entry1_' + dia.id"
              [disabled]="!dia.enabled" [required]="dia.enabled"
              [meridian]="true" [seconds]="false" [minuteStep]="1" size="small">
            </ngb-timepicker>
            <div *ngIf="dia.enabled && !dia.entry1?.hour" class="field-error">Requerido</div>
          </td>

          <td>
            <ngb-timepicker [(ngModel)]="dia.exit1" [name]="'exit1_' + dia.id"
              [disabled]="!dia.enabled" [required]="dia.enabled"
              [meridian]="true" [seconds]="false" [minuteStep]="1" size="small">
            </ngb-timepicker>
            <div *ngIf="dia.enabled && !dia.exit1?.hour" class="field-error">Requerido</div>
          </td>

          <td>
            <ngb-timepicker [(ngModel)]="dia.entry2" [name]="'entry2_' + dia.id"
              [disabled]="!dia.enabled"
              [meridian]="true" [seconds]="false" [minuteStep]="1" size="small">
            </ngb-timepicker>
          </td>

          <td>
            <ngb-timepicker [(ngModel)]="dia.exit2" [name]="'exit2_' + dia.id"
              [disabled]="!dia.enabled"
              [meridian]="true" [seconds]="false" [minuteStep]="1" size="small">
            </ngb-timepicker>
          </td>

          <td>
            <div class="action-cell">
              <button type="button" class="btn-cell danger"
                (click)="resetDay(i)" title="Borrar día" [disabled]="!idEmployee"
                *ngIf="authService.getCrudPermissionDetail('hr', 'employees','Hor_prin', 'delete')">
                <i class="bi bi-eraser-fill"></i>
              </button>
              <button type="button" class="btn-cell success"
                (click)="applyToAllDays(i)" title="Aplicar a todos" [disabled]="!idEmployee"
                *ngIf="authService.getCrudPermissionDetail('hr', 'employees','Hor_prin', 'create') || authService.getCrudPermissionDetail('hr', 'employees','Hor_prin', 'update')">
                <i class="bi bi-copy"></i>
              </button>
            </div>
          </td>

        </tr>
      </tbody>
    </table>

    <div class="clock-footer">
      <span>Total: <strong>{{ calcularTotalHoras() }}</strong></span>
      <button type="submit" class="btn-save" [disabled]="!idEmployee"
        *ngIf="authService.getCrudPermissionDetail('hr', 'employees','Hor_prin', 'create') || authService.getCrudPermissionDetail('hr', 'employees','Hor_prin', 'update') || authService.getCrudPermissionDetail('hr', 'employees','Hor_prin', 'delete')">
        Guardar horario
      </button>
    </div>
  </form>

</div>
