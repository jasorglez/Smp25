<div class="container mt-4">
  <label for="employees" class="form-label">Seleccione empleado</label>
  <ng-select
    class="form-select"
    [(ngModel)]="idEmployee"
    bindLabel="name"
    bindValue="id"
    [items]="employees"
    (ngModelChange)="onEmployeeChange()"
    id="employees"
    placeholder="Seleccione un empleado"
    [clearable]="false"
  ></ng-select>
  <form #scheduleForm="ngForm" (ngSubmit)="guardarHorario()">
    <table class="table table-bordered">
      <thead class="thead-dark">
        <tr>
          <th>Día</th>
          <th>Entrada 1</th>
          <th>Salida 1</th>
          <th>Entrada 2</th>
          <th>Salida 2</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let dia of horario; let i = index">
          <td class="align-middle">
            <div class="form-check">
              <input
                type="checkbox"
                [(ngModel)]="dia.enabled"
                [name]="'active_' + dia.id"
                class="form-check-input"
                [id]="'active_' + dia.id"
                [disabled]="!idEmployee"
              />
              <label for="active_{{ dia.id }}" class="form-check-label">{{
                dia.day
              }}</label>
            </div>
          </td>
          <td class="align-middle">
            <ngb-timepicker
              [(ngModel)]="dia.entry1"
              [name]="'entry1_' + dia.id"
              [disabled]="!dia.enabled"
              [required]="dia.enabled"
              [meridian]="true"
              [seconds]="false"
              [minuteStep]="1"
              size="small"
            ></ngb-timepicker>
          </td>
          <td class="align-middle">
            <ngb-timepicker
              [(ngModel)]="dia.exit1"
              [name]="'exit1_' + dia.id"
              [disabled]="!dia.enabled"
              [required]="dia.enabled"
              [meridian]="true"
              [seconds]="false"
              [minuteStep]="1"
              size="small"
            ></ngb-timepicker>
          </td>
          <td class="align-middle">
            <ngb-timepicker
              [(ngModel)]="dia.entry2"
              [name]="'entry2_' + dia.id"
              [disabled]="!dia.enabled"
              [required]="dia.enabled"
              [meridian]="true"
              [seconds]="false"
              [minuteStep]="1"
              size="small"
            ></ngb-timepicker>
          </td>
          <td class="align-middle">
            <ngb-timepicker
              [(ngModel)]="dia.exit2"
              [name]="'exit2_' + dia.id"
              [disabled]="!dia.enabled"
              [required]="dia.enabled"
              [meridian]="true"
              [seconds]="false"
              [minuteStep]="1"
              size="small"
            ></ngb-timepicker>
          </td>
          <td class="align-middle">
            <div
              class="container-fluid"
            >
              <div class="row">
                <button
                  type="button"
                  class="btn btn-sm btn-danger mb-1"
                  (click)="resetDay(i)"
                  title="Borrar horarios del día"
                  [disabled]="!idEmployee"
                >
                <i class="bi bi-eraser-fill"></i>
                </button>
              </div>
              <div class="row">
                <button
                  type="button"
                  class="btn btn-sm btn-success mt-1"
                  (click)="applyToAllDays(i)"
                  title="Aplicar a todos los días"
                  [disabled]="!idEmployee"
                >
                  <i class="fas fa-clone"></i>
                </button>
              </div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="text-end">
      <button type="submit" class="btn btn-primary" [disabled]="!idEmployee">Guardar Horario</button>
    </div>
  </form>
</div>
