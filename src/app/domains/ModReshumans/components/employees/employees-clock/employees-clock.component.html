<div class="container mt-4">
  <form #scheduleForm="ngForm" (ngSubmit)="guardarHorario()">
    <table class="table table-bordered">
      <thead class="thead-dark">
        <tr>
          <th>Día</th>
          <th>Entrada 1</th>
          <th>Salida 1</th>
          <th>Entrada 2</th>
          <th>Salida 2</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let dia of horario; let i = index">
          <td>
            <div class="form-check">
              <input
                type="checkbox"
                [(ngModel)]="dia.enabled"
                [name]="'active_' + dia.id"
                class="form-check-input"
                [id]="'active_' + dia.id"
              />
              <label for="active_{{ dia.id }}" class="form-check-label">{{
                dia.day
              }}</label>
            </div>
          </td>
          <td>
            <input
              type="time"
              [(ngModel)]="dia.entry1"
              [name]="'entry1_' + dia.id"
              [disabled]="!dia.enabled"
              class="form-control"
              step="3600"
              [required]="dia.enabled"
            />
          </td>
          <td>
            <input
              type="time"
              [(ngModel)]="dia.exit1"
              [name]="'exit1_' + dia.id"
              [disabled]="!dia.enabled"
              class="form-control"
              step="3600"
              [required]="dia.enabled"
            />
          </td>
          <td>
            <input
              type="time"
              [(ngModel)]="dia.entry2"
              [name]="'entry2_' + dia.id"
              [disabled]="!dia.enabled"
              class="form-control"
              step="3600"
              [required]="dia.enabled"
            />
          </td>
          <td>
            <input
              type="time"
              [(ngModel)]="dia.exit2"
              [name]="'exit2_' + dia.id"
              [disabled]="!dia.enabled"
              class="form-control"
              step="3600"
              [required]="dia.enabled"
            />
          </td>
          <td>
            <button
              type="button"
              class="btn btn-sm btn-warning"
              (click)="resetDay(i)"
            >
              Reiniciar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="text-end">
      <button type="submit" class="btn btn-primary">Guardar Horario</button>
    </div>
  </form>
</div>
