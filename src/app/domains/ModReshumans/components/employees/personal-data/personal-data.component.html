<div class="col-12">
  <div class="shadow-sm" id="cartPrin">
    <div class="card-header d-flex align-items-center">
      <h3 class="card-title mb-0">
        <i class="bi bi-person-lines-fill me-2"></i>Datos Personales
      </h3>
      <div class="d-flex gap-1 ms-auto">
        <button type="button" class="btn btn-sm btn-primary position-relative" (click)="save()" [disabled]="saving || !hasUnsavedChanges">
          <i class="bi bi-floppy"></i>
          <span class="position-absolute top-0 end-0 translate-middle p-2 bg-danger border border-light rounded-circle" *ngIf="hasUnsavedChanges">
            <span class="visually-hidden">Hay cambios sin guardar</span>
          </span>
        </button>
        <button type="button" class="btn btn-sm btn-warning" (click)="revert()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>
    </div>
    <ag-grid-angular
      class="ag-theme-quartz small-text-ag-grid"
      style="width: 100%; height: 800px;"
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [gridOptions]="gridOptions"
      [components]="components"
      [stopEditingWhenCellsLoseFocus]="true"
      [rowSelection]="'single'"
      (gridReady)="onGridReady($event)"
      (cellValueChanged)="onCellValueChanged()">
    </ag-grid-angular>
  </div>
</div>
