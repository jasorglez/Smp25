<app-multi-line-editor></app-multi-line-editor>
<div class="col-12">
  <!-- Botones y grid principal -->
  <div class="row mt-3">
    <!-- Columna de botones -->
    <div class="col-auto">
      <div class="d-flex flex-column gap-2">
        <button type="button" class="btn btn-primary ms-1 me-1" (click)="addMasterRow()">
          <i class="bi bi-plus-lg"></i>
        </button>
        <button type="button" class="btn btn-success ms-1 me-1 position-relative" (click)="saveMasterChanges()">
          <i class="bi bi-floppy"></i>
          <span
            class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
            *ngIf="notSavedChanges">
            <span class="visually-hidden">Hay cambios sin guardar</span>
          </span>
        </button>
        <button type="button" class="btn btn-warning ms-1 me-1" (click)="revertMasterData()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button type="button" class="btn btn-danger ms-1 me-1" (click)="deleteMasterEntry()">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    </div>

    <div class="col">
      <ag-grid-angular style="width: 100%; height: 40vh;" class="ag-theme-quartz small-text-ag-grid" [rowData]="rowData"
        [columnDefs]="colMaster" (selectionChanged)="onMasterSelectionChanged($event)"
        (cellValueChanged)="onMasterCellValueChanged($event)" (rowSelected)="onMasterRowSelected($event)"
        (gridReady)="onMasterGridReady($event)" [rowSelection]="rowSelection" [pivotPanelShow]="pivotPanelShow"
        [rowGroupPanelShow]="rowGroupPanelShow" [paginationPageSize]="15"
        [pagination]="true" [components]="components">
      </ag-grid-angular>
    </div>
  </div>
</div>

<div class="row" *ngIf="idEmployee != null">
  <div class="col-12">
    <ul class="nav nav-tabs" id="myTab" role="tablist">
      <li class="nav-item" role="presentation">
        <a class="nav-link active" id="loans-tab" data-bs-toggle="tab" href="#loans" type="button" role="tab"
           aria-controls="loans" aria-selected="true">Préstamos</a>
      </li>
      <li class="nav-item" role="presentation">
        <a class="nav-link" id="savings-tab" data-bs-toggle="tab" href="#savings" role="tab" 
        aria-controls="savings" aria-selected="false">Ahorros</a>
      </li>
    </ul>
    <div class="tab-content" id="myTabContent">
      <div class="tab-pane fade show active" id="loans" role="tabpanel" aria-labelledby="loans-tab">
        <app-employeesxloans></app-employeesxloans>
      </div>
      <div class="tab-pane fade" id="savings" role="tabpanel" aria-labelledby="savings-tab">
        <p>Content for Tab 2.</p>
      </div>
    </div>
  </div>
</div>
