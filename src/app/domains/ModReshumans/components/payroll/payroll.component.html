<div class="container">
  <h2>Nóminas de Empleados</h2>

  <div class="col-12">
    <div class="row">
        <div class="col-auto">
            <div class="d-flex flex-column gap-1 me-3">
                <button type="button" class="btn btn-primary" (click)="addRow()">
          <i class="bi bi-plus-lg"></i>
        </button>
                <button type="button" class="btn btn-success position-relative" (click)="saveChanges()">
          <i class="bi bi-floppy"></i>
          <span class="position-absolute top-0 end-0 translate-middle p-2 bg-danger border border-light rounded-circle"></span>
          <!--  *ngIf="notSavedChanges" -->
            <span class="visually-hidden">Hay cambios sin guardar</span>
        </button>
                <button type="button" class="btn btn-warning">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
                <button type="button" class="btn btn-danger" >
          <i class="bi bi-trash"></i>
        </button>
            </div>
        </div>

        <div class="col">
            <ag-grid-angular style="width: 100%; height: 500px;" class="ag-theme-quartz small-text-ag-grid" [rowData]="rowData" [columnDefs]="colMaster" (selectionChanged)="onSelectionChanged($event)" [gridOptions]="gridOptions" (cellValueChanged)="onCellValueChanged($event)"
                (rowSelected)="onSelectedRow($event)" (gridReady)="onGridReady($event)" rowSelection="single" [pivotPanelShow]="pivotPanelShow" [rowSelection]="rowSelection" [rowGroupPanelShow]="rowGroupPanelShow">
            </ag-grid-angular>
        </div>

    </div>

    <div class="container">
        <div class="row">


        </div>
    </div>
</div>

  <div class="mb-3">
    <button class="btn btn-primary me-2" (click)="exportToExcel()">Exportar a Excel</button>
    <button class="btn btn-secondary" (click)="refreshData()">Actualizar datos</button>
  </div>

  <div *ngIf="isLoading" class="d-flex justify-content-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div class="ag-theme-alpine" style="width: 100%; height: 600px;">
    <ag-grid-angular
      [rowData]="rowData"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [pagination]="true"
      [paginationPageSize]="10"
      (gridReady)="onGridReady($event)"
    ></ag-grid-angular>
  </div>
