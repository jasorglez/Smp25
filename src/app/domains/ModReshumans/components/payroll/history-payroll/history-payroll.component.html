<div class="col-12">
  <div class="row">
    <div class="col-auto mt-3">
      <div class="d-flex flex-column gap-2 me-0">
        <button type="button" class="btn btn-warning" (click)="refreshData()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button
          type="button"
          class="btn btn-danger disabled"
          (click)="deleteEntry()"
        >
          <i class="bi bi-trash"></i>
        </button>
        <button
          type="button"
          class="btn btn-secondary"
          (click)="resetGridSize()"
        >
          <i class="bi bi-arrows-fullscreen"></i>
        </button>
      </div>
    </div>

    <div class="col mt-3">
      <ag-grid-angular
        [ngStyle]="{ height: gridHeight() }"
        class="ag-theme-quartz small-text-ag-grid"
        [rowData]="rowData"
        [columnDefs]="colMaster"
        (selectionChanged)="onSelectionChanged($event)"
        [gridOptions]="gridOptions"
        (cellValueChanged)="onCellValueChanged($event)"
        (rowSelected)="onSelectedRow($event)"
        (gridReady)="onGridReady($event)"
        rowSelection="single"
        [pivotPanelShow]="pivotPanelShow"
        [rowSelection]="rowSelection"
        [stopEditingWhenCellsLoseFocus]="true"
      >
      </ag-grid-angular>
    </div>
  </div>

  @if (showPayrollDetailTab()) {
  <div class="row">
    <div class="col-12">
      <div class="tab-content" id="myTabContent">
        <div
          class="tab-pane fade show active"
          id="detailpayroll"
          role="tabpanel"
          aria-labelledby="detailpayroll-tab"
        >
          <app-show-employees-table [rowDataResponse]="employeeData() ?? []" />
        </div>
      </div>
    </div>
  </div>
  }
</div>
