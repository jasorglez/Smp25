  <div class="col-12">
    <div class="row">
      <div class="col-auto mt-3">
        <div class="d-flex flex-column gap-1 me-0">
          <button type="button" class="btn btn-primary" (click)="addRow()" *ngIf="authService.getCrudPermission('hr', 'payroll', 'create')">
            <i class="bi bi-plus-lg"></i>
          </button>
          <button type="button" class="btn btn-success position-relative" (click)="saveChanges()" *ngIf="authService.getCrudPermission('hr', 'payroll', 'create') || authService.getCrudPermission('hr', 'payroll', 'update')">
            <i class="bi bi-floppy"></i>
            <span class="position-absolute top-0 end-0 translate-middle p-2 bg-danger border border-light rounded-circle"
              *ngIf="notSavedChanges">
              <span class="visually-hidden">Hay cambios sin guardar</span>
            </span>
          </button>
          <button type="button" class="btn btn-warning" (click)="refreshData()">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
          <button type="button" class="btn btn-danger" (click)="deleteEntry()" *ngIf="authService.getCrudPermission('hr', 'payroll', 'delete') ">
            <i class="bi bi-trash"></i>
          </button>
          <button type="button" class="btn btn-secondary" (click)="resetGridSize()">
            <i class="bi bi-arrows-fullscreen"></i>
          </button>
        </div>
      </div>

      <div class="col mt-3">
        <ag-grid-angular
          style="width: 100%;"
          [ngStyle]="{'height': gridHeight}"
          class="ag-theme-quartz small-text-ag-grid"

          [rowData]="rowData"
          [columnDefs]="colMaster"
          (selectionChanged)="onSelectionChanged($event)"
          [gridOptions]="gridOptions"
          (gridReady)="onGridReady2($event)"
          (cellValueChanged)="onCellValueChanged($event)"
          (cellDoubleClicked)="onCellDoubleClicked($event)"
          (rowSelected)="onSelectedRow($event)"
          (gridReady)="onGridReady($event)"
          rowSelection="single"
          [pivotPanelShow]="pivotPanelShow"
          [rowSelection]="rowSelection"
          [stopEditingWhenCellsLoseFocus]="true"
          [localeText]="AG_GRID_LOCALE_ES">
        </ag-grid-angular>
      </div>
    </div>

    <div class="row">
      <div class="col-12">
        <div class="tab-content" id="myTabContent">
          <div class="tab-pane fade show active" id="detailpayroll" role="tabpanel" aria-labelledby="detailpayroll-tab" *ngIf="showPayrollDetailTab">
            <app-detailpayroll></app-detailpayroll>
          </div>
        </div>

      </div>



  <div *ngIf="isLoading" class="d-flex justify-content-center">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>
  </div>
  <div class="modal fade" id="payrolls" tabindex="-1" aria-labelledby="ModalBonosLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
      <div class="modal-header p-0 border-0">
        <div class="container-fluid">
          <div class="row">
            <div class="col-12">
              <div class="form-group mb-3">
                <label class="form-label fw-bold">Selecciona una nómina</label>
                <div class="list-group">
                  <label 
                    *ngFor="let payroll of payrolls" 
                    class="list-group-item list-group-item-action d-flex justify-content-between align-items-start"
                    [class.active]="payroll.payrollId === selectedPayrollId"
                  >
                    <input
                      class="form-check-input me-2 mt-1"
                      type="radio"
                      name="payroll"
                      [value]="payroll.payrollId"
                      [(ngModel)]="selectedPayrollId"
                      (change)="onPayrollChange($event)"
                    />
                    <div class="ms-2">
                      <div class="fw-semibold">{{ payroll.period }}</div>
                      <small class="text-muted">
                        {{ payroll.company }}<br>
                        Fecha: {{ payroll.createdAt | date:'dd/MM/yyyy' }} - Hora: {{ payroll.createdAt | date:'HH:mm:ss' }}
                      </small>
                    </div>
                  </label>
                </div>
              </div>
              <div class="d-flex justify-content-center mt-4 py-1">
                <button 
                  type="button" 
                  class="btn btn-success" 
                  data-bs-dismiss="modal" 
                  id="selectPayrollButton"  
                  (click)="selectionPayroll()" 
                  [disabled]="!selectedPayrollId"
                >
                  Seleccionar Nómina
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
