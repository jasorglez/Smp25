<div class = "col mt-3">
  <ag-grid-angular
    style="width: 100%; height: 55vh; margin-left: 10px; margin-top: 10px;"
    class="ag-theme-quartz small-text-ag-grid"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    
    [defaultColDef]="defaultColDef"
    (gridReady)="onGridReady($event)"
    [gridOptions]="gridOptions"
    (cellDoubleClicked)="onCellDoubleClicked($event)"
    [stopEditingWhenCellsLoseFocus]="true"
    [localeText]="AG_GRID_LOCALE_ES">
  </ag-grid-angular>
</div>

<!-- Modal -->
<div class="modal fade" id="savings" tabindex="-1" aria-labelledby="ModalAhorrosLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
      <div class="modal-header p-0 border-0">
        <div class="container-fluid">
          <div class="row">
            <div class="col-12">
              <app-employeesxsavings></app-employeesxsavings>
              <div class="d-flex justify-content-center mt-4 py-1">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
                  <i class="bi bi-x-circle-fill"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
