<div class="col-12 mt-3 light-blue-background">
    <div class="row mt-1">
      <!-- Columna de botones -->
      <div class="col-auto">
        <div class="d-flex flex-column gap-1">
          <button type="button" class="btn btn-primary ms-1 me-1" (click)="addRow()">
            <i class="bi bi-plus-lg"></i>
          </button>
  
          <button type="button" class="btn btn-success ms-1 me-1 position-relative" (click)="saveChanges()">
            <i class="bi bi-floppy"></i>
            <span
            class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
            *ngIf="notSavedChanges">
            <span class="visually-hidden">Hay cambios sin guardar</span>
          </span>
          </button>
  
          <button type="button" class="btn btn-warning ms-1 me-1" (click)="revert()">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
  
          <button type="button" class="btn btn-danger ms-1 me-1" (click)="deleteEntry()">
            <i class="bi bi-trash"></i>
          </button>
                       
        </div>
      </div>
  
      <!-- Columna de la tabla -->
      <div class="col">
        <ag-grid-angular style="width: 100%; height: 750px;"
          [rowData]="rowData"
          [columnDefs]="colMaster" 
          class="ag-theme-quartz small-text-ag-grid"
          
        (selectionChanged)="onMasterSelectionChanged($event)"
        [gridOptions]="gridOptions"
        (cellValueChanged)="onMasterCellValueChanged($event)"
        (rowSelected)="onMasterRowSelected($event)"
        (gridReady)="onMasterGridReady($event)"
        [pagination]="false"
        (cellDoubleClicked)="onCellDoubleClicked($event)"
        [components]="components">
          >
        </ag-grid-angular>
      </div>
    </div>
  </div>
