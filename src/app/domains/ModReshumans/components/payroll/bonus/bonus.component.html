@if (idBranch > 0) {
<div class="mt-2">
    <div class="flex items-center gap-4">
        <form [formGroup]="fechasForm">
          <span class="">Fecha inicial</span>
          <input formControlName="fechaInicio" type="date" class="bg-white rounded border-light p-1 w-auto ml-2" />
          
          <span class=" ml-4">Fecha final</span>
          <input formControlName="fechaFin" type="date" class="bg-white rounded border-light p-1 w-auto ml-2" />
        </form>
    </div>
    <!-- Columna de botones -->
     <div class="col-12">
        <div class="row mt-4">
            <div class="col-auto">
                <div class="d-flex flex-column gap-1">
                    <button type="button" class="btn btn-success ms-1 me-1 position-relative" (click)="saveChanges()">
                      <i class="bi bi-floppy"></i>
                    </button>
                
                    <button type="button" class="btn btn-warning ms-1 me-1" (click)="revert()">
                      <i class="bi bi-arrow-clockwise"></i>
                    </button> 
                </div>    
            </div>
        
            <!-- Columna de la tabla -->
            <div class="col">
                <ag-grid-angular style="width: 100%; height: 750px;"
                  [rowData]="rowData"
                  [columnDefs]="colMaster" 
                  (rowDoubleClicked)="onRowDoubleClicked($event)"
                  class="ag-theme-quartz small-text-ag-grid"
                  >
                </ag-grid-angular>
            </div>
        </div>
        {{bonusCatalogos}}
     </div>
</div>



<div class="modal fade" id="searchModal" tabindex="-1" aria-labelledby="searchModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered ">
      <div class="modal-content">
        <div class="modal-header flex-column align-items-center">
          <form [formGroup]="bonusForm" (ngSubmit)="guardarBonus()">
            <div class="modal-header flex-column align-items-center">
              <h5 class="mb-3 w-100 text-center fs-4">
                <strong>Empleado:</strong> {{ nameEmployee }}
              </h5>
          
              <div class="mb-3 w-100">
                <strong>Bonus actual:</strong> {{ bonoEmployee }}
              </div>
              <div class="mb-3 w-100">
                <strong class="me-2">Fecha de asignación</strong>
                <input formControlName="fechaSelect"  type="date" class="bg-white rounded border-light p-1 w-auto" required/>
              </div>

              
              <div class="mb-2 w-100">
                <label for="miSelect" class="form-label">Motivo del bonus:</label>
                <select id="miSelect" name="miSelect" class="form-select" formControlName="motivo" required>
                    <option value="" disabled>-- Selecciona una opción --</option>
                    <option *ngFor="let bonus of bonusCatalogos" [ngValue]="bonus">
                      {{ bonus.description }}  - Monto: {{ bonus.valueAddition }}
                    </option>
                  </select>
                  
              </div>
              <div class="mb-3 w-100">
                <label for="bonusInput" class="form-label"><strong>Actualizar bonus:</strong></label>
                <input type="number" id="bonusInput" class="form-control" formControlName="nuevoBonus" placeholder="Ingresa el nuevo bonus" />
              </div>
              <div class="w-100 d-flex justify-content-center gap-2 mt-3">
                <button type="submit" class="btn btn-success position-relative" [disabled]="bonusForm.invalid">
                  <i class="bi bi-floppy"></i> Guardar
                </button>
              
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">
                  <i class="bi bi-x-circle"></i> Cerrar
                </button>
              </div>
            </div>
          </form>        
        </div>
      </div>
    </div>
  </div>
} @else {
  <div class="container-fluid mt-4 mb-4">
      <div class="alert alert-warning text-center">
          <i class="fas fa-exclamation-triangle me-2"></i>
          Por favor, seleccione una sucursal para añadir los bonos.
      </div>
  </div>
  }
