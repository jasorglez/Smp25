  <div class="col-12">
    <!-- Botones y grid principal -->
    <div class="row mt-3">
      <!-- Columna de botones -->
      <div class="col-auto">
        <div class="d-flex flex-column gap-2">
          <button type="button" class="btn btn-primary ms-1 me-1"> 
            <i class="bi bi-plus-lg"></i>
          </button>
          <button type="button" class="btn btn-success ms-1 me-1 position-relative"> 
            <i class="bi bi-floppy"></i>
            <span
              class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
              *ngIf="notSavedChanges">
              <span class="visually-hidden">Hay cambios sin guardar</span>
            </span>
          </button>
          <button type="button" class="btn btn-warning ms-1 me-1"> 
            <i class="bi bi-arrow-clockwise"></i>
          </button>
          <button type="button" class="btn btn-danger ms-1 me-1"> 
            <i class="bi bi-trash"></i>
          </button>
          <button type="button" class="btn btn-secondary ms-1 me-1"> 
            <i class="bi bi-arrows-fullscreen"></i>
          </button>
        </div>
      </div>
      <div class="col">

        <ag-grid-angular 
              class="ag-theme-quartz small-text-ag-grid "
              style="width: 100%; height: 85vh;" 
              [rowData]="rowMaster"
              [columnDefs]="colMaster" 
              [rowGroupPanelShow]="'never'"
              (selectionChanged)="onSelectionChanged($event)"
              (cellValueChanged)="onCellValueChanged($event)" 
              (gridReady)="onMasterGridReady($event)"
              [pivotPanelShow]="pivotPanelShow"
              [rowGroupPanelShow]="rowGroupPanelShow"
              [gridOptions]="gridOptions">
            </ag-grid-angular> 

        <!-- Ag-grid Original 
         <ag-grid-angular
          style="width: 100%;"
          [ngStyle]="{'height': gridHeight}"

          (selectionChanged)="onMasterSelectionChanged($event)"
          [gridOptions]="gridOptions"
          (cellValueChanged)="onMasterCellValueChanged($event)"

          (gridReady)="onMasterGridReady($event)"

          [pagination]="false"
          (cellDoubleClicked)="onCellDoubleClicked($event)"

        </ag-grid-angular>
        
        
        -->
        <ag-grid-angular
          style="width: 100%;"
          class="ag-theme-quartz small-text-ag-grid"
          [columnDefs]="colMaster"
          [gridOptions]="gridOptions"
          (gridReady)="onMasterGridReady($event)"
          [paginationPageSize]="20"
          [pagination]="false">
        </ag-grid-angular>
      </div>
    </div>
  </div>
