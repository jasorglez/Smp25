<div class="row p-3">
  <div class="col-12">
    <div class="row mb-3">
      <div class="col text-right"><button type="button" class="btn btn-primary me-1" (click)="addRow()"><i
            class="bi bi-plus-lg" style="font-size: 1.5rem;"></i></button>
        <button type="button" class="btn btn-success ms-1 me-1 position-relative" (click)="saveChanges()">
          <i class="bi bi-floppy" style="font-size: 1.5rem;"></i>
          <span
            class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
            *ngIf="notSavedChanges"><span class="visually-hidden">Hay cambios sin guardar</span>
          </span>
        </button>
        <button type="button" class="btn btn-warning ms-1 me-1" (click)="revert()"><i class="bi bi-arrow-clockwise"
            style="font-size: 1.5rem;"></i></button>
        <button type="button" class="btn btn-danger ms-1 me-1" (click)="deleteEntry()"><i class="bi bi-trash"
            style="font-size: 1.5rem;"></i></button>
      </div>
    </div>
    <div class="row">
      <ag-grid-angular style="width: 100%; height: 500px;" class="ag-theme-quartz" [rowData]="rowData"
        [columnDefs]="columnDefs" (selectionChanged)="onSelectionChanged($event)"
        (cellValueChanged)="onCellValueChanged($event)" (rowSelected)="onSelectedRow($event)"
        (gridReady)="onGridReady($event)" rowSelection="single">
      </ag-grid-angular>
    </div>
  </div>

  <!-- Carrusel de imagenes -->
  <aside class="container" class="mt-3" *ngIf="id != null">
    <div class="row">
      <div class="col text-left">
        <h2>Imágenes</h2>
      </div>
      <div class="col text-right"><button type="button" class="btn btn-primary me-1" (click)="addPhoto()"><i
            class="bi bi-plus-lg"></i></button></div>
    </div>

    <div class="row img-gallery">
      <div class="col-12 col-lg-2 mb-lg-3 text-center" *ngFor="let image of images; let i = index">
        <img [src]="image.src" class="rounded img-thumbnail" [alt]="image.alt"
          (click)="openCarouselModal(carouselModal, i)" (keydown.enter)="openCarouselModal(carouselModal, i)"
          tabindex="0" role="button" [attr.aria-label]="'Ver imagen ' + (i + 1)" />
      </div>
    </div>
  </aside>

  <!-- Documentos -->
  <aside class="container" class="mt-3" *ngIf="id != null">
    <div class="row">
      <div class="col text-left">
        <h2>Documentos</h2>
      </div>
      <div class="col text-right"><button type="button" class="btn btn-primary me-1" (click)="addDocument()"><i
            class="bi bi-plus-lg"></i></button></div>
    </div>
    <div class="row">
      <div class="col-12">
        <div class="container border rounded">
          <div class="row mb-2">
            <div class="col-10">
              <strong>Nombre del documento</strong>
            </div>
            <div class="col-2 text-center">
              <strong>Acciones</strong>
            </div>
          </div>
          <div class="row" *ngFor="let document of documents">
            <div class="col-10 d-flex align-items-center border-top border-right">
              {{attachHandlerService.getBaseFilenameFromUrl(document.docto)}}
            </div>
            <div class="col-1 border-top text-center">
              <a href="{{document.docto}}" class="btn btn-primary" target="_blank"><i
                class="bi bi-file-earmark-pdf"></i></a>
            </div>
            <div class="col-1 border-top text-center">
              <button type="button" class="btn btn-danger" (click)="deleteDocument(document.id)"><i
                class="bi bi-trash"></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <ng-template #carouselModal let-modal>
    <div class="modal-body">
      <div #carousel id="carouselExampleIndicators" class="carousel slide" aria-roledescription="carrusel"
        aria-label="Galería de imágenes">
        <div class="carousel-indicators">
          <button *ngFor="let img of images; let i = index" type="button" data-bs-target="#carouselExampleIndicators"
            [attr.data-bs-slide-to]="i" [class.active]="i === currentIndexCarousel"
            [attr.aria-current]="i === currentIndexCarousel" [attr.aria-label]="'Diapositiva ' + (i + 1)"></button>
        </div>
        <div class="carousel-inner">
          <div *ngFor="let img of images; let i = index" class="carousel-item"
            [class.active]="i === currentIndexCarousel" role="group"
            [attr.aria-roledescription]="'diapositiva ' + (i + 1) + ' de ' + images.length" [attr.aria-label]="img.alt">
            <img [src]="img.src" class="d-block w-100" [alt]="img.alt" />
            <div class="carousel-caption d-none d-md-block">
              <p>{{ img.alt }}</p>
            </div>
            <div class="text-center mt-3">
              <button class="btn btn-danger me-2" (click)="deletePhoto(img.idPhoto, modal)">Borrar</button>
              <button class="btn btn-primary ms-2" (click)="closeCarouselModal(modal)">Cerrar</button>
            </div>
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
          data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
          data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Siguiente</span>
        </button>
      </div>
    </div>
  </ng-template>
</div>
