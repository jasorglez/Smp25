<div class="card">
  <div class="card-body">
    <div class="container-fluid">
      <div class="mb-3">
        <div class="col text-right d-flex justify-content-end align-items-center">
          <button type="button" class="btn btn-primary me-1 d-flex align-items-center justify-content-center" (click)="addRow()">
            <i class="bi bi-plus-lg" style="font-size: 1.5rem"></i>
          </button>
          <button
            type="button"
            class="btn btn-success ms-1 me-1 position-relative d-flex align-items-center justify-content-center"
            (click)="saveChanges()"
          >
            <i class="bi bi-floppy" style="font-size: 1.5rem"></i>
            <span
              class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
              *ngIf="notSavedChanges"
            ><span class="visually-hidden">Hay cambios sin guardar</span>
            </span>
          </button>
          
          <label class="btn btn-primary ms-1 me-1 mb-0 d-flex align-items-center justify-content-center" style="height: 50px; width: 50px;">
            <i class="bi bi-file-earmark-arrow-up" style="font-size: 1.5rem"></i>
            <input
              type="file"
              (change)="importExcel($event)"
              style="display: none;"
            >
          </label>
          
          <button
            type="button"
            class="btn btn-warning ms-1 me-1 d-flex align-items-center justify-content-center"
            (click)="revert()"
          >
            <i class="bi bi-arrow-clockwise" style="font-size: 1.5rem"></i>
          </button>
          <button
            type="button"
            class="btn btn-danger ms-1 me-1 d-flex align-items-center justify-content-center"
            (click)="deleteEntry()"
          >
            <i class="bi bi-trash" style="font-size: 1.5rem"></i>
          </button>
        </div>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="table-container">
            
            <ag-grid-angular
              style="width: 100%; height: 100%;"
              class="ag-theme-alpine"
              [rowData]="rowData"
              [columnDefs]="columnDefs"
              (cellValueChanged)="onCellValueChanged($event)"
            >
            </ag-grid-angular>
          </div>
        </div>
        <div class="col-md-6">
          <div class="chart-container">
            
            <apx-chart
              #chart
              [series]="chartOptions.series"
              [chart]="chartOptions.chart"
              [xaxis]="chartOptions.xaxis"
              [stroke]="chartOptions.stroke"
              [colors]="chartOptions.colors"
              [dataLabels]="chartOptions.dataLabels"
              [legend]="chartOptions.legend"
              [markers]="chartOptions.markers"
              [grid]="chartOptions.grid"
              [yaxis]="chartOptions.yaxis"
              [title]="chartOptions.title"
            >
            </apx-chart>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
