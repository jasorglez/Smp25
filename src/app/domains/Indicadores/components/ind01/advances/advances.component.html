    <div class="card">
        <div class="card-body">
            <div class="container-fluid">
                <div class="mb-3">
                    <div class="col text-right"><button type="button" class="btn btn-primary me-1" (click)="addRow()"><i
                                class="bi bi-plus-lg" style="font-size: 1.5rem;"></i></button>
                        <button type="button" class="btn btn-success ms-1 me-1 position-relative" (click)="saveChanges()">
                            <i class="bi bi-floppy" style="font-size: 1.5rem;"></i>
                            <span
                                class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
                                *ngIf="notSavedChanges"><span class="visually-hidden">Hay cambios sin guardar</span>
                            </span>
                        </button>
                        <button type="button" class="btn btn-warning ms-1 me-1" (click)="revert()"><i class="bi bi-arrow-clockwise"
                            style="font-size: 1.5rem;"></i></button>
                        <button type="button" class="btn btn-danger ms-1 me-1" (click)="deleteEntry()"><i class="bi bi-trash"
                                style="font-size: 1.5rem;"></i></button>
                    </div>
                </div>
                <div class="row position-relative">
                    <div class="col-6 col-40">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">Tabla de Avances</h5>
                            </div>
                            <div class="card-body">
                                <ag-grid-angular
                                    style="width: 100%; height: 300px;"
                                    class="ag-theme-alpine"
                                    [rowData]="rowData"
                                    [columnDefs]="columnDefs"
                                    (cellValueChanged)="onCellValueChanged($event)">
                                </ag-grid-angular>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Divisor vertical -->
                    <div class="vertical-divider"></div>
                    
                    <div class="col-6 col-45">
                        
                        <!-- Card para la gráfica ApexCharts -->
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">Gráfica de Avances</h5>
                            </div>
                            <div class="card-body">
                                <apx-chart
                                [series]="chartOptions.series"
                                [chart]="chartOptions.chart"
                                [xaxis]="chartOptions.xaxis"
                                [stroke]="chartOptions.stroke"
                                [colors]="chartOptions.colors"
                                [dataLabels]="chartOptions.dataLabels"
                                [legend]="chartOptions.legend"
                                [markers]="chartOptions.markers"
                                [grid]="chartOptions.grid"
                                [yaxis]="chartOptions.yaxis"
                                [title]="chartOptions.title">
                                </apx-chart>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
