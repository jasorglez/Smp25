<!-- Modal: Nueva Medida -->
<div class="modal fade" [class.show]="showNewMedidaModal"
     [style.display]="showNewMedidaModal ? 'block' : 'none'"
     tabindex="-1" role="dialog" aria-modal="true" style="z-index: 20000;">
  <div class="modal-dialog modal-sm" role="document">
    <div class="modal-content">
      <div class="modal-header bg-info text-white py-2">
        <h6 class="modal-title mb-0">
          <i class="bi bi-plus-circle me-2"></i>Nueva Medida
        </h6>
        <button type="button" class="btn-close btn-close-white btn-sm" (click)="closeNewMedidaModal()"></button>
      </div>
      <div class="modal-body py-2">
        <div class="mb-2">
          <label class="form-label form-label-sm mb-1">Descripción</label>
          <input type="text" class="form-control form-control-sm"
                 [(ngModel)]="newMedidaDescription"
                 placeholder="Ej: DIA, HRS, MES..."
                 maxlength="10"
                 (keyup.enter)="saveNewMedida()" autofocus>
          <small class="text-muted">Máx. 10 caracteres</small>
        </div>
      </div>
      <div class="modal-footer py-1">
        <button type="button" class="btn btn-sm btn-secondary" (click)="closeNewMedidaModal()">Cancelar</button>
        <button type="button" class="btn btn-sm btn-info text-white" (click)="saveNewMedida()">
          <i class="bi bi-floppy me-1"></i>Guardar
        </button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show" *ngIf="showNewMedidaModal" style="z-index: 19999;"></div>

<!-- Controles de Zoom -->
<div class="row mb-3">
    <div class="col text-right">
        <div class="btn-group me-3" role="group" aria-label="Zoom Controls">
            <button type="button" class="btn btn-outline-secondary btn-sm" (click)="zoomToYear()" title="Vista Anual">
                <i class="bi bi-calendar-year"></i> Año
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" (click)="zoomToQuarter()" title="Vista Trimestral">
                <i class="bi bi-calendar-range"></i> Trim
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" (click)="zoomToMonth()" title="Vista Mensual">
                <i class="bi bi-calendar-month"></i> Mes
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" (click)="zoomToWeek()" title="Vista Semanal">
                <i class="bi bi-calendar-week"></i> Sem
            </button>
            <button type="button" class="btn btn-outline-secondary btn-sm" (click)="zoomToDay()" title="Vista Diaria">
                <i class="bi bi-calendar-day"></i> Día
            </button>
        </div>
    </div>
</div>

<!-- Botones y Gantt principal - TODO EN UNA SOLA FILA -->
<div class="row">
    <!-- Columna de botones a la IZQUIERDA -->
    <div class="col-auto">
        <div class="d-flex flex-column gap-1">
            <button type="button" class="btn btn-primary ms-1 me-1" (click)="outdentSelectedTasks()" title="Quitar sangría">
                <i class="bi bi-unindent"></i>
            </button>
            <button type="button" class="btn btn-primary ms-1 me-1" (click)="indentSelectedTasks()" title="Aplicar sangría">
                <i class="bi bi-indent"></i>
            </button>
            <button type="button" class="btn btn-success ms-1 me-1 position-relative" (click)="save()">
                <i class="bi bi-floppy"></i>
                <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-light rounded-circle"
                      *ngIf="notSavedChanges">
                    <span class="visually-hidden">Hay cambios sin guardar</span>
                </span>
            </button>
            <button type="button" class="btn btn-danger ms-1 me-1" (click)="deleteSelectedTasks()" title="Eliminar tareas">
                <i class="bi bi-trash"></i>
            </button>
            <button type="button" class="btn btn-info ms-1 me-1" (click)="exportToXLS()" title="Exportar a Excel">
                <i class="bi bi-filetype-xlsx"></i>
            </button>
            <button type="button" class="btn btn-info ms-1 me-1" (click)="exportToPDF()" title="Exportar a PDF">
                <i class="bi bi-file-earmark-pdf"></i>
            </button>
        </div>
    </div>
    <!-- Diagrama de Gantt a la DERECHA, en la MISMA fila -->
    <div class="col-11">
        <div id="gantt_here" style="width: 100%; height: 65vh;"></div>
    </div>
</div>

<div class="row mt-3">
    <div class="col-12">
        <ul class="nav nav-pills" id="myWorkprogram" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="personal-tab" data-bs-toggle="pill"
                    data-bs-target="#personal-tab-pane" type="button" role="tab" aria-controls="personal-tab-pane"
                    aria-selected="true">Personal</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="equipment-tab" data-bs-toggle="pill" data-bs-target="#equipment-tab-pane"
                    type="button" role="tab" aria-controls="equipment-tab-pane" aria-selected="false">Equipo</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="materials-tab" data-bs-toggle="pill" data-bs-target="#materials-tab-pane"
                    type="button" role="tab" aria-controls="materials-tab-pane"
                    aria-selected="false">Materiales</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="auxiliaries-tab" data-bs-toggle="pill"
                    data-bs-target="#auxiliaries-tab-pane" type="button" role="tab" aria-controls="auxiliaries-tab-pane"
                    aria-selected="false">Auxiliares</button>
            </li>
        </ul>
        <div class="tab-content" id="myWorkprogramContent">
            <div class="tab-pane fade show active" id="personal-tab-pane" role="tabpanel" aria-labelledby="personal-tab"
                tabindex="0">
                <app-personal></app-personal>
            </div>
            <div class="tab-pane fade" id="equipment-tab-pane" role="tabpanel" aria-labelledby="equipment-tab"
                tabindex="0">
                <app-equipment></app-equipment>
            </div>
            <div class="tab-pane fade" id="materials-tab-pane" role="tabpanel" aria-labelledby="materials-tab"
                tabindex="0">
                <app-materials></app-materials>
            </div>
            <div class="tab-pane fade" id="auxiliaries-tab-pane" role="tabpanel" aria-labelledby="auxiliaries-tab"
                tabindex="0">
                <app-auxiliars></app-auxiliars>
            </div>
        </div>
    </div>
</div>
