<div class="modal-header">
  <h5 class="modal-title">
    <i class="bi bi-box-seam me-2"></i>
    {{ isEdit ? 'Editar Material' : 'Nuevo Material' }}
  </h5>
  <button type="button" class="btn-close" aria-label="Close" (click)="onCancel()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="materialForm" (ngSubmit)="onSubmit()">

    <!-- Activo -->
    <div class="row mb-3">
      <div class="col-12">
        <div class="form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            id="activo"
            formControlName="activo"
          >
          <label class="form-check-label" for="activo">
            Material Activo
          </label>
        </div>
      </div>
    </div>

    <!-- Número de Material -->
    <div class="row mb-3">
      <div class="col-md-6">
        <label for="numMat" class="form-label">
          Número de Material <span class="text-danger">*</span>
        </label>
        <input
          type="text"
          class="form-control"
          id="numMat"
          formControlName="numMat"
          placeholder="Ej: MAT-001"
          [class.is-invalid]="materialForm.get('numMat')?.invalid && materialForm.get('numMat')?.touched"
        >
        <div class="invalid-feedback">
          El número de material es requerido
        </div>
      </div>

      <!-- Artículo -->
      <div class="col-md-6">
        <label for="articulo" class="form-label">
          Artículo <span class="text-danger">*</span>
        </label>
        <input
          type="text"
          class="form-control"
          id="articulo"
          formControlName="articulo"
          placeholder="Nombre del artículo"
          [class.is-invalid]="materialForm.get('articulo')?.invalid && materialForm.get('articulo')?.touched"
        >
        <div class="invalid-feedback">
          El nombre del artículo es requerido
        </div>
      </div>
    </div>

    <!-- Categoría -->
    <div class="row mb-3">
      <div class="col-md-6">
        <label for="categoria" class="form-label">
          Categoría <span class="text-danger">*</span>
        </label>
        <input
          type="text"
          class="form-control"
          id="categoria"
          formControlName="categoria"
          placeholder="Ej: Alimentos y Bebidas"
          [class.is-invalid]="materialForm.get('categoria')?.invalid && materialForm.get('categoria')?.touched"
        >
        <div class="invalid-feedback">
          La categoría es requerida
        </div>
      </div>

      <!-- Familia -->
      <div class="col-md-6">
        <label for="familia" class="form-label">
          Familia <span class="text-danger">*</span>
        </label>
        <input
          type="text"
          class="form-control"
          id="familia"
          formControlName="familia"
          placeholder="Ej: Bebidas"
          [class.is-invalid]="materialForm.get('familia')?.invalid && materialForm.get('familia')?.touched"
        >
        <div class="invalid-feedback">
          La familia es requerida
        </div>
      </div>
    </div>

    <!-- Subfamilia -->
    <div class="row mb-3">
      <div class="col-md-6">
        <label for="subfamilia" class="form-label">
          Subfamilia <span class="text-danger">*</span>
        </label>
        <input
          type="text"
          class="form-control"
          id="subfamilia"
          formControlName="subfamilia"
          placeholder="Ej: Refrescos"
          [class.is-invalid]="materialForm.get('subfamilia')?.invalid && materialForm.get('subfamilia')?.touched"
        >
        <div class="invalid-feedback">
          La subfamilia es requerida
        </div>
      </div>

      <!-- Proveedor -->
      <div class="col-md-6">
        <label for="proveedor" class="form-label">
          Proveedor <span class="text-danger">*</span>
        </label>
        <input
          type="text"
          class="form-control"
          id="proveedor"
          formControlName="proveedor"
          placeholder="Nombre del proveedor"
          [class.is-invalid]="materialForm.get('proveedor')?.invalid && materialForm.get('proveedor')?.touched"
        >
        <div class="invalid-feedback">
          El proveedor es requerido
        </div>
      </div>
    </div>

  </form>
</div>

<div class="modal-footer">
  <button
    type="button"
    class="btn btn-secondary"
    (click)="onCancel()"
    [disabled]="submitting"
  >
    <i class="bi bi-x-circle me-1"></i> Cancelar
  </button>
  <button
    type="button"
    class="btn btn-primary"
    (click)="onSubmit()"
    [disabled]="submitting || materialForm.invalid"
  >
    <i class="bi bi-check-circle me-1"></i>
    {{ isEdit ? 'Actualizar' : 'Crear' }}
  </button>
</div>
