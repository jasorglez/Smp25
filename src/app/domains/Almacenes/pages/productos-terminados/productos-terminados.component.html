<div class="col-md-12">
  <div class="card mt-3">
    <div class="card-header p-2">
      <h4 class="card-title">Productos Terminados</h4>
      <div class="card-tools">
        <button type="button" class="btn btn-success btn-sm" (click)="saveChanges()">
          <i class="fas fa-save"></i> Guardar
        </button>
        <button type="button" class="btn btn-secondary btn-sm" (click)="revertChanges()">
          <i class="fas fa-undo"></i> Revertir
        </button>
      </div>
    </div>
    <div class="card-body">
      <!-- Grid de Productos Terminados -->
      <ag-grid-angular                    
        style="width: 100%; height: 600px;"
        class="ag-theme-quartz small-text-ag-grid"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [gridOptions]="gridOptions"
        (gridReady)="onGridReady($event)"
        (cellValueChanged)="onCellValueChanged($event)">
      </ag-grid-angular>
    </div>
  </div>
</div>
