<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <img src="/logo_red_ciudadana.webp" alt="Logo" />
    </div>

    <h1 class="login-title">{{ 'titlelogin' | translate }}</h1>
    <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

    <form [formGroup]="flogin" (ngSubmit)="login()" autocomplete="off" class="login-form">

      <div class="field-group" [class.field-error]="invalidField('emaillogin')">
        <label class="field-label" for="emailInput">Correo electrónico</label>
        <div class="field-input-wrap">
          <i class="bi bi-envelope field-icon"></i>
          <input type="email" id="emailInput" class="field-input" formControlName="emaillogin"
            placeholder="correo@empresa.com" autocomplete="email" />
        </div>
        <span class="field-error-msg" *ngIf="invalidField('emaillogin')">
          <i class="bi bi-exclamation-circle"></i> Correo inválido.
        </span>
      </div>

      <div class="field-group" [class.field-error]="invalidField('passwordlogin')">
        <label class="field-label" for="passwordInput">Contraseña</label>
        <div class="field-input-wrap">
          <i class="bi bi-lock field-icon"></i>
          <input [type]="hide ? 'password' : 'text'" id="passwordInput" class="field-input"
            formControlName="passwordlogin" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="toggle-password" (click)="toggleHide()" tabindex="-1"
            [attr.aria-label]="hide ? 'Mostrar contraseña' : 'Ocultar contraseña'">
            <i class="bi" [ngClass]="hide ? 'bi-eye' : 'bi-eye-slash'"></i>
          </button>
        </div>
        <span class="field-error-msg" *ngIf="invalidField('passwordlogin')">
          <i class="bi bi-exclamation-circle"></i> Contraseña inválida.
        </span>
      </div>

      <button type="submit" class="btn-login" [disabled]="isLoading">
        <span *ngIf="isLoading" class="btn-spinner"></span>
        <i *ngIf="!isLoading" class="bi bi-box-arrow-in-right"></i>
        {{ isLoading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>

    </form>

    <div class="login-footer">
      <a href="https://bi2.mx" target="_blank" rel="noopener">bi2.mx</a>
      <span class="sep">·</span>
      <span>v{{ environment.version }}</span>
    </div>

  </div>
</div>
