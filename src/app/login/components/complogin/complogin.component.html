<div class="login-background" [style.backgroundImage]="'url(' + randomImage + ')'">
	<div class="overlay"></div>
  </div>

<div class="login-box" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1;">
	  <div class="login-logo" style="width: 100%;">
      <img src="/assets/img/template/bi3.webp" style="max-width: 100%; height: auto; display: block; margin: 0 auto;">
	  </div>
	  <!-- /.login-logo -->
	  <div class="card">
	    <div class="card-body">
	      <p class="login-box-msg" > {{ 'titlelogin' | translate}} </p>

	      <form
	      	autocomplete="off"
	      	[formGroup]="flogin"
	      	(ngSubmit)="login()"
	      >

	        <div class="form-floating mb-3">

                <input type="email"
				id="inputEmail"
                class="form-control"
                placeholder="{{ 'email' | translate}}"
                formControlName="emaillogin"
                [ngClass]="{'is-invalid': invalidField('emaillogin')}" >
				<label for="inputEmail">Correo Electrónico</label>

	          <div class="invalid-feedback">Please fill out this email correctly..</div>

	        </div>


			<div class="form-floating position-relative mb-3">
				<input [type]="hide ? 'password' : 'text'"
					   id="passwordInput"
					   formControlName="passwordlogin"
					   class="form-control pe-5"
					   placeholder="Contraseña"
					   autocomplete="current-password"
					   [ngClass]="{'is-invalid': invalidField('passwordlogin')}">
			  
				<label for="passwordInput">Contraseña</label>
			  
				<!-- Botón para mostrar/ocultar -->
				<button type="button"
						class="btn btn-sm btn-link position-absolute top-50 end-0 translate-middle-y me-2"
						(click)="toggleHide()"
						tabindex="-1"
						style="z-index: 5;">
				  <i class="fas" [ngClass]="{'fa-eye-slash': !hide, 'fa-eye': hide}"></i>
				</button>
			  
				<div class="invalid-feedback">
				  Contraseña inválida.
				</div>
			  </div>

	        <div class="row">
	          <!-- /.col -->
	          <div class="col-12">
	            <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm mt-3">
					<i class="fas fa-sign-in-alt me-2"></i> Iniciar Sesión
				  </button>
	          </div>
	          <!-- /.col -->
	        </div>
	      </form>


	    </div>
	    <!-- /.login-card-body -->
	  </div>
	</div>
	<!-- /.login-box -->
