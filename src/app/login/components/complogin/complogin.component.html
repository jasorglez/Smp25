<!-- Fondo con overlay -->
<div class="login-background" [style.backgroundImage]="'url(' + randomImage + ')'">
	<div class="overlay"></div>
  </div>
  
  <!-- Contenedor del Login -->
  <div class="login-box">
	
	<div class="login-logo text-center mb-4">
	  <img src="/assets/img/template/bi3.webp" class="img-fluid logo-with-blur" style="max-width: 280px;">
	</div>
  
	<div class="card rounded-4 border-0">
	  <div class="card-body p-4">
  
		<h5 class="text-center mb-4 fw-bold">{{ 'titlelogin' | translate }}</h5>
  
		<form [formGroup]="flogin" (ngSubmit)="login()" autocomplete="off">
		  <!-- Email -->
		  <div class="form-floating mb-3">
			<input type="email"
				   class="form-control"
				   id="emailInput"
				   formControlName="emaillogin"
				   placeholder="Correo Electrónico"
				   [ngClass]="{'is-invalid': invalidField('emaillogin')}">
			<label for="emailInput">Correo Electrónico</label>
			<div class="invalid-feedback">Correo inválido.</div>
		  </div>
  
		  <!-- Password -->
		  <div class="form-floating position-relative mb-3">
			<input [type]="hide ? 'password' : 'text'"
				   id="passwordInput"
				   formControlName="passwordlogin"
				   class="form-control pe-5"
				   placeholder="Contraseña"
				   autocomplete="current-password"
				   [ngClass]="{'is-invalid': invalidField('passwordlogin')}">
			<label for="passwordInput">Contraseña</label>
  
			<!-- Toggle button -->
			<button type="button"
					class="btn btn-sm btn-link position-absolute top-50 end-0 translate-middle-y me-2"
					(click)="toggleHide()"
					tabindex="-1"
					style="z-index: 5;">
			  <i class="bi" [ngClass]="{'bi-eye-slash': !hide, 'bi-eye': hide}"></i>
			</button>
  
			<div class="invalid-feedback">Contraseña inválida.</div>
		  </div>
  
		  <!-- Botón de inicio -->
		  <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm" [disabled]="isLoading">
			<span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
			<i *ngIf="!isLoading" class="bi bi-box-arrow-in-right me-2"></i>
			{{ isLoading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
		  </button>
		</form>
	  </div>
	</div>

	<div class="text-center mt-3 footer-login">
		<i class="bi bi-circle-fill me-2" style="font-size: 0.5rem; vertical-align: middle;"></i>
		<a href="https://bi2.mx" target="_blank">bi2.mx</a> - Versión {{environment.version}}
	</div>
  </div>

  <!-- Overlay de carga -->
  <div *ngIf="isLoading" class="loading-overlay">
	<div class="loading-content">
	  <div class="spinner-border text-primary mb-3" role="status">
		<span class="visually-hidden">Cargando...</span>
	  </div>
	  <h5 class="text-white">Iniciando sesión</h5>
	  <p class="text-white-50">Por favor espere</p>
	</div>
  </div>
