<div class="main-layout" [class.sidebar-collapsed]="isSidebarCollapsed">
  <!-- Sidebar -->
  <app-side-bar />

  <!-- Contenedor principal -->
  <div class="main-content-container d-flex flex-column min-vh-100">

    <!-- Banner: licencia próxima a vencer (< 5 días y no expirada) -->
    <div *ngIf="licenseDays() <= 5 && licenseStatus() !== 'expired'"
         class="alert alert-warning alert-dismissible mb-0 py-1 px-3 d-flex align-items-center gap-2"
         style="border-radius:0; font-size:0.85rem;">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span>
        Tu licencia de prueba vence en <strong>{{ licenseDays() }} día(s)</strong>.
        Contáctanos para activar tu cuenta.
      </span>
    </div>

    <!-- Bloqueo total: licencia expirada -->
    <div *ngIf="licenseStatus() === 'expired'"
         class="license-expired-overlay d-flex flex-column align-items-center justify-content-center">
      <div class="card shadow-lg p-4 text-center" style="max-width:420px;">
        <i class="bi bi-lock-fill text-danger" style="font-size:3rem;"></i>
        <h4 class="mt-3 text-danger">Licencia expirada</h4>
        <p class="text-muted">Tu período de prueba de 15 días ha concluido.<br>
          Contacta a soporte para activar tu licencia y continuar usando la plataforma.</p>
        <a href="mailto:soporte@bi2.mx" class="btn btn-danger mt-2">
          <i class="bi bi-envelope-fill me-1"></i> Contactar soporte
        </a>
      </div>
    </div>

    <div class="flex-grow-1 pt-2 ps-0 pe-2" [class.d-none]="licenseStatus() === 'expired'">
      <router-outlet></router-outlet>
    </div>
    <app-footer></app-footer>
  </div>
</div>
