version: '3.8'

services:
  Smp25:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Smp25
    restart: unless-stopped
    ports:
      - "8080:80" # Puerto local:contenedor
    networks:
      - Smp25-network
    labels:
      - "com.Smp25.version=2.50.4"
      - "com.Smp25.service=frontend"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  Smp25-network:
    driver: bridge
