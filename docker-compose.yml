name: hco-siaf-frontend
services:
  hco-siaf-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: hco-siaf-frontend:latest
    container_name: hco-siaf-frontend
    restart: unless-stopped
    ports:
      - "8080:80" # Puerto local:contenedor
    networks:
      - hco-siaf-network
    labels:
      - "com.hco-siaf.version=6.0.25"
      - "com.hco-siaf.service=fronend"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  hco-siaf-network:
    driver: bridge
