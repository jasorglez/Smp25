name: Test Build (No Deploy)

# Solo se ejecuta en develop (no en main = no riesgo)
on:
  push:
    branches: [ develop ]

jobs:
  test-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build Angular (test only)
      run: npm run build
      
    - name: Show build success
      run: echo "✅ Build completed successfully! No deployment yet."