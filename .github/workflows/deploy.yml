name: Deploy
on: 
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Production
      run: |
        # Configurar clave SSH
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        
        # Ejecutar deploy
        ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'bash /bi/repos/Smp25/deploy.sh && docker exec Smp25-Frontend test -f /usr/share/nginx/html/assets/media/inicio/manifest.json && docker exec Smp25-Frontend curl -fsS http://localhost/assets/media/inicio/manifest.json > /dev/null'
        
        # Limpiar
        rm ~/.ssh/deploy_key
      
    - name: Deployment Status
      if: success()
      run: echo "✅ Deploy exitoso a biapp.com.mx"
