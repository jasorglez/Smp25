name: Deploy to Server
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy with Full Output
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Activar modo debug y capturar TODO
          set -x
          exec 2>&1
          
          echo "=== INICIO ==="
          cd /bi/repos/Smp25
          echo "PWD: $(pwd)"
          echo "GIT STATUS ANTES:"
          git status --short
          
          echo "HACIENDO GIT PULL..."
          git pull origin main
          echo "GIT STATUS DESPUÉS:"
          git status --short
          echo "ÚLTIMO COMMIT:"
          git log --oneline -1
          
          echo "DOCKER COMPOSE..."
          docker compose down
          docker compose build --no-cache
          docker compose up -d
          
          echo "VERIFICACIÓN FINAL:"
          docker ps
          echo "=== FIN ==="
