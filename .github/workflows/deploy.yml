name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy Application
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          echo "🚀 Iniciando deploy..."
          
          # Navega al directorio
          cd /bi/repos/Smp25 || { echo "❌ Directorio no existe"; exit 1; }
          
          echo "1. Deteniendo contenedores..."
          docker compose down || echo "⚠️  No había contenedores corriendo"
          
          echo "2. Actualizando código..."
          git pull origin main
          
          echo "3. Construyendo imagen Docker..."
          docker compose build --no-cache
          
          echo "4. Iniciando contenedores..."
          docker compose up -d
          
          echo "✅ ¡Deploy completado!"
          echo ""
          echo "📊 Estado actual:"
          docker ps
