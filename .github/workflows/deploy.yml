name: Deploy
on: push
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Simple SSH Deploy
      run: |
        # Crear clave
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/key
        chmod 600 /tmp/key
        
        # Comando ÚNICO que funciona
        ssh -o "StrictHostKeyChecking=no" \
            -i /tmp/key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "cd /bi/repos/Smp25 && \
             echo '1. Git pull...' && git pull origin main && \
             echo '2. Docker down...' && docker compose down && \
             echo '3. Docker build...' && docker compose build --no-cache && \
             echo '4. Docker up...' && docker compose up -d && \
             echo '✅ Listo!' && docker ps"
